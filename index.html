/* =========================================================
   SRS ENGINE (Leitner boxes)
   ========================================================= */
const INTERVALS=[0,1,3,7,14,30];
function allCards(){return [...VOCAB.map(v=>v.tier==="a2"&&S.unlocked&&S.unlocked[v.id]?{...v,ctx:S.unlocked[v.id].ctx}:v),...S.custom.map(c=>({...c,t:c.t||"x",pack:-1}))]}
function cardState(id){return S.cards[id]}
function learnedCount(){return Object.values(S.cards).filter(c=>c.box>=2).length}
function seenCount(){return Object.keys(S.cards).length}
function learnedIn(f){return VOCAB.filter(v=>f(v)&&S.cards[v.id]&&S.cards[v.id].box>=2).length}
function coreLearned(){return learnedIn(v=>v.tier==="core")}
function deckLearned(){return learnedIn(v=>v.tier!=="a2")}   // core + A1 words
function wordsLearned(){return learnedIn(()=>true)}
function vocabLearned(){return coreLearned()}
function dueCards(){const now=Date.now();return allCards().filter(c=>{const s=S.cards[c.id];return s&&s.due<=now})}
function newToday(){return S.newLog.date===localDate()?S.newLog.count:0}
function newAvailable(){const left=Math.max(0,S.newPerDay-newToday());const un=S.unlocked||{};const fromStories=VOCAB.filter(v=>v.tier==="a2"&&un[v.id]&&!S.cards[v.id]).map(v=>({...v,ctx:un[v.id].ctx}));const unseen=[...S.custom.filter(c=>!S.cards[c.id]),...fromStories,...VOCAB.filter(v=>v.tier!=="a2"&&!S.cards[v.id]&&!linkedCustom(v.id))];return unseen.slice(0,left)}
function rateCard(id,grade){
  const now=Date.now(); let s=S.cards[id];
  if(!s){s={box:0,due:now,seen:0};S.cards[id]=s;const d=localDate();if(S.newLog.date!==d)S.newLog={date:d,count:0};S.newLog.count++}
  s.seen++; s.last=now;
  if(grade===0){s.box=0;s.due=now+60e3}
  else if(grade===1){s.box=Math.max(1,s.box);s.due=now+Math.max(1,Math.round(INTERVALS[s.box]/2))*DAY}
  else {s.box=Math.min(5,s.box+1);s.due=now+INTERVALS[s.box]*DAY- 3*3600e3}
  save();
}

/* =========================================================
   COURSE LOGIC
   ========================================================= */
function storiesAll(){return [...STORIES,...S.gen]}
function storyDoneAt(level,min){return storiesAll().filter(s=>s.level===level&&S.stories[s.id]&&S.stories[s.id].comp>=min).length}
function inputSessions(){return Object.keys(S.stories).length+S.time.filter(t=>t.p==="input-ext").length}
/* Output opens in two steps. Shadowing first (copying audio, no translating), then speaking, writing and talk.
   Anyone who already did a non-shadow output session under the old gate keeps full access. */
const GATE={shadow:{words:120,sessions:5},full:{words:250,sessions:10,day:28}};
function outputUnlocked(){return S.outputOverride||(wordsLearned()>=GATE.full.words&&inputSessions()>=GATE.full.sessions)||daysSince(S.start)+1>=GATE.full.day||S.outputs.some(o=>o.type!=="shadow")}
function shadowUnlocked(){return outputUnlocked()||(wordsLearned()>=GATE.shadow.words&&inputSessions()>=GATE.shadow.sessions)}
function gateBar(label,have,need){const h=Math.min(have,need);return `<div class="stack" style="gap:5px"><div class="spread small"><span>${label}</span><span class="num">${h}/${need}</span></div><div class="bar ${h>=need?"":"y"}"><span style="width:${h/need*100}%"></span></div></div>`}
function levelInfo(){
  const NC=TIER_N.core, ND=TIER_N.core+TIER_N.a1, NT=VOCAB.length;
  const reqA1=[[`Learn the ${NC} core words`,Math.min(coreLearned(),NC),NC],["Read 3 A0 stories at 70%+ comprehension",Math.min(storyDoneAt("A0",70),3),3]];
  const reqA2=[[`Learn the core and A1 words (${ND})`,Math.min(deckLearned(),ND),ND],["Read 3 A1 stories at 70%+ comprehension",Math.min(storyDoneAt("A1",70),3),3],["Complete 10 output sessions",Math.min(S.outputs.length,10),10],["Do 1 feedback review",Math.min(S.reviews.length,1),1]];
  const reqEnd=[[`Learn all ${NT} words`,Math.min(wordsLearned(),NT),NT],["Read 3 A2 stories at 70%+ comprehension",Math.min(storyDoneAt("A2",70),3),3]];
  const met=r=>r.every(x=>x[1]>=x[2]);
  if(!S.reached)S.reached={};
  levelMigrate(); metSync(); absorbStoryCopies();
  const R=S.reached;let ch=false;
  if(!R.A1&&met(reqA1)){R.A1=localDate();ch=true}
  if(R.A1&&!R.A2&&met(reqA2)){R.A2=localDate();ch=true}
  if(R.A2&&!R.done&&met(reqEnd)){R.done=localDate();ch=true}
  if(ch)save();
  return {level:R.A2?"A2":R.A1?"A1":"A0",reqA1,reqA2,reqEnd,done:!!R.done};
}
/* When the story word lists change, re-count words from stories already finished (60%+), so earlier reading still counts. */
const MET_V=2;
function metSync(){
  if(S.metV===MET_V) return; S.metV=MET_V;
  for(const st of storiesAll()){const r=S.stories[st.id]; if(r&&r.comp>=60) recordMet(st,r.comp)}
  save();
}
/* Levels reached under the old rules (250 of the original 300 words) stay reached. Runs once per saved state. */
function levelMigrate(){
  if(S.levelV===2) return; S.levelV=2;
  const oldL=Array.from({length:300},(_,i)=>"v"+(i+1)).filter(id=>S.cards[id]&&S.cards[id].box>=2).length;
  const a1=oldL>=250&&storyDoneAt("A0",70)>=3, a2=a1&&storyDoneAt("A1",70)>=3&&S.outputs.length>=10&&S.reviews.length>=1;
  if(a1&&!S.reached.A1)S.reached.A1=localDate(); if(a2&&!S.reached.A2)S.reached.A2=localDate();
  save();
}
function phaseName(){
  const d=daysSince(S.start)+1;
  if(coreLearned()<TIER_N.core&&d<=35) return ["Phase 0 · Bootstrap","Core words make input usable. Light graded reading alongside."];
  if(!outputUnlocked()) return ["Input anchor",shadowUnlocked()?"Input is the daily habit. Shadowing is open; speaking and writing come next.":"Input is the daily habit. Output opens once you have basic footing."];
  return ["Full rhythm","Daily input, 2–4 output sessions a week, grammar on demand, weekly feedback."];
}
function weekTime(){const ws=weekStart();const o={input:0,words:0,output:0,grammar:0};S.time.filter(t=>t.d>=ws).forEach(t=>{const k=t.p==="input-ext"?"input":t.p;if(k in o)o[k]+=t.m});return o}
function todayTime(p){const d=localDate();return S.time.filter(t=>t.d===d&&(t.p===p||(p==="input"&&t.p==="input-ext"))).reduce((a,t)=>a+t.m,0)}
function outputsThisWeek(){const ws=weekStart();return S.outputs.filter(o=>o.date>=ws).length}
function triggeredTopics(){return GRAMMAR.filter(g=>(S.flags[g.id]||0)>=2).sort((a,b)=>(S.flags[b.id]||0)-(S.flags[a.id]||0))}
function lastReview(){return S.reviews[S.reviews.length-1]}
function outputsSinceReview(){const lr=lastReview();return S.outputs.filter(o=>o.text&&(!lr||o.ts>lr.ts))}
function feedbackDue(){const lr=lastReview();return outputsSinceReview().length>=3&&(!lr||daysSince(lr.date)>=6)}
function lastComp(){const e=Object.entries(S.stories).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0))[0];return e?e[1]:null}
function recommendedStory(){
  const {level}=levelInfo(); const lc=lastComp();
  let target=level;
  if(lc){const order=["A0","A1","A2"];let i=order.indexOf(lc.level||level);if(lc.comp>90&&!(lc.gap>=25))i=Math.min(2,i+1);else if(lc.comp<60)i=Math.max(0,i-1);else i=order.indexOf(lc.level||level);target=order[i]}
  const pool=storiesAll().filter(s=>s.level===target);
  return pool.find(s=>!S.stories[s.id])||pool.find(s=>S.stories[s.id].comp<70)||storiesAll().find(s=>!S.stories[s.id])||pool[0];
}
function flagTopic(tags,sentence){
  if(!tags.length){S.confNotes.unshift({text:sentence,date:localDate()});S.confNotes=S.confNotes.slice(0,30);save();return null}
  let hit=null;
  tags.forEach(t=>{S.flags[t]=(S.flags[t]||0)+1;S.flagEx[t]=sentence;if(S.flags[t]===2)hit=t});
  save(); return hit;
}

function stat(n,l){return `<div><div class="num" style="font-family:var(--display);font-size:34px;font-weight:700;line-height:1">${n}</div><div class="small muted">${l}</div></div>`}
function reqPanel(title,req,done){
  return `<div class="panel stack"><div class="spread"><h3>${title}</h3>${done?'<span class="pill good">Reached</span>':""}</div>${req.map(r=>`<div class="stack" style="gap:5px"><div class="spread small"><span>${esc(r[0])}</span><span class="num muted">${r[1]}/${r[2]}</span></div><div class="bar ${r[1]>=r[2]?"":"y"}"><span style="width:${r[1]/r[2]*100}%"></span></div></div>`).join("")}</div>`;
}
function renderSignals(){
  const ws=weekStart(); const cur=S.signals.find(s=>s.week===ws);
  const pts=S.signals.slice(-10);
  let chart="";
  if(pts.length){
    const W=300,H=120,px=26,py=12; const n=pts.length;
    const x=i=>n===1?W/2:px+i*(W-px-10)/(n-1); const y=v=>py+(5-v)*(H-2*py)/4;
    const line=k=>pts.map((p,i)=>`${x(i)},${y(p[k])}`).join(" ");
    chart=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto" role="img" aria-label="Signal history">
      ${[1,3,5].map(v=>`<line x1="${px}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" font-size="10" fill="var(--ink-3)">${v}</text>`).join("")}
      <polyline points="${line("pred")}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <polyline points="${line("prod")}" fill="none" stroke="var(--m)" stroke-width="2" stroke-dasharray="5 4"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.pred)}" r="3" fill="var(--ink)"/><circle cx="${x(i)}" cy="${y(p.prod)}" r="3" fill="var(--m)"/>`).join("")}
      ${pts.map((p,i)=>(i===0||i===n-1)?`<text x="${x(i)}" y="${H+14}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${esc(fmtDate(p.week))}</text>`:"").join("")}
    </svg>
    <div class="legend"><span><i style="background:var(--ink)"></i>Predicting words</span><span><i style="background:var(--m)"></i>Speaking without translating</span></div>`;
  }
  let advice="";
  if(cur){advice=cur.pred<3&&cur.prod<3?"Both signals are low. That's normal early on: keep input daily and don't force output.":cur.pred<3?"Comprehension is lagging. Lean on input: more reading and listening at 70–90%.":cur.prod<3?"You understand more than you can say. Lean on output and feedback this week.":"Both signals are healthy. Keep the rhythm and nudge the difficulty up."}
  return `<div class="panel stack">
    <div class="spread"><h3>Two signals</h3>${cur?'<span class="pill good">Checked in</span>':""}</div>
    ${chart||'<p class="small muted">Check in once a week. Your answers will draw a line here so you can see both signals move.</p>'}
    ${cur?`<p class="small">${advice}</p>`:`
    <div class="stack" style="gap:10px">
      <div><label class="lbl" for="sgPred">When I read or listen, I anticipate words before the sentence ends.</label><div class="slider-row"><span class="small muted">never</span><input type="range" id="sgPred" min="1" max="5" value="2"><span class="small muted">often</span></div></div>
      <div><label class="lbl" for="sgProd">I can say simple sentences without translating in my head first.</label><div class="slider-row"><span class="small muted">never</span><input type="range" id="sgProd" min="1" max="5" value="2"><span class="small muted">often</span></div></div>
      <div><button class="btn primary small" id="sgSave">Save check-in</button></div>
    </div>`}
  </div>`;
}
/* One place for every "go do this" button: Today's plan, the story steps, the welcome page. */
function runGo(action){const [t,sub]=String(action).split(":");
  if(t==="abc"){openAbc();return}
  if(t==="how"){openHow(false);return}
  if(t==="sounds"){SD=null;VIEW.sTab=sub==="general"?"general":"lessons";VIEW.sLesson=sub==="general"?null:curLesson();go("grammar","__sounds");return}
  if(t==="relisten"){READ=null;VIEW.relisten=sub;go("input",sub);return}
  if(t==="input"){VIEW.relisten=null;if(sub==="__dict")DICT=null}
  if(t==="signals"){document.getElementById("signals").scrollIntoView({behavior:"smooth"});return}
  go(t,sub||null)}
afterRender.today=()=>{
  $$("[data-go]").forEach(b=>b.onclick=()=>runGo(b.dataset.go));
  const vo=$("#voiceOff"); if(vo) vo.onclick=()=>{S.settings.voiceNoteOff=1;save();render()};
  $("#bkFile").onclick=saveBackupFile;
  const ro=$("#remOn"); if(ro) ro.onclick=turnOnReminders;
  const rt=$("#remTime"); if(rt) rt.onchange=()=>{S.settings.remTime=rt.value||"19:00";save();$("#remCal").href=calLink(S.settings.remTime)};
  $("#bkLoad").onclick=()=>$("#bkFileIn").click();
  $("#bkFileIn").onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    const r=new FileReader();r.onload=()=>{const obj=parseBackup(String(r.result||""));
      if(!obj){toast("That file isn't a Platform One backup.");return}
      const n=VOCAB.filter(v=>obj.cards&&obj.cards[v.id]&&obj.cards[v.id].box>=2).length,st=Object.keys(obj.stories||{}).length;
      $("#bkArea").innerHTML=`<div class="stack" style="gap:8px"><span class="small">This backup has <b>${n} word${n===1?"":"s"} learned</b> and <b>${st} stor${st===1?"y":"ies"} read</b>. Restoring replaces the progress in this browser.</span><div class="row"><button class="btn small primary" id="bkYes">Restore it</button><button class="btn small ghost" id="bkNo">Cancel</button></div></div>`;
      $("#bkYes").onclick=()=>{S=Object.assign(defaultState(),obj);save();render();toast("Progress restored")};
      $("#bkNo").onclick=()=>{$("#bkArea").innerHTML=""}};
    r.onerror=()=>toast("That file couldn't be read.");r.readAsText(f)};
  const sv=$("#sgSave"); if(sv) sv.onclick=()=>{S.signals.push({week:weekStart(),pred:+$("#sgPred").value,prod:+$("#sgProd").value});save();render();toast("Check-in saved")};
  $("#bkCopy").onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{await navigator.clipboard.writeText(code);toast("Backup code copied")}catch(e){$("#bkArea").innerHTML=`<textarea readonly id="bkTxt" class="small">${esc(code)}</textarea><p class="small muted">Select all and copy this code.</p>`;$("#bkTxt").select()}};
  $("#bkShow").onclick=()=>{$("#bkArea").innerHTML=`<div class="stack"><textarea id="bkIn" class="small" placeholder="Paste your backup code"></textarea><div class="row"><button class="btn small primary" id="bkGo">Restore</button><span class="small muted">This replaces the progress in this browser.</span></div></div>`;$("#bkGo").onclick=()=>{try{const obj=JSON.parse(decodeURIComponent(escape(atob($("#bkIn").value.trim()))));if(!obj||obj.v!==1)throw 0;S=Object.assign(defaultState(),obj);save();render();toast("Progress restored")}catch(e){toast("That code didn't work. Copy the whole code and try again.")}}};
  $("#rsShow").onclick=()=>{$("#bkArea").innerHTML=`<div class="row"><span class="small">Erase all progress in this browser?</span><button class="btn small" id="rsGo" style="border-color:var(--bad);color:var(--bad)">Erase everything</button><button class="btn small ghost" id="rsNo">Keep it</button></div>`;$("#rsGo").onclick=()=>{S=defaultState();save();render();toast("Started over")};$("#rsNo").onclick=()=>$("#bkArea").innerHTML=""};
};

function startReview(){
  absorbStoryCopies();
  const q=[...dueCards().sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due),...newAvailable()];
  REV={queue:q.map(c=>c.id),i:0,flipped:false,t0:Date.now(),done:0,total:q.length};
}
function cardById(id){return allCards().find(c=>c.id===id)}
function deHTML(c){
  if(c.g&&c.de.includes(" ")){const [art,...rest]=c.de.split(" ");return `<span class="art">${esc(art)}</span> ${esc(rest.join(" "))}`}
  return esc(c.de);
}

function deckForms(){
  if(DECK_FORMS) return DECK_FORMS; DECK_FORMS=new Map();
  VOCAB.forEach(v=>{if(v.tier==="a2"||!(v.pack>=0))return;
    v.de.replace(/\s*\(Pl\.\)$/,"").split(",").forEach(part=>{const k=part.trim().replace(/^(der|die|das) /,"").replace(/[!?.…]+$/,"").trim().toLowerCase();
      if(!k)return; if(!DECK_FORMS.has(k))DECK_FORMS.set(k,[]); DECK_FORMS.get(k).push(v.id)})});
  return DECK_FORMS}
function storyDeckIds(st){
  const e=STORY_DECK[st.id];
  if(e!==undefined) return e?e.split(",").map(i=>VOCAB[+i]&&VOCAB[+i].id).filter(Boolean):[];
  // stories written later have no prepared list: match the plain word forms
  const out=new Set(),txt=" "+(st.s||[]).map(x=>x[0]).join(" ").toLowerCase().replace(/[„“"‚(),.!?:;–]/g," ").replace(/\s+/g," ")+" ";

function packMet(){
  const fin=storiesAll().filter(st=>S.stories[st.id]&&S.stories[st.id].comp>=60),key=fin.map(s=>s.id).join("|");
  if(PACK_MET&&PACK_MET.key===key) return PACK_MET.m;

  const m=PACK_NAMES.map(()=>0); met.forEach(id=>{const v=VMAP[id]; if(v&&v.tier!=="a2"&&v.pack>=0) m[v.pack]++});
  PACK_MET={key,m}; return m}

function packOpen(p){
  if(p===0) return true;

function newPacks(){

  const out=[]; Object.entries(S.packsOpen).forEach(([p,o])=>{if(!o.told){o.told=1; out.push({p:+p,how:o.how})}});

/* ---------- words added from stories ----------

function deckIdFor(word,r){
  if(r&&r.v&&VMAP[r.v.id]) return r.v.id;

  const a=S.cards[c.id],b=S.cards[v.id];

  let ch=false;

  // the deck word already has its own card, or an A2 word was added from stories: the story copy goes
  S.custom.slice().forEach(c=>{const v=c.vid&&VMAP[c.vid];if(v&&deckReached(v)){mergeInto(c,v);ch=true}});

function removeStoryWord(id){

function numDe(n){

  if(n<20) return o[n];
  if(n<100) return u100(n,true);
  if(n>=1100&&n<2000&&n%100!==0) return u100(Math.floor(n/100),true)+"hundert"+(n%100?u100(n%100,true):""); // years: 1999
  if(n<1000) return u1000(n,true);
  if(n<1000000){const th=Math.floor(n/1000),r=n%1000;return (th===1?"ein":u1000(th,false))+"tausend"+(r?u1000(r,true):"")}

const QTYPE={gist:"Story",word:"Word in context",phrase:"Sentence",reason:"Inference"};
const QBAN=new Set(["diese","dieser","dieses","nicht","aber","auch","sehr","dann","oder","immer","wieder","noch","schon","viele","jeden","weil","dass","obwohl","meine","meinen","meiner","seine","seinen","ihre","ihren","ihrer","einen","einem","einer","zusammen","zuerst","heiße","heute","morgen"]);
function hstr(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h}
function cleanEn(en){return String(en).split(/\s*[\/;(,]\s*/)[0].trim()}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stripTok(t){return t.replace(/^[„“"'(‚–]+|[.,!?:;“”"')]+$/g,"")}
function wordCands(de){const out=[];for(const t of tokInfo(de)){const w=t.w;if(!w)continue;if(w.length<5||QBAN.has(w.toLowerCase())||NAMES.has(w))continue;const r=lookup(w,t.initial);if(!r||r.kind==="name")continue;const en=cleanEn(r.en);if(en.length<3||en.length>22||/\bthe\b/.test(en))continue;out.push({w,en})}return out.sort((a,b)=>b.w.length-a.w.length)}
function buildQuiz(st){
  const n=st.s.length,h=hstr(st.id),out=[];
  (st.q||[]).slice(0,st.r?2:3).forEach(q=>{let o=q[1],a=q[2];if(o.length>=3){const c0=o[a];o=shuf([...o]);a=o.indexOf(c0)}out.push([q[0],o,a,"gist"])});
  const all=[];st.s.forEach((x,i)=>{if((x[2]||[]).includes("g-sep"))return;wordCands(x[0]).forEach(c=>all.push({...c,i}))});
  const pm=new Map();all.forEach(c=>pm.set(c.en.toLowerCase(),c.en));
  const picked=[],used=new Set(),usedS=new Set();
  const take=c=>{if(c&&!used.has(c.en.toLowerCase())&&!usedS.has(c.i)){picked.push(c);used.add(c.en.toLowerCase());usedS.add(c.i)}};
  for(const off of [h%n,(h+Math.floor(n/2))%n,(h+1)%n,(h+3)%n,(h+5)%n,(h+7)%n]){if(picked.length>=2)break;take(all.find(c=>c.i===off))}
  for(const c of all){if(picked.length>=2)break;take(c)}
  for(const c of picked){
    let ds=shuf([...pm.entries()].filter(([k])=>k!==c.en.toLowerCase()).map(([,v])=>v)).slice(0,2);
    if(ds.length<2){for(const e of shuf(Object.values(GLOSS).map(cleanEn).filter(e=>e.length>=3&&e.length<=16&&!/\bthe\b/.test(e)&&e.toLowerCase()!==c.en.toLowerCase()))){if(ds.length>=2)break;if(!ds.some(d=>d.toLowerCase()===e.toLowerCase()))ds.push(e)}}
    if(ds.length<2)continue;
    const o=shuf([c.en,...ds]);
    out.push(["In “"+st.s[c.i][0]+"” — what does “"+c.w+"” mean?",o,o.indexOf(c.en),"word"]);
  }
  let pi=-1;for(let k=0;k<n;k++){const j=(h+Math.floor(n/4)+1+k)%n;if(!usedS.has(j)&&st.s[j][0].length>=24){pi=j;break}}
  if(pi<0)pi=(h+1)%n;
  const eng=[...new Set([2,5,3,1,4,6].map(d=>st.s[(pi+d)%n][1]).filter(e=>e!==st.s[pi][1]))].slice(0,2);
  if(eng.length===2){const o=shuf([st.s[pi][1],...eng]);out.push(["Which English sentence matches “"+st.s[pi][0]+"”?",o,o.indexOf(st.s[pi][1]),"phrase"])}
  if(st.r){const c=st.r[1][st.r[2]];const o=shuf([...st.r[1]]);out.push([st.r[0],o,o.indexOf(c),"reason"])}
  return out;
}
function quizReport(QZ,ans,c,answered){
  const types={};QZ.forEach((q,i)=>{const t=q[3]||"gist";types[t]=types[t]||[0,0];types[t][1]++;if(ans[i]===q[2])types[t][0]++});
  const right=QZ.filter((q,i)=>ans[i]===q[2]).length,total=QZ.length,pct=Math.round(100*right/total),complete=answered===total;
  const rate=t=>types[t]?types[t][0]/types[t][1]:null;const msgs=[];let gap=null;
  if(!complete){msgs.push("Answer every question to compare your rating with the quiz.")}
  else{
    gap=c-pct;
    if(gap>=25)msgs.push("You rated yourself well above the quiz result. Trust the quiz a little more and choose slightly easier material next.");
    else if(gap<=-25)msgs.push("You understood more than you rated. You can probably try slightly harder material.");
    else msgs.push("Your rating and the quiz roughly agree, so your self-rating looks well calibrated.");
    const g=rate("gist"),w=rate("word"),p=rate("phrase"),r=rate("reason");
    if(w!==null&&p!==null){
      if(p>=1&&w<=0.5)msgs.push("Sentence right, words missed: you may be remembering whole phrases without the words inside them. Tap the words you missed and save them to review.");
      else if(w>=1&&p<=0)msgs.push("Words right, sentence missed: you know the words but not how they fit together. Check the grammar tips for this story.");
      else if(w<=0.5&&p<=0)msgs.push("Both words and sentences slipped. This story may be a step too hard.");
    }
    if(g!==null&&g<=0.34)msgs.push("Story questions slipped: next time, read for what happens before checking words.");
    if(r!==null&&r<1)msgs.push("The inference question slipped: after each paragraph, ask yourself why it happened.");
  }
  const names={gist:"Story",word:"Words",phrase:"Sentence",reason:"Inference"};
  const bd=Object.keys(types).map(t=>names[t]+" "+types[t][0]+"/"+types[t][1]).join(" · ");
  const html='<div class="stack" style="gap:8px"><div class="spread"><span>You rated <b class="num">'+c+'%</b></span><span>Quiz <b class="num">'+pct+'%</b> ('+right+'/'+total+')</span></div><div class="small muted">'+bd+'</div>'+msgs.map(m=>'<p class="small">'+m+'</p>').join("")+'<p class="small muted">The quiz is a cross-check, not your score: it can\'t see everything you understood or missed.</p></div>';
  return {pct,gap,types,html};
}
/*QUIZ-END*/
function calibMsg(c){
  if(c<60) return ["hard","Too hard right now. Below about 60%, your brain can't pull patterns out of the noise. Reread it in a few days or drop back a level."];
  if(c<70) return ["easy","A bit hard. Fine to keep going, but mix in easier texts so most of your input sits in the sweet spot."];
  if(c<=90) return ["sweet","Sweet spot. You followed the story and still met new words and structures. This is where acquisition happens."];
  return ["easy","Too easy to teach you much. Move up a level or pick longer texts."];
}

/* A2 words for the story generator: ones met once first, then ones never met, in frequency order. */
function a2Targets(n){

const RL_INT=[3,7,16,35]; // days until a read story comes back as a listen-only task
function LS(){if(!S.relisten)S.relisten={};if(!S.listenLog)S.listenLog=[];if(!S.dictLog)S.dictLog=[];return S}
function addDays(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return localDate(x)}
function relistenSync(){
  LS();let ch=false;
  for(const [id,r] of Object.entries(S.stories)){if(r&&r.comp>=60&&!S.relisten[id]&&storiesAll().some(s=>s.id===id)){S.relisten[id]={step:0,due:addDays(r.date||localDate(),RL_INT[0]),done:false};ch=true}}
  if(ch)save();
}
function relistenDue(){LS();const t=localDate();return Object.entries(S.relisten).filter(([id,r])=>!r.done&&r.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>storiesAll().find(s=>s.id===id)).filter(Boolean)}
function lastEar(id){const l=LS().listenLog.filter(x=>x.id===id);return l.length?l[l.length-1].ear:null}
function relistenSave(st,ear,mins){
  LS();const r=S.relisten[st.id]||{step:0};const prev=lastEar(st.id);
  if(ear>=80)r.step=(r.step||0)+1;else if(ear<60)r.step=Math.max(0,(r.step||0)-1);
  if(r.step>=RL_INT.length){r.done=true}else{r.done=false;r.due=addDays(localDate(),RL_INT[r.step])}
  S.relisten[st.id]=r;
  S.listenLog.push({d:localDate(),ts:Date.now(),id:st.id,kind:"relisten",ear});if(S.listenLog.length>400)S.listenLog.splice(0,S.listenLog.length-400);

}
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
function gapStats(days=14){
  LS();const since=localDate(new Date(Date.now()-days*DAY));
  const read=avg(Object.values(S.stories).filter(s=>s&&s.date>=since&&typeof s.comp==="number").map(s=>s.comp));
  const ear=avg(S.listenLog.filter(l=>l.d>=since).map(l=>l.ear));
  return {read,ear,gap:read!==null&&ear!==null?read-ear:null};
}
function weeklySeries(n=8){
  LS();const wk=d=>weekStart(new Date(d+"T12:00:00"));const out=[];
  for(let k=n-1;k>=0;k--){const ws=weekStart(new Date(Date.now()-k*7*DAY));
    out.push({ws,read:avg(Object.values(S.stories).filter(s=>s&&s.date&&wk(s.date)===ws).map(s=>s.comp)),ear:avg(S.listenLog.filter(l=>wk(l.d)===ws).map(l=>l.ear))})}

}
function gapChart(ser){

    ${ser.map((s,i)=>`<rect class="gap-hit" data-wk="${i}" x="${x(i)-(W-pl-pr)/(2*(n-1))}" y="${pt}" width="${(W-pl-pr)/(n-1)}" height="${H-pt-pb}" fill="transparent"/>`).join("")}
  </svg>`;
}

function dTok(s){return String(s).split(/\s+/).map(w=>w.replace(/^[„“"'(‚‘–—-]+|[.,!?:;“”"')’‘–—-]+$/g,"")).filter(w=>w&&!/^[–—-]+$/.test(w))}

function spellParts(s){ // returns [shown character, what the voice reads, hint]
  const out=[];
  for(const ch0 of String(s).normalize("NFC")){
    if(ch0==="ß"){out.push(["ß","Eszett","ess-TSET"]);continue}
    const ch=ch0.toUpperCase();
    if(LMAP[ch]){out.push([ch,LMAP[ch][1],LMAP[ch][2]]);continue}
    const base=ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(base.length===1&&LMAP[base]){out.push([base,LMAP[base][1],LMAP[base][2]]);continue}
    if(/[0-9]/.test(ch)){out.push([ch,ch,ch]);continue}
    if(SPELL_SYM[ch0]) out.push([ch0,SPELL_SYM[ch0][0],SPELL_SYM[ch0][1]]);
  }
  return out;
}

function SND(){
  if(!S.sounds)S.sounds={};const s=S.sounds;
  if(!s.drills)s.drills=[];if(!s.miss)s.miss={};
  if(!s.lessons)s.lessons=SOUND_GROUPS.map(()=>({heard:[],tries:0,fails:0,best:0,passed:null,skipped:null,last:null,lastScore:null}));
  if(!s.general)s.general={due:null,step:0,last:null};
  if(!s.migrated){for(const k of Object.keys(s.miss)){if(/^\d+$/.test(k)){const nk=OLD_PAIR_KEYS[+k];if(nk&&PKEY[nk]!==undefined)s.miss[nk]=(s.miss[nk]||0)+s.miss[k];delete s.miss[k]}}s.migrated=1}
  return s;
}

function newDrill(mode,g){

  if(mode==="lesson") picks=shuffle(idx).slice(0,n);
  else{
    const wt=i=>1+Math.min(3,m[ALL_PAIRS[i].key]||0)+(s.lessons[ALL_PAIRS[i].g].skipped?2:0);
    const pool=[];idx.forEach(i=>{for(let k=0;k<wt(i);k++)pool.push(i)});
    const set=new Set();let guard=0;while(set.size<Math.min(n,idx.length)&&guard++<2000)set.add(pool[Math.floor(Math.random()*pool.length)]);

        :`<div class="calib ${SD.score>=5?"easy":"hard"}"><b class="num">${SD.score} of ${n}</b><p class="small">${SD.wasDone?`That's below ${LESSON_PASS}, but you've already passed this lesson, so nothing changes.`:`You need ${LESSON_PASS} of ${n}. This ear training comes back on Today tomorrow, or you can try again now.`}</p></div>${!lessonDone(g)&&L.fails>=3?moveOnHTML(L):""}`;
      buttons=pass&&!SD.wasDone?(last?`<button class="btn primary" data-stab="general">Go to general training</button><button class="btn ghost" data-lback>All lessons</button>`:`<button class="btn primary" data-golesson="${g+1}">Start lesson ${g+2} now</button><button class="btn ghost" data-lback>All lessons</button>`)
        :`<button class="btn primary" id="sdStart">Try again now</button><button class="btn ghost" data-lback>All lessons</button>`;
    }else{
      const G=SND().general;
      verdict=`<div class="calib ${SD.score>=9?"sweet":SD.score>=7?"easy":"hard"}"><b class="num">${SD.score} of ${n} right</b><p class="small">${SD.score>=9?"Your ear is separating these sounds well.":SD.score>=7?"Good. Pairs you miss come up more often next round.":"Some of these sounds still blur together. Pairs you miss come up more often next round."} Next on Today: ${esc(fmtDate(G.due))}.</p></div>`;
      buttons=`<button class="btn primary" id="sdStart">Another round</button><button class="btn ghost" id="sdDone">Finish</button>`;
    }
    return `<section class="stack ear">${verdict}
      ${missed.length?`<div class="stack" style="gap:6px"><h3>Listen to these again</h3>${missed.map(i=>sndPairRow(ALL_PAIRS[i].p)).join("")}</div>`:""}

  }
  const [pi,side]=SD.q[SD.i],p=ALL_PAIRS[pi].p,ans=SD.ans;
  return `<section class="stack ear">
    <div class="spread"><span class="small muted num">Word ${SD.i+1} of ${n}${lesson?` · pass with ${LESSON_PASS}`:""}</span><span class="small muted num">${SD.score} right</span></div>
    <div class="row"><button class="btn primary" id="sdPlay">${SD.played?"Play again":"Play the word"}</button><button class="btn" id="sdSlow">Play slowly</button></div>
    <div class="opts row">${[0,1].map(k=>`<button class="opt ear-opt ${ans===null?"":k===side?"right":ans===k?"wrong":""}" data-pick="${k}" ${ans!==null||!SD.played?"disabled":""}>${esc(p[k][0])}<span class="small muted">${esc(p[k][1])}</span></button>`).join("")}</div>
    ${ans!==null?`<div class="calib ${ans===side?"sweet":"hard"}"><b>${ans===side?"Right.":"Not this time."}</b> <span class="small">You heard <b>${esc(p[side][0])}</b> (${esc(p[side][1])}). The difference is ${esc(p[2])}.</span></div>
      <div class="row"><button class="btn" id="sdBoth">Hear both</button><button class="btn primary" id="sdNext">${SD.i+1<n?"Next word":"See your result"}</button></div>`
     :`<p class="small muted">${SD.played?"Which word was it? Replay as often as you like.":"Play the word first, then choose."}</p>`}
    <p class="small muted">If a pair sounds the same every time, your device's voice may not separate it. Try playing it slowly.</p>
  </section>`;
}

    ${cur===null?`<div class="calib sweet"><b>All five lessons done.</b> <span class="small">The general ear training is open, and Today brings it back on a spaced schedule.</span></div>`:""}

function renderLesson(g){

      <p class="small">${LESSON_N} words. You hear one and pick which of two it was; each pair differs only in this lesson's sounds. ${done?"You've finished this lesson, so this is extra practice.":`Pass with ${LESSON_PASS} of ${LESSON_N} to open the next lesson.`}</p>

}

afterRender.feedback=()=>{

  a.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go("grammar",b.dataset.topic));

  $("#tutorSave").onclick=()=>{const t=$("#tutorNote").value.trim();if(!t){toast("Write the pattern first.");return}const topic=$("#tutorTopic").value||null;S.reviews.push({date:localDate(),ts:Date.now(),source:"tutor",result:{summary:"",patterns:[{title:t,topic,explanation:"",examples:[]}],strengths:[],nextFocus:""}});if(topic)S.flags[topic]=Math.max(2,(S.flags[topic]||0));save();render();toast("Saved. The related grammar is now in your Grammar tab.")};

async function runReview(){
  if(!SAMPLE) return;
  const since=outputsSinceReview(); const lv=levelInfo().level;
  const entries=since.slice(-25).map((o,i)=>`#${i+1} (${o.type}${o.prompt?", prompt: "+o.prompt:""}):\n${o.text}`).join("\n\n");
  const gaps=S.gaps.filter(g=>!g.done).slice(0,10).map(g=>"- "+g.text).join("\n")||"(none)";
  const prompt=`You are reviewing a German learner's recent output. Their level is CEFR ${lv}. They follow a method where feedback is periodic, not constant, and exists to stop errors from fossilizing.
Instructions:
- Find at most 3 PERSISTENT patterns: errors that appear more than once, or the same underlying rule broken in different sentences. Ignore one-off slips and typos.
- Don't correct every sentence. Quote the learner's real sentences as examples (1–3 per pattern), each with a corrected version.
- Explanations in plain English, one or two sentences, no jargon beyond what a ${lv} learner knows.
- For each pattern, choose the closest topic id from this list, or null: ${GRAMMAR.map(g=>g.id+" ("+g.title+")").join(", ")}.
- List 1–3 specific strengths you actually see in the text.
- Suggest one focus for the coming week, and mention any of their noted gaps that input could help with.
- If there are no repeated errors, return an empty patterns list and say so kindly in the summary.
Learner's output:
${entries}

Things the learner noted they couldn't say:
${gaps}

Return ONLY JSON: {"summary": string, "patterns": [{"title": string, "explanation": string, "topic": string|null, "examples": [{"wrote": string, "better": string}]}], "strengths": [string], "nextFocus": string}`;
  FB={busy:true,stream:"",err:"",ctrl:new AbortController()}; render();
  try{
    const r=await SAMPLE.json(prompt,{modelTier:"default",signal:FB.ctrl.signal});
    const result={summary:String(r.summary||""),patterns:(r.patterns||[]).slice(0,3).map(p=>({title:String(p.title||""),explanation:String(p.explanation||""),topic:GMAP[p.topic]?p.topic:null,examples:(p.examples||[]).slice(0,3).map(e=>({wrote:String(e.wrote||""),better:String(e.better||"")}))})),strengths:(r.strengths||[]).slice(0,3).map(String),nextFocus:String(r.nextFocus||"")};
    S.reviews.push({date:localDate(),ts:Date.now(),source:"claude",result});
    result.patterns.forEach(p=>{if(p.topic)S.flags[p.topic]=Math.max(2,S.flags[p.topic]||0)});
    save(); FB={busy:false,stream:"",err:"",ctrl:null}; render(); toast("Review ready");
  }catch(e){FB={busy:false,stream:"",err:sampleError(e),ctrl:null};render()}
}

/* ---------- A0 start: alphabet and sounds before stories ----------
   Stories open once every letter has been heard, the five sound lessons are done ("Move on anyway" counts)
   and the full ear training reaches 6 of 10. Anyone who has already read a story, or is past A0, keeps
   them open. Once open, they stay open. */
function ABCS(){if(!S.abc)S.abc={heard:[]};return S.abc}
function abcHeard(){const h=new Set(ABCS().heard);return LETTERS.filter(l=>h.has(l[0])).length}
function genBest(){return SND().drills.filter(d=>d.kind==="general"&&d.total).reduce((b,d)=>Math.max(b,Math.round(100*d.score/d.total)),0)}
function gateSteps(){
  const N=LETTERS.length,n=abcHeard(),NL=SOUND_GROUPS.length,ld=lessonsDone(),gb=genBest();
  return [
    {done:n>=N,title:"Hear every letter of the alphabet",desc:`${n} of ${N} letters tapped`,btn:"Open the alphabet",act:"abc"},
    {done:ld>=NL,title:"Finish the five sound lessons",desc:`${ld} of ${NL} done. “Move on anyway” counts.`,btn:"Go to the lessons",act:"sounds:lesson"},
    {done:gb>=60,title:"Score 60% on the full ear training",desc:ld<NL?"Opens after the five lessons.":gb?`Best so far: ${gb}%. You need 6 of 10.`:"Ten words from all five lessons. You need 6 of 10.",btn:"Start",act:"sounds:general",wait:ld<NL}
  ];
}
function storiesLocked(){
  if(S.storyGate) return false;
  let how=null;

/* ---------- word dictation (A0) ----------
   Hear a core word you've learned, type it, see each letter checked. ä/ae, ö/oe, ü/ue and ß/ss count as the same. */
function wordDictPool(){return VOCAB.filter(v=>v.tier==="core"&&S.cards[v.id]&&S.cards[v.id].box>=2&&!/[·,.?!()…\/]/.test(v.de)&&v.de.split(" ").length<=2&&v.de.replace(/^(der|die|das) /,"").length>=3).map(v=>({de:v.de,en:v.en,id:v.id})).filter((x,i,a)=>a.findIndex(y=>y.de.toLowerCase()===x.de.toLowerCase())===i)}
function letterMarks(target,typed){
  const fold=s=>{const out=[],map=[];[...String(s).toLowerCase()].forEach((ch,i)=>{const f={"ä":"ae","ö":"oe","ü":"ue","ß":"ss"}[ch]||ch;for(const c of f){out.push(c);map.push(i)}});return {s:out,map}};
  const A=fold(target),B=fold(String(typed).trim().replace(/\s+/g," ")),m=A.s.length,n=B.s.length;
  const D=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)D[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(A.s[i-1]===B.s[j-1]?0:1));
  const okF=new Array(m).fill(false);let i=m,j=n;
  while(i>0&&j>0){if(A.s[i-1]===B.s[j-1]&&D[i][j]===D[i-1][j-1]){okF[i-1]=true;i--;j--}else if(D[i][j]===D[i-1][j-1]+1){i--;j--}else if(D[i][j]===D[i-1][j]+1)i--;else j--}
  const chars=[...String(target)],ok=chars.map(()=>true);A.map.forEach((oi,k)=>{if(!okF[k])ok[oi]=false});
  const idx=chars.map((c,k)=>k).filter(k=>chars[k]!==" ");
  return {chars,ok,exact:D[m][n]===0,okN:idx.filter(k=>ok[k]).length,n:idx.length};
}
function marksHTML(m){return `<span class="lt-row" aria-label="${esc(m.chars.join(""))}">${m.chars.map((ch,k)=>ch===" "?`<span class="lt-sp"></span>`:`<span class="${m.ok[k]?"lt-ok":"lt-bad"}">${esc(ch)}</span>`).join("")}</span>`}

}

/* ---------- say it yourself: record and compare ----------
   The learner records with the phone's own recorder (or picks a voice memo). Nothing is uploaded: the file is
   read in the browser, played back next to the model, and both are drawn as sound waves on one time scale so
   length, rhythm and stress can be compared. The app can't judge single sounds, so the learner rates themselves. */
let SAY=null,SAY_CTX=null;
function sayCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{return SAY_CTX||(SAY_CTX=new C())}catch(e){return null}}
function decodeBuf(buf){const c=sayCtx();if(!c)return Promise.reject(new Error("no audio"));return new Promise((res,rej)=>{try{const p=c.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}})}
function envelope(ab,n=120){
  const d=ab.getChannelData(0),sr=ab.sampleRate;let mx=0;for(let i=0;i<d.length;i+=8)mx=Math.max(mx,Math.abs(d[i]));
  const th=mx*0.06;let a=0,b=d.length-1;while(a<b&&Math.abs(d[a])<th)a++;while(b>a&&Math.abs(d[b])<th)b--;
  const len=Math.max(1,b-a+1),step=Math.max(1,Math.floor(len/n)),out=[];
  for(let i=0;i<n;i++){let s=0,c=0;const end=Math.min(b,a+(i+1)*step);for(let j=a+i*step;j<end;j+=4){s+=d[j]*d[j];c++}out.push(c?Math.sqrt(s/c):0)}
  const m=Math.max(...out)||1;return {env:out.map(x=>x/m),dur:len/sr};
}
function drawWave(id,e,maxDur,color){
  const cv=document.getElementById(id);if(!cv||!e)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth||300,H=cv.clientHeight||56;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");if(!g)return;g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement),col=(css.getPropertyValue(color)||"#888").trim();
  const used=W*(e.dur/Math.max(maxDur,0.01)),bw=used/e.env.length;g.fillStyle=col;
  e.env.forEach((v,i)=>{const h=Math.max(1.5,v*(H-10));g.fillRect(i*bw+bw*0.15,(H-h)/2,Math.max(1,bw*0.7),h)});
}
function paceNote(m,y){const r=y/m;return r<0.8?"You were quicker than the model. Try slowing down a little and give each word its full length.":r>1.35?"You were slower than the model, which is fine while you're learning. Speed comes later.":"Your length is close to the model's. Now listen for the sounds and the stressed syllables that differ."}
function openSay(de,en){

/* ---------- website version: microphone, scoring, install, reminders ----------
   Inside claude.ai the page has no microphone and no notifications, so these switch on only when the app runs
   as its own website (https, not inside claude.ai). Scoring uses the phone's built-in German speech recognition:
   it checks which words were understood, not each sound. */
const STANDALONE=!(window.claude&&window.claude.use)&&window.isSecureContext&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname));

function liveRecOK(){return STANDALONE&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&typeof MediaRecorder!=="undefined"}
function scoreAlt(target,alts){let best=null;for(const a0 of alts){const a=String(a0).replace(/\d+/g,x=>{try{return numDe(+x)}catch(e){return x}});const r=dictCompare(target,a);const s=(r.ok+0.5*r.close)/Math.max(1,r.total);if(!best||s>best.s)best={s,r,heard:a}}return best}
function sayScore(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;stopSpeech();
  const out=$("#sayScoreOut"),me=SAY;if(me.rec)try{me.rec.abort()}catch(e){}
  const rec=new R();me.rec=rec;rec.lang="de-DE";rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  out.innerHTML=`<div class="calib"><b>Listening…</b> <span class="small">Say the sentence now.</span></div>`;
  let got=false;
  rec.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);const b=scoreAlt(me.de,alts);const pct=Math.round(100*b.s);
    if(!me.scores)me.scores=[];me.scores.push(pct);if(!S.pron)S.pron=[];S.pron.push({d:localDate(),ts:Date.now(),de:me.de.slice(0,120),score:pct});if(S.pron.length>300)S.pron.splice(0,S.pron.length-300);save();
    if(SAY!==me)return;
    out.innerHTML=`<div class="calib ${pct>=90?"sweet":pct>=70?"easy":"hard"} stack" style="gap:6px"><b class="num">${pct}% of the words understood</b>
      <div class="dict-res">${b.r.ops.filter(o=>o.t!=="extra").map(o=>`<span class="d-${o.t}">${esc(o.w)}</span>`).join(" ")}</div>
      <div class="small muted">The phone heard: “${esc(b.heard)}”</div>
      <p class="small">${pct>=90?"Excellent. Try it once more, a little faster.":pct>=70?"Good. The red words are the ones to practise: play the model, then say just those words.":"Keep going. Listen to the model, say it slowly, then try again."}</p></div>`};
  rec.onerror=e=>{if(SAY!==me)return;got=true;out.innerHTML=`<p class="small">${e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked. Allow it for this site in your browser settings, then try again.":e.error==="no-speech"?"Nothing was heard. Tap again and speak a little louder.":"Speech recognition isn't working right now. You can still record and compare."}</p>`};
  rec.onend=()=>{if(!got&&SAY===me)out.innerHTML=`<p class="small">Nothing was heard. Tap again and speak a little louder.</p>`};
  try{rec.start()}catch(e){out.innerHTML=`<p class="small">Speech recognition couldn't start. Try again in a moment.</p>`}
}
async function sayLive(){
  const me=SAY,btn=$("#sayRec");
  if(me.recorder){try{me.recorder.stop()}catch(e){}return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("The microphone is blocked. Allow it for this site in your browser settings.");return}
  const mr=new MediaRecorder(stream),chunks=[];me.recorder=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(x=>x.stop());me.recorder=null;const b=$("#sayRec");if(b)b.innerHTML=`${ICON.mic} Record and compare`;if(chunks.length)sayLoad(new Blob(chunks,{type:mr.mimeType||"audio/webm"}))};
  mr.start();if(btn)btn.innerHTML=`■ Stop recording`;
  setTimeout(()=>{if(me.recorder===mr)try{mr.stop()}catch(e){}},15000);
}
/* Install as an app, keep working offline, and remind once a day. */
const PUSH={onesignalAppId:"/*ONESIGNAL_APP_ID*/"};
function pushReady(){return STANDALONE&&PUSH.onesignalAppId&&!/^\/\*/.test(PUSH.onesignalAppId)}
if(STANDALONE){
  try{const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);
    const a=document.createElement("link");a.rel="apple-touch-icon";a.href="icon-192.png";document.head.appendChild(a);
    const m=document.createElement("meta");m.name="theme-color";m.content="#F2C200";document.head.appendChild(m)}catch(e){}
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(pushReady()){window.OneSignalDeferred=window.OneSignalDeferred||[];const s=document.createElement("script");s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";s.defer=true;document.head.appendChild(s);
    OneSignalDeferred.push(async OS=>{await OS.init({appId:PUSH.onesignalAppId,serviceWorkerPath:location.pathname.replace(/[^/]*$/,"").slice(1)+"sw.js",serviceWorkerParam:{scope:location.pathname.replace(/[^/]*$/,"")}})})}
}
async function turnOnReminders(){
  if(pushReady()){window.OneSignalDeferred.push(async OS=>{try{await OS.Notifications.requestPermission();toast(OS.Notifications.permission?"Daily reminders are on":"Reminders weren't allowed")}catch(e){toast("Reminders couldn't be turned on here.")}});return}
  if(!("Notification" in window)){toast("This browser can't show notifications. Use the calendar link instead.");return}
  const p=await Notification.requestPermission();if(p!=="granted"){toast("Notifications weren't allowed.");return}
  try{const reg=await navigator.serviceWorker.ready;if("periodicSync" in reg){await reg.periodicSync.register("daily-reminder",{minInterval:20*60*60*1000});S.settings.remOn=1;save();render();toast("Daily reminders are on");return}}catch(e){}
  toast("This browser can't schedule reminders. Use the calendar link instead.");
}

/* ---------- daily reminder: a repeating Google Calendar event ---------- */
function calLink(time){
  const [h,mi]=String(time||"19:00").split(":").map(Number),d=new Date();d.setDate(d.getDate()+1);d.setHours(h||19,mi||0,0,0);const e=new Date(d.getTime()+20*60000);
  const f=x=>`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}T${String(x.getHours()).padStart(2,"0")}${String(x.getMinutes()).padStart(2,"0")}00`;
  let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  const p=new URLSearchParams({action:"TEMPLATE",text:"German with Platform One",details:"About 20 minutes: open Platform One and do what Today lists.\nhttps://claude.ai/artifact/2JndanBM36eF5BSAHBTEG9",dates:f(d)+"/"+f(e),recur:"RRULE:FREQ=DAILY"});
  if(tz)p.set("ctz",tz);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
