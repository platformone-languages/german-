<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="German from zero to A2 for English speakers: sounds, words, stories, listening and speaking."><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Platform One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --surface-2:#E9ECE6; --ink:#15171B; --ink-2:#4B515A; --ink-3:#747B85;
  --line:#D6DAD2; --accent:#F2C200; --accent-ink:#15171B; --accent-soft:#FBEFB8;
  --m:#1F56B3; --f:#C23B32; --n:#23845A; --pl:#6B5BA8;
  --good:#23845A; --warn:#A8700F; --bad:#C23B32; --focus:#1F56B3;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 4px 14px rgba(20,24,30,.05);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101215; --surface:#181B20; --surface-2:#22262D; --ink:#ECEDEF; --ink-2:#A6ACB5; --ink-3:#7E858F;
    --line:#2D323A; --accent:#F2C200; --accent-ink:#15171B; --accent-soft:#3A3212;
    --m:#7EA6F0; --f:#F08A80; --n:#62C995; --pl:#AE9FF0;
    --good:#62C995; --warn:#E3B04B; --bad:#F08A80; --focus:#7EA6F0;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101215; --surface:#181B20; --surface-2:#22262D; --ink:#ECEDEF; --ink-2:#A6ACB5; --ink-3:#7E858F;
  --line:#2D323A; --accent:#F2C200; --accent-ink:#15171B; --accent-soft:#3A3212;
  --m:#7EA6F0; --f:#F08A80; --n:#62C995; --pl:#AE9FF0;
  --good:#62C995; --warn:#E3B04B; --bad:#F08A80; --focus:#7EA6F0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:28px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--m)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px;padding:2px 8px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--accent-ink);letter-spacing:.04em}
.brand-name{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:6px;font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);position:relative}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:3px;background:var(--accent);border-radius:2px}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--f);margin-left:5px;vertical-align:middle}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}
  .tab{flex:1;padding:9px 2px;font-size:13px;letter-spacing:.03em}
  .tab[aria-selected="true"]::after{top:-5px;bottom:auto;left:20%;right:20%}
}

/* cards & surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel.flat{background:var(--surface-2);border-color:transparent}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.yellow{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.yellow{background:var(--accent);color:var(--accent-ink)}
.pill.a1{background:color-mix(in srgb,var(--m) 14%,transparent);color:var(--m)}
.pill.a2{background:color-mix(in srgb,var(--pl) 16%,transparent);color:var(--pl)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.y>span{background:var(--accent)}
input[type=text],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.55}
textarea.de,input.de{font-family:var(--read);font-size:17px}
label.lbl{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

/* signs */
.route{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.route .leg{flex:1;min-width:28px;height:3px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 8px,transparent 8px 14px)}
.route .leg.done{background:var(--ink)}
.sign{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 16px 7px;box-shadow:inset 0 0 0 3px var(--accent-ink),inset 0 0 0 5px var(--accent);min-width:104px;opacity:.45}
.sign.here{opacity:1;box-shadow:inset 0 0 0 3px var(--accent-ink),inset 0 0 0 5px var(--accent),0 6px 18px rgba(0,0,0,.14)}
.sign.passed{opacity:.9}
.sign.passed::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:7px;background:#C8231B;transform:translateY(-50%) rotate(-24deg);border-radius:2px}
.sign-big{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95}
.sign-small{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.route .sign{min-width:92px}
@media (max-width:520px){.route .sign{min-width:0;padding:6px 10px 5px}.route .sign-big{font-size:30px}.route .sign-small{font-size:10px}.route .leg{min-width:12px}}
.hero{display:flex;flex-direction:column;gap:16px;padding-block:22px 6px}
.hero h1{font-size:clamp(30px,6vw,46px);text-transform:uppercase}
.hero .lede{max-width:62ch;color:var(--ink-2)}

/* plan */
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.plan-item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.plan-item:first-child{border-top:0}
.plan-item .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.plan-item.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.plan-item.locked{opacity:.6}
.plan-item .t{font-weight:600}
.plan-item .d{font-size:13px;color:var(--ink-2)}
.pillar-tag{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* time split */
.split{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.split span{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.c-input{background:var(--ink)}.c-words{background:var(--accent)}.c-output{background:var(--m)}.c-grammar{background:var(--n)}

/* flashcard */
.fc-wrap{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gcol,var(--line))}
.fc .de{font-family:var(--read);font-size:clamp(30px,7vw,42px);font-weight:600;line-height:1.15}
.fc .art{color:var(--gcol,var(--ink))}
.fc .en{font-size:20px;margin-top:14px;color:var(--ink)}
.fc .ctx{font-family:var(--read);font-size:15px;color:var(--ink-2);margin-top:10px;max-width:40ch}
.fc .meta{position:absolute;top:12px;right:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;padding:8px 6px;min-height:54px}
.rate .btn small{font-weight:400;font-size:11px;color:var(--ink-3)}
.g-m{--gcol:var(--m)}.g-f{--gcol:var(--f)}.g-n{--gcol:var(--n)}.g-pl{--gcol:var(--pl)}
.gtag{font-weight:700}
.gtag.m{color:var(--m)}.gtag.f{color:var(--f)}.gtag.n{color:var(--n)}.gtag.pl{color:var(--pl)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pack.locked{background:transparent;border-style:dashed;color:var(--ink-2)}.pack.locked b{color:var(--ink-2);font-weight:600}.pack .pk-lock svg{width:15px;height:15px;display:block}.snd-sent{align-items:center;gap:10px;margin-top:2px}
.pack{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pack:hover{border-color:var(--ink-3)}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px;font-size:14px}
.wordlist div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.wordlist .w{font-family:var(--read);font-weight:600}
.box-dots{display:inline-flex;gap:2px}
.box-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--good)}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.story-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:132px}
.story-card:hover{border-color:var(--ink-3)}
.story-card .title{font-family:var(--read);font-size:19px;font-weight:600;line-height:1.25}
.story-card.rec{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.reader{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.reader h2{font-family:var(--read);text-transform:none;font-weight:600;font-size:clamp(26px,5vw,34px);letter-spacing:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);background:var(--bg);padding-block:8px;z-index:5}
.sent{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.sent .n{font-size:12px;color:var(--ink-3);padding-top:6px;text-align:right;font-variant-numeric:tabular-nums}
.sent .txt{font-family:var(--read);font-size:20px;line-height:1.6}
.sent .tr{font-family:var(--ui);font-size:14px;color:var(--ink-2);margin-top:2px}
.sent.playing .txt{background:var(--accent-soft);border-radius:4px;box-shadow:0 0 0 4px var(--accent-soft)}
.sent.flagged .n{color:var(--f);font-weight:700}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--surface-2)}
.w.saved{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.sent-actions{display:flex;gap:2px}
.icon-btn{border:0;background:transparent;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3);font-size:15px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--f)}
.icon-btn svg{width:18px;height:18px}
.q{display:flex;flex-direction:column;gap:8px}
.q .opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-family:var(--read);font-size:16px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input{flex:1;accent-color:var(--ink)}
.calib{border-left:4px solid var(--ink-3);padding:10px 14px;background:var(--surface-2);border-radius:0 8px 8px 0}
.calib.sweet{border-color:var(--good)}.calib.hard{border-color:var(--bad)}.calib.easy{border-color:var(--warn)}
.zone{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 45%,transparent) 0 60%,color-mix(in srgb,var(--warn) 45%,transparent) 60% 70%,color-mix(in srgb,var(--good) 55%,transparent) 70% 90%,color-mix(in srgb,var(--warn) 45%,transparent) 90%)}
.zone i{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.14);border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
@media (max-width:760px){.sheet{bottom:calc(50px + env(safe-area-inset-bottom,0px));padding-bottom:16px;border-radius:14px 14px 0 0}}
.sheet .word{font-family:var(--read);font-size:26px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* output */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.prompt-card{background:var(--accent-soft);border-radius:10px;padding:16px 18px;font-family:var(--read);font-size:19px;line-height:1.45}
.prompt-card small{display:block;font-family:var(--ui);font-size:13px;color:var(--ink-2);margin-top:6px}
.log-entry{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.log-entry .body{font-family:var(--read);font-size:16px;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px}
.bubble{max-width:85%;padding:10px 13px;border-radius:12px;font-family:var(--read);font-size:17px;line-height:1.45}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.bubble .en{display:block;font-family:var(--ui);font-size:13px;color:var(--ink-2);margin-top:4px}
.lock{display:grid;gap:14px;border:1px dashed var(--ink-3);border-radius:10px;padding:18px;background:var(--surface)}

/* grammar */
.topic-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.topic{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 16px}
.topic:first-child{border-top:0}
.topic:hover{background:var(--surface-2)}
.topic .tt{font-weight:600}
.explain{max-width:700px;display:flex;flex-direction:column;gap:14px}
.explain p{max-width:65ch}
.explain .ex{font-family:var(--read);font-size:17px;background:var(--surface-2);border-radius:8px;padding:10px 14px}
.explain .ex em{font-style:normal;background:var(--accent-soft);border-radius:3px;padding:0 3px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}
.tbl th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-2)}

w:leidtun|leidtun|to be sorry (Es tut mir leid = I'm sorry)|v|a2|-2`;
const PACK_NAMES=["Numbers & survival phrases", "People & basics", "Prepositions & questions", "Time words & modals", "Core verbs I", "Core verbs II", "Everyday verbs & people", "Time & home", "Town, travel & school", "Food, things & weather", "Life & free time", "Describing things", "Feelings & frequency", "Quantities & linking words", "Particles & directions", "People & family I", "People & family II", "People & family III", "Small words & linking words", "Verbs I", "Verbs II", "Verbs III", "Time & calendar I", "Time & calendar II", "Home & household I", "Home & household II", "Food & drink I", "Food & drink II", "Town & travel I", "Town & travel II", "Town & travel III", "Shopping & money I", "Shopping & money II", "Work, school & forms I", "Work, school & forms II", "Work, school & forms III", "Phone, post & internet I", "Phone, post & internet II", "Body & health", "Free time I", "Free time II", "Describing words I", "Describing words II", "Weather & nature", "Numbers & phrases"];
const CORE_PACKS=15;
const VOCAB = BANK.trim().split("\n").map((line,i)=>{
  const [id,de,en,t,tier,pack]=line.split("|");
  let g=null;
  if(t==="n"){ g=de.startsWith("der ")?"m":de.startsWith("das ")?"n":de.includes("(Pl.)")?"pl":"f"; }
  return {id,de,en,t,g,tier,pack:+pack,rank:i+1};
});
const TIER_N={core:VOCAB.filter(v=>v.tier==="core").length,a1:VOCAB.filter(v=>v.tier==="a1").length,a2:VOCAB.filter(v=>v.tier==="a2").length};

/* =========================================================
   GRAMMAR: just-in-time explainers
   ========================================================= */
const GRAMMAR = [
{id:"g-gender",title:"der, die, das",sub:"Why German has three words for 'the'",level:"A0",
body:`<p>Every German noun has a grammatical gender: masculine (<b class="gtag m">der</b>), feminine (<b class="gtag f">die</b>) or neuter (<b class="gtag n">das</b>). It rarely follows meaning, so the fastest route is to always learn a noun <i>with</i> its article. That's why every noun card in your deck is colour-coded.</p>
<div class="tbl"><table><tr><th>Pattern</th><th>Gender</th><th>Examples</th></tr>
<tr><td>-ung, -heit, -keit, -ion, -schaft</td><td class="gtag f">die</td><td class="de">die Wohnung, die Zeitung</td></tr>
<tr><td>-chen, -lein (small things)</td><td class="gtag n">das</td><td class="de">das Mädchen, das Brötchen</td></tr>
<tr><td>days, months, seasons</td><td class="gtag m">der</td><td class="de">der Montag, der Mai, der Sommer</td></tr>
<tr><td>most -e nouns</td><td class="gtag f">die</td><td class="de">die Katze, die Straße</td></tr>
<tr><td>every plural</td><td class="gtag pl">die</td><td class="de">die Kinder, die Männer</td></tr></table></div>
<div class="ex">Die Katze heißt Mia. · <em>Der</em> Hund heißt Max. · <em>Das</em> Kind ist klein.</div>
<p class="muted">Don't memorise the whole rulebook. Keep reading: the article sticks when you meet the noun in context many times.</p>`,
checks:[["___ Wohnung ist schön.",["Der","Die","Das"],1,"-ung nouns are always feminine."],["___ Mädchen spielt.",["Der","Die","Das"],2,"-chen nouns are always neuter, even 'girl'."],["___ Montag ist lang.",["Der","Die","Das"],0,"Days of the week are masculine."]]},

{id:"g-conj",title:"Verb endings (present tense)",sub:"ich wohne, du wohnst, er wohnt",level:"A0",
body:`<p>German verbs change their ending to match the subject. Take the infinitive, remove <b>-en</b>, add the ending.</p>
<div class="tbl"><table><tr><th>Person</th><th>Ending</th><th>wohnen</th><th>sein</th><th>haben</th></tr>
<tr><td>ich</td><td>-e</td><td class="de">wohne</td><td class="de">bin</td><td class="de">habe</td></tr>
<tr><td>du</td><td>-st</td><td class="de">wohnst</td><td class="de">bist</td><td class="de">hast</td></tr>
<tr><td>er / sie / es</td><td>-t</td><td class="de">wohnt</td><td class="de">ist</td><td class="de">hat</td></tr>
<tr><td>wir</td><td>-en</td><td class="de">wohnen</td><td class="de">sind</td><td class="de">haben</td></tr>
<tr><td>ihr</td><td>-t</td><td class="de">wohnt</td><td class="de">seid</td><td class="de">habt</td></tr>
<tr><td>sie / Sie</td><td>-en</td><td class="de">wohnen</td><td class="de">sind</td><td class="de">haben</td></tr></table></div>
<p>Some common verbs change their vowel for <b>du</b> and <b>er/sie/es</b> only:</p>
<div class="ex">essen → er <em>isst</em> · fahren → sie <em>fährt</em> · lesen → du <em>liest</em> · schlafen → er <em>schläft</em></div>`,
checks:[["Du ___ in Berlin.",["wohne","wohnst","wohnt"],1,"du takes -st."],["Er ___ eine Katze.",["habt","hast","hat"],2,"haben is irregular: er hat."],["Wir ___ müde.",["sind","seid","ist"],0,"wir sind."]]},

{id:"g-v2",title:"The verb goes second",sub:"Heute trinke ich Kaffee",level:"A0",
body:`<p>In a German statement the conjugated verb sits in <b>position 2</b>. Position 1 can be the subject, a time, a place, anything. If something else takes position 1, the subject moves to just after the verb.</p>
<div class="ex">Ich <em>trinke</em> heute Kaffee.<br>Heute <em>trinke</em> ich Kaffee.<br>Am Abend <em>sind</em> sie müde.</div>
<div class="tbl"><table><tr><th>Sentence type</th><th>Verb position</th><th>Example</th></tr>
<tr><td>Statement</td><td>2</td><td class="de">Dann essen sie zusammen.</td></tr>
<tr><td>W-question</td><td>2</td><td class="de">Wo wohnst du?</td></tr>
<tr><td>Yes/no question</td><td>1</td><td class="de">Wohnst du in Berlin?</td></tr></table></div>
<p class="muted">"Position" means a slot, not a word: <i>Am Abend</i> is one slot.</p>`,
checks:[["Which is correct?",["Morgen ich gehe ins Kino.","Morgen gehe ich ins Kino.","Morgen ins Kino ich gehe."],1,"Morgen takes slot 1, so the verb comes next, then the subject."],["Which is a yes/no question?",["Du kommst mit?","Kommst du mit?","Mit du kommst?"],1,"Yes/no questions start with the verb."],["Dann ___ .",["sie essen zusammen","essen sie zusammen","zusammen sie essen"],1,"Dann is slot 1, verb is slot 2."]]},

{id:"g-neg",title:"nicht or kein?",sub:"Two ways to say 'not'",level:"A0",
body:`<p><b>kein</b> negates a noun that would otherwise have <i>ein</i> or no article. <b>nicht</b> negates everything else: verbs, adjectives, and nouns with <i>der/die/das</i>.</p>
<div class="ex">Ich habe <em>ein</em> Auto. → Ich habe <em>kein</em> Auto.<br>Ich habe Zeit. → Ich habe <em>keine</em> Zeit.<br>Das Auto ist neu. → Das Auto ist <em>nicht</em> neu.<br>Ich komme. → Ich komme <em>nicht</em>.</div>
<p>kein takes the same endings as ein: <i>kein Hund, keine Katze, kein Kind, keinen Hund</i> (accusative).</p>`,
checks:[["Tom hat ___ Geld.",["nicht","kein","keine"],1,"Geld has no article here, and it's neuter: kein."],["Der Film ist ___ gut.",["nicht","kein","keine"],0,"You're negating an adjective: nicht."],["Ich habe ___ Zeit.",["nicht","kein","keine"],2,"Zeit is feminine with no article: keine."]]},

{id:"g-acc",title:"Accusative: den, einen",sub:"The thing you have, buy, see",level:"A0",
body:`<p>The direct object (the thing you have, buy, see, want) goes into the <b>accusative</b>. Good news: only the <b class="gtag m">masculine</b> changes.</p>
<div class="tbl"><table><tr><th></th><th class="gtag m">masc.</th><th class="gtag f">fem.</th><th class="gtag n">neut.</th><th class="gtag pl">plural</th></tr>
<tr><td>Nominative</td><td class="de">der / ein</td><td class="de">die / eine</td><td class="de">das / ein</td><td class="de">die / –</td></tr>
<tr><td>Accusative</td><td class="de"><b>den / einen</b></td><td class="de">die / eine</td><td class="de">das / ein</td><td class="de">die / –</td></tr></table></div>
<div class="ex">Der Hund ist alt. → Wir haben <em>einen</em> Hund.<br>Ich kaufe <em>den</em> Kaffee.<br>Einen Kaffee, bitte!</div>`,
checks:[["Ich habe ___ Bruder.",["ein","einen","eine"],1,"Bruder is masculine and the object: einen."],["Lena kauft ___ Buch.",["ein","einen","eine"],0,"Buch is neuter: nothing changes."],["Er findet ___ Markt gut.",["der","den","dem"],1,"Markt is masculine and the object: den."]]},

{id:"g-dat",title:"Dative: dem, der, mit dem Bus",sub:"After mit, bei, zu, von, nach, aus, seit",level:"A1",
body:`<p>Some prepositions always take the <b>dative</b>: <b>aus, bei, mit, nach, seit, von, zu</b>. The indirect object ("to whom") is dative too.</p>
<div class="tbl"><table><tr><th></th><th class="gtag m">masc.</th><th class="gtag f">fem.</th><th class="gtag n">neut.</th><th class="gtag pl">plural</th></tr>
<tr><td>Dative</td><td class="de">dem / einem</td><td class="de">der / einer</td><td class="de">dem / einem</td><td class="de">den / – (+n)</td></tr></table></div>
<p>They often merge: <b>zu dem → zum</b>, <b>zu der → zur</b>, <b>von dem → vom</b>, <b>bei dem → beim</b>, <b>in dem → im</b>.</p>
<div class="ex">Sie fahren mit <em>dem</em> Bus. · Sie fährt <em>zur</em> Arbeit. · Die Verkäuferin gibt <em>ihm</em> die Kartoffeln.</div>`,
checks:[["Ich fahre mit ___ Zug.",["den","dem","der"],1,"mit + masculine dative: dem."],["Sie geht ___ Arbeit.",["zum","zur","zu die"],1,"zu der Arbeit → zur Arbeit."],["Er wohnt seit drei ___ hier.",["Monate","Monaten","Monat"],1,"Dative plural adds -n."]]},

{id:"g-sep",title:"Separable verbs",sub:"aufstehen → Ich stehe um 7 auf",level:"A1",
body:`<p>Many verbs have a prefix that splits off and jumps to the <b>end</b> of the sentence: <i>aufstehen, anfangen, anrufen, einkaufen, mitkommen, zurückfahren</i>. The prefix is stressed when you say it.</p>
<div class="ex">Lena <em>steht</em> um sieben Uhr <em>auf</em>.<br>Die Arbeit <em>fängt</em> um halb neun <em>an</em>.<br>Er <em>ruft</em> beim Arzt <em>an</em>.</div>
<p>With a modal verb, or at the end of a <i>weil/dass</i> clause, the verb stays in one piece:</p>
<div class="ex">Ich muss früh <em>aufstehen</em>. · …, weil ich früh <em>aufstehe</em>.</div>`,
checks:[["mitkommen: Kommst du ___?",["mit","an","auf"],0,"The prefix mit- goes to the end."],["Which is correct?",["Ich aufstehe um 6.","Ich stehe um 6 auf.","Ich stehe auf um 6."],1,"Verb in slot 2, prefix at the very end."],["Kannst du morgen ___?",["an rufen","anrufen","rufen an"],1,"With a modal the infinitive stays joined."]]},

{id:"g-modal",title:"Modal verbs",sub:"können, müssen, möchten + verb at the end",level:"A1",
body:`<p>Modal verbs (<i>können, müssen, wollen, sollen, dürfen, möchten</i>) take slot 2, and the main verb goes to the <b>end</b> in its infinitive form.</p>
<div class="ex">Ich <em>möchte</em> ins Kino <em>gehen</em>.<br>Wir <em>können</em> vorher etwas <em>essen</em>.<br><em>Kannst</em> du <em>mitkommen</em>?</div>
<div class="tbl"><table><tr><th></th><th>können</th><th>müssen</th><th>möchten</th></tr>
<tr><td>ich</td><td class="de">kann</td><td class="de">muss</td><td class="de">möchte</td></tr>
<tr><td>du</td><td class="de">kannst</td><td class="de">musst</td><td class="de">möchtest</td></tr>
<tr><td>er/sie/es</td><td class="de">kann</td><td class="de">muss</td><td class="de">möchte</td></tr>
<tr><td>wir / sie / Sie</td><td class="de">können</td><td class="de">müssen</td><td class="de">möchten</td></tr></table></div>
<p class="muted">Watch out: <i>ich</i> and <i>er</i> have the same form and no -t (er kann, not er kannt).</p>`,
checks:[["Er ___ gut kochen.",["kannt","kann","können"],1,"er kann: no ending."],["Which is correct?",["Ich muss arbeiten morgen.","Ich muss morgen arbeiten.","Ich arbeiten muss morgen."],1,"The infinitive goes to the end."],["Wir ___ nicht lange bleiben.",["kann","können","könnt"],1,"wir können."]]},

{id:"g-perf",title:"Talking about the past (Perfekt)",sub:"Ich habe gegessen · Ich bin gefahren",level:"A2",
body:`<p>In speech, the past is mostly <b>haben</b> or <b>sein</b> in slot 2 + the <b>participle</b> at the end.</p>
<div class="ex">Ich <em>habe</em> Julia <em>besucht</em>.<br>Wir <em>haben</em> Fisch <em>gegessen</em>.<br>Ich <em>bin</em> nach Hamburg <em>gefahren</em>.</div>
<div class="tbl"><table><tr><th>Type</th><th>Pattern</th><th>Examples</th></tr>
<tr><td>regular</td><td>ge- … -t</td><td class="de">machen → gemacht, kochen → gekocht</td></tr>
<tr><td>irregular</td><td>ge- … -en</td><td class="de">essen → gegessen, finden → gefunden</td></tr>
<tr><td>separable</td><td>prefix + ge + …</td><td class="de">zurückfahren → zurückgefahren</td></tr>
<tr><td>be-/ver-/-ieren</td><td>no ge-</td><td class="de">besuchen → besucht, studieren → studiert</td></tr></table></div>
<p>Use <b>sein</b> for movement from A to B and change of state: <i>gehen, fahren, kommen, fliegen, werden</i>. Two common exceptions also take <b>sein</b> without fitting that rule: <i>bleiben</i> and <i>sein</i> itself (ich bin geblieben, ich bin gewesen). Everything else: <b>haben</b>.</p>`,
checks:[["Wir ___ in ein Café gegangen.",["haben","sind","hat"],1,"gehen is movement: sein."],["Ich habe viel ___.",["gearbeitet","arbeitet","gearbeiten"],0,"Regular: ge- … -t."],["Sie ___ für uns gekocht.",["ist","hat","sind"],1,"kochen takes haben."]]},

{id:"g-past",title:"war, hatte, konnte",sub:"The short past for sein, haben and modals",level:"A2",
body:`<p>For <b>sein</b>, <b>haben</b> and the modal verbs, Germans usually use the simple past (Präteritum), even in conversation.</p>
<div class="tbl"><table><tr><th></th><th>sein</th><th>haben</th><th>können</th><th>müssen</th></tr>
<tr><td>ich / er / sie</td><td class="de">war</td><td class="de">hatte</td><td class="de">konnte</td><td class="de">musste</td></tr>
<tr><td>du</td><td class="de">warst</td><td class="de">hattest</td><td class="de">konntest</td><td class="de">musstest</td></tr>
<tr><td>wir / sie / Sie</td><td class="de">waren</td><td class="de">hatten</td><td class="de">konnten</td><td class="de">mussten</td></tr></table></div>
<div class="ex">Als ich ein Kind <em>war</em>, <em>hatten</em> wir einen Garten.<br>Die Reise <em>war</em> kurz.</div>
<p class="muted">In written stories you'll also see this past for ordinary verbs, with <b>-te</b>: <i>wohnen → wohnte, erzählen → erzählte</i>. Recognise it when reading; in speech, use the Perfekt.</p>`,
checks:[["Gestern ___ ich krank.",["bin","war","habe"],1,"sein in the past: war."],["Wir ___ keinen Fernseher.",["hatten","hatte","haben gehabt"],0,"wir hatten."],["Sie ___ wunderbar kochen.",["kann","konnte","könnt"],1,"Past of können: konnte."]]},

{id:"g-sub",title:"weil, dass, wenn: verb to the end",sub:"…, weil sie so hell ist",level:"A2",
body:`<p>Words like <b>weil, dass, wenn, ob, als, bevor</b> start a side clause, and in a side clause the conjugated verb goes to the <b>very end</b>.</p>
<div class="ex">Tom findet die Wohnung toll, weil sie so hell <em>ist</em>.<br>Ich glaube, dass ich besser <em>werde</em>.<br>Ich höre einen Podcast, bevor ich schlafen <em>gehe</em>.</div>
<p>If the side clause comes first, it fills slot 1, so the main verb comes right after the comma:</p>
<div class="ex">Wenn ich etwas nicht verstehe, <em>höre</em> ich es noch einmal.</div>`,
checks:[["Ich lerne Deutsch, weil ich in Berlin ___.",["wohne","wohne ich","ich wohne"],0,"Verb at the end: weil ich in Berlin wohne."],["Which is correct?",["Er sagt, dass er kommt morgen.","Er sagt, dass er morgen kommt.","Er sagt, dass kommt er morgen."],1,"dass sends the verb to the end."],["Wenn ich Zeit habe, ___.",["ich lese","lese ich","ich lese es"],1,"The side clause is slot 1, so the verb comes next."]]},

{id:"g-plural",title:"Plurals",sub:"Tage, Frauen, Kinder, Autos, Äpfel",level:"A1",
body:`<p>German has several plural patterns. Like gender, they're best absorbed through reading, but these tendencies help:</p>
<div class="tbl"><table><tr><th>Pattern</th><th>Often with</th><th>Examples</th></tr>
<tr><td>-(e)n</td><td>feminine nouns</td><td class="de">Frau → Frauen, Minute → Minuten</td></tr>
<tr><td>-e (sometimes ¨)</td><td>masculine nouns</td><td class="de">Tag → Tage, Stuhl → Stühle</td></tr>
<tr><td>-er (with ¨)</td><td>short neuter nouns</td><td class="de">Kind → Kinder, Buch → Bücher</td></tr>
<tr><td>no ending (sometimes ¨)</td><td>-er, -el, -en nouns</td><td class="de">Lehrer → Lehrer, Apfel → Äpfel</td></tr>
<tr><td>-s</td><td>loanwords</td><td class="de">Auto → Autos, Café → Cafés</td></tr></table></div>
<p>The article is always <b class="gtag pl">die</b> in the plural. In the dative plural, add -n if possible: <i>mit den Kinder<b>n</b></i>.</p>`,
checks:[["one Kind, two ___",["Kinds","Kinder","Kinden"],1,"Short neuter nouns: -er."],["one Apfel, two ___",["Apfels","Äpfel","Apfeln"],1,"-el nouns: no ending, often an umlaut."],["The plural article is always…",["der","die","das"],1,"Every plural uses die."]]},

{id:"g-poss",title:"mein, dein, sein, ihr",sub:"Possessives take ein-endings",level:"A0",
body:`<p>Possessives work exactly like <b>ein</b>: they take the same endings.</p>
<div class="tbl"><table><tr><th>Person</th><th>Word</th><th class="gtag m">der</th><th class="gtag f">die</th><th class="gtag n">das</th></tr>
<tr><td>ich</td><td>mein</td><td class="de">mein Vater</td><td class="de">meine Mutter</td><td class="de">mein Kind</td></tr>
<tr><td>du</td><td>dein</td><td class="de">dein Bruder</td><td class="de">deine Schwester</td><td class="de">dein Buch</td></tr>
<tr><td>er / es</td><td>sein</td><td class="de">sein Hund</td><td class="de">seine Wohnung</td><td class="de">sein Auto</td></tr>
<tr><td>sie</td><td>ihr</td><td class="de">ihr Freund</td><td class="de">ihre Arbeit</td><td class="de">ihr Handy</td></tr>
<tr><td>wir</td><td>unser</td><td class="de">unser Garten</td><td class="de">unsere Stadt</td><td class="de">unser Haus</td></tr></table></div>
<div class="ex">Accusative masculine gets -en: Ich besuche <em>meinen</em> Bruder.</div>`,
checks:[["___ Mutter heißt Anna. (my)",["Mein","Meine","Meinen"],1,"Mutter is feminine: meine."],["Tom packt ___ Sachen. (his)",["seine","ihre","sein"],0,"Tom's things: seine (plural)."],["Lena mag ___ Arbeit. (her)",["seine","ihre","ihr"],1,"Lena's work, feminine: ihre."]]},

{id:"g-sie",title:"du, ihr or Sie?",sub:"Informal and formal 'you'",level:"A0",
body:`<p><b>du</b> is for friends, family, children, and most people your age online. <b>Sie</b> (always capital S) is for strangers, shop staff, doctors, officials and at work until someone offers <i>du</i>. <b>ihr</b> is informal plural: "you all".</p>
<div class="tbl"><table><tr><th>Form</th><th>Verb</th><th>Example</th></tr>
<tr><td>du</td><td>-st</td><td class="de">Wie heißt du?</td></tr>
<tr><td>ihr</td><td>-t</td><td class="de">Wo wohnt ihr?</td></tr>
<tr><td>Sie</td><td>-en</td><td class="de">Was möchten Sie?</td></tr></table></div>
<p>Commands to Sie keep the pronoun: <i>Trinken <b>Sie</b> viel Wasser!</i> To du, drop it: <i>Schreib mir!</i></p>`,
checks:[["At the doctor's: 'Where do you live?'",["Wo wohnst du?","Wo wohnen Sie?","Wo wohnt ihr?"],1,"Formal setting: Sie."],["To two friends: 'Are you coming?'",["Kommst du?","Kommt ihr?","Kommen Sie?"],1,"Informal plural: ihr."],["To a waiter: 'What would you recommend?'",["Was empfiehlst du?","Was empfehlen Sie?","Was empfehlt ihr?"],1,"Service staff: Sie."]]},

{id:"g-prep2",title:"in die Stadt or in der Stadt?",sub:"Two-way prepositions: motion vs. location",level:"A1",
body:`<p>Nine prepositions can take either case: <b>in, an, auf, über, unter, vor, hinter, neben, zwischen</b>.</p>
<div class="tbl"><table><tr><th>Question</th><th>Meaning</th><th>Case</th><th>Example</th></tr>
<tr><td>Wohin?</td><td>moving to</td><td>accusative</td><td class="de">Ich gehe in <b>die</b> Stadt.</td></tr>
<tr><td>Wo?</td><td>located at</td><td>dative</td><td class="de">Ich bin in <b>der</b> Stadt.</td></tr></table></div>
<div class="ex">Sie gehen <em>ins</em> Kino (in das). · Sie sind <em>im</em> Kino (in dem).<br>Er geht auf <em>den</em> Markt. · Er ist auf <em>dem</em> Markt.</div>`,
checks:[["Wir gehen in ___ Park.",["den","dem","der"],0,"Movement (Wohin?): accusative den."],["Lena arbeitet in ___ Büro.",["das","einem","ein"],1,"Location (Wo?): dative einem."],["Das Restaurant ist neben ___ Kino.",["das","dem","den"],1,"Location: dative dem."]]},

{id:"g-adj",title:"Adjective endings",sub:"ein kleiner Hund, eine kleine Katze",level:"A2",
body:`<p>After the verb, adjectives have no ending: <i>Der Hund ist <b>klein</b>.</i> Before a noun they get one. Start with these two patterns, which cover most of what you'll say:</p>
<div class="tbl"><table><tr><th></th><th class="gtag m">masc.</th><th class="gtag f">fem.</th><th class="gtag n">neut.</th></tr>
<tr><td>after der/die/das</td><td class="de">der klein<b>e</b> Hund</td><td class="de">die klein<b>e</b> Katze</td><td class="de">das klein<b>e</b> Kind</td></tr>
<tr><td>after ein</td><td class="de">ein klein<b>er</b> Hund</td><td class="de">eine klein<b>e</b> Katze</td><td class="de">ein klein<b>es</b> Kind</td></tr></table></div>

{id:"a2-handy",level:"A2",title:"Ohne Handy",en:"Without a phone",s:[
["Letzte Woche ist mein Handy kaputtgegangen.","Last week my phone broke.",["g-perf","g-sep"]],

["Ich wusste weder den Weg noch die Uhrzeit.","I knew neither the way nor the time.",["g-past","g-acc"]],

["Erstaunlicherweise waren die meisten sehr hilfsbereit.","Surprisingly, most were very helpful.",["g-past","g-plural"]],
["Am Abend habe ich ein Buch gelesen, anstatt im Internet zu surfen.","In the evening I read a book instead of surfing the internet.",["g-perf","g-sub"]],
["Ich habe besser geschlafen als sonst.","I slept better than usual.",["g-perf"]],
["Trotzdem bin ich froh, dass ich jetzt ein neues Handy habe.","Still, I'm glad I now have a new phone.",["g-sub","g-adj"]]],

["Als das Paket endlich angekommen ist, war der Toaster kaputt.","When the parcel finally arrived, the toaster was broken.",["g-sub","g-perf"]],
["Ich habe sofort den Kundenservice angerufen.","I immediately called customer service.",["g-perf","g-sep"]],
["Der Mitarbeiter hat sich entschuldigt und mir Ersatz angeboten.","The employee apologised and offered me a replacement.",["g-perf","g-dat"]],
["Ich wollte aber lieber mein Geld zurückbekommen, weil ich nicht noch einmal warten wollte.","But I preferred to get my money back, because I didn't want to wait all over again.",["g-past","g-sub","g-modal"]],
["Er hat gesagt, dass das drei bis fünf Tage dauern kann.","He said this can take three to five days.",["g-sub","g-modal"]],
["Wenn das Geld bis Freitag nicht da ist, schreibe ich noch einmal.","If the money isn't there by Friday, I'll write again.",["g-sub","g-neg"]],
["Ich hoffe, dass ich beim nächsten Mal weniger Ärger habe.","I hope I'll have less trouble next time.",["g-sub","g-dat"]]],

{id:"a2-ehrenamt",level:"A2",title:"Freiwillige Arbeit",en:"Volunteering",s:[
["Seit einem Jahr arbeite ich ehrenamtlich in einem Tierheim.","For a year I have been volunteering at an animal shelter.",["g-dat"]],
["Jeden Samstag gehe ich dorthin, um die Hunde spazieren zu führen.","Every Saturday I go there to walk the dogs.",["g-sub","g-plural"]],

["Aber die Kollegen haben mir gezeigt, wie man richtig mit ihnen umgeht.","But my colleagues showed me how to deal with them properly.",["g-perf","g-dat"]],
["Ich verdiene zwar kein Geld, dafür bekomme ich viel Dankbarkeit.","I earn no money, but I get a lot of gratitude in return.",["g-neg","g-acc"]],
["Letzten Monat haben wir für einen kranken Hund Geld gesammelt.","Last month we collected money for a sick dog.",["g-perf","g-acc"]],

{id:"a2-verspaetung",level:"A2",title:"Der verpasste Zug",en:"The missed train",s:[
["Letzten Freitag wollte ich nach Hamburg fahren, aber ich habe meinen Zug verpasst.","Last Friday I wanted to go to Hamburg, but I missed my train.",["g-past","g-perf"]],
["Ich bin früh losgegangen, aber der Bus hatte Verspätung.","I set off early, but the bus was late.",["g-perf","g-past"]],
["Am Bahnhof habe ich gehört, dass der nächste Zug erst in zwei Stunden fährt.","At the station I heard the next train only leaves in two hours.",["g-sub","g-perf"]],
["Ich war ziemlich genervt und habe mich auf eine Bank gesetzt.","I was pretty annoyed and sat down on a bench.",["g-past","g-perf"]],
["Zum Glück hatte ich ein Buch dabei, sodass die Zeit schnell vergangen ist.","Luckily I had a book with me, so the time passed quickly.",["g-sub","g-perf"]],
["Im Zug habe ich dann eine nette Frau kennengelernt.","On the train I then met a nice woman.",["g-perf","g-adj"]],
["Wir haben uns die ganze Fahrt unterhalten und Nummern getauscht.","We talked the whole journey and swapped numbers.",["g-perf","g-plural"]],
["Vielleicht war der verpasste Zug am Ende sogar ein Glück.","Maybe the missed train was even a stroke of luck in the end.",["g-past","g-adj"]]],
q:[["Wohin wollte die Person fahren?",["nach Berlin","nach Hamburg","nach München"],1],["Warum hat sie den Zug verpasst?",["Der Bus hatte Verspätung.","Sie hat verschlafen.","Der Zug ist früher gefahren."],0],["Wen hat sie im Zug kennengelernt?",["einen alten Freund","eine nette Frau","ihren Chef"],1]],r:["Warum war der verpasste Zug vielleicht ein Glück?", ["Sie hat im Zug eine Frau kennengelernt.", "Der Zug war am Ende viel billiger.", "Sie ist am Ende früher angekommen."], 0]},
{id:"a2-erkaeltet",level:"A2",title:"Eine schlimme Erkältung",en:"A bad cold",s:[
["Seit Montag bin ich stark erkältet.","Since Monday I've had a bad cold.",["g-dat","g-v2"]],
["Ich huste die ganze Nacht, und mein Hals tut weh.","I cough all night, and my throat hurts.",["g-poss"]],
["Am Dienstag war ich so müde, dass ich kaum wach bleiben konnte.","On Tuesday I was so tired that I could hardly stay awake.",["g-past","g-sub","g-modal"]],
["Deshalb bin ich in die Sprechstunde von meiner Ärztin gegangen.","So I went to my doctor's surgery hours.",["g-perf","g-prep2"]],
["Sie hat mich untersucht und gesagt, dass es nicht schlimm ist.","She examined me and said it isn't serious.",["g-perf","g-sub"]],
["Sie hat mir ein Rezept für ein Medikament gegeben.","She gave me a prescription for a medicine.",["g-perf","g-dat"]],
["Ich muss dreimal am Tag eine Tablette nehmen.","I have to take a tablet three times a day.",["g-modal"]],
["Zum Glück bezahlt die Krankenkasse fast alles.","Luckily the health insurance pays for almost everything.",["g-v2"]],
["Jetzt soll ich mich ausruhen und viel Tee trinken.","Now I'm supposed to rest and drink lots of tea.",["g-modal"]],
["Mein Körper braucht Zeit, sagt die Ärztin.","My body needs time, the doctor says.",["g-poss"]],
["Heute fühle ich mich schon ein bisschen besser.","Today I already feel a bit better.",["g-v2"]],
["Gesundheit ist eben das Wichtigste.","Health really is the most important thing.",["g-gender"]]],

{id:"a2-joggen",level:"A2",title:"Der Unfall beim Joggen",en:"The jogging accident",s:[
["Letzten Sonntag bin ich wie immer im Park joggen gegangen.","Last Sunday I went jogging in the park as usual.",["g-perf"]],
["Plötzlich bin ich auf dem nassen Weg gefallen.","Suddenly I fell on the wet path.",["g-perf","g-adj"]],
["Ich habe mich am Rücken und am Arm verletzt.","I hurt my back and my arm.",["g-perf","g-dat"]],
["Die Schmerzen waren so stark, dass ich nicht aufstehen konnte.","The pain was so bad that I couldn't get up.",["g-past","g-sub","g-modal"]],
["Eine Frau hat den Unfall gesehen und sofort angerufen.","A woman saw the accident and called for help right away.",["g-perf","g-sep"]],
["Im Krankenhaus hat mich ein junger Arzt untersucht.","At the hospital a young doctor examined me.",["g-perf","g-adj"]],
["Zum Glück war es nicht so schlimm wie gedacht.","Luckily it wasn't as bad as I'd thought.",["g-past"]],
["Ich habe ein Medikament gegen die Schmerzen bekommen.","I got a medicine for the pain.",["g-perf","g-acc"]],
["Die Rechnung hat die Krankenkasse bezahlt.","The health insurance paid the bill.",["g-perf","g-v2"]],
["Zwei Wochen lang durfte ich keinen Sport machen.","For two weeks I wasn't allowed to do any sport.",["g-past","g-modal","g-neg"]],
["Jetzt laufe ich wieder, aber viel vorsichtiger.","Now I run again, but much more carefully.",["g-adj"]],
["Meine Gesundheit ist mir wichtiger als jeder Rekord.","My health matters more to me than any record.",["g-poss","g-dat"]]],

{id:"a2-bewerbung",level:"A2",title:"Die Bewerbung",en:"The application",s:[
["Ich habe im Internet eine interessante Anzeige gefunden.","I found an interesting ad on the internet.",["g-perf","g-adj"]],
["Eine Firma in Köln sucht Mitarbeiter für ein neues Projekt.","A company in Cologne is looking for staff for a new project.",["g-adj","g-acc"]],

["In der Anzeige steht, dass man gern im Team arbeiten muss.","The ad says that you have to like working in a team.",["g-sub","g-modal"]],
["Über das Gehalt steht dort leider nichts.","Unfortunately it says nothing there about the salary.",["g-neg"]],
["Wenn ich die Stelle bekomme, unterschreibe ich sofort den Vertrag.","If I get the job, I'll sign the contract straight away.",["g-sub","g-v2"]],
["Hoffentlich bekomme ich bald eine Antwort.","Hopefully I'll get an answer soon.",["g-v2"]]],
q:[["Wo hat sie die Anzeige gefunden?",["im Internet","in der Zeitung","im Radio"],0],["Was sucht die Firma?",["Mitarbeiter für ein Projekt", "eine Chefin für das Büro", "Kunden für ein Produkt"],0],["Wie viele Jahre Erfahrung hat sie?",["drei","zwei","fünf"],0]],r:["Warum passt sie gut zu der Stelle?",["Sie hat Erfahrung und kann Englisch.", "Sie wohnt schon sehr lange in Köln.", "Sie kennt den Chef der Firma gut."],0]},
{id:"a2-arbeitstag",level:"A2",title:"Der erste Arbeitstag",en:"The first day at work",s:[
["Heute war mein erster Arbeitstag in der neuen Firma.","Today was my first day at the new company.",["g-past","g-adj"]],
["Meine Chefin hat mich allen Mitarbeitern vorgestellt.","My boss introduced me to all the staff.",["g-perf","g-dat","g-sep"]],
["Mein Team ist klein, aber sehr sympathisch.","My team is small but very likeable.",["g-poss"]],
["Eine Kollegin hat mir das Büro und die Cafeteria gezeigt.","A colleague showed me the office and the cafeteria.",["g-perf","g-dat"]],
["Danach habe ich einen Laptop und ein Passwort bekommen.","After that I got a laptop and a password.",["g-perf","g-acc"]],
["Am Nachmittag hatten wir schon das erste Treffen für das neue Projekt.","In the afternoon we already had the first meeting for the new project.",["g-past","g-adj"]],
["Das war ein bisschen stressig, weil ich noch nicht alles verstanden habe.","That was a bit stressful because I didn't understand everything yet.",["g-sub","g-perf"]],
["Aber die anderen waren sehr freundlich und haben mir geholfen.","But the others were very friendly and helped me.",["g-past","g-perf","g-dat"]],
["Das Gehalt ist besser als in meiner alten Firma.","The salary is better than at my old company.",["g-adj","g-dat"]],
["Dort habe ich gekündigt, weil ich zu viel Stress hatte.","I quit there because I had too much stress.",["g-perf","g-sub","g-past"]],
["Den Vertrag habe ich schon letzte Woche unterschrieben.","I already signed the contract last week.",["g-perf","g-acc"]],
["Morgen will ich unbedingt pünktlich sein.","Tomorrow I really want to be on time.",["g-modal"]]],
q:[["Wer hat sie allen Mitarbeitern vorgestellt?",["die Chefin","eine Kollegin","der Vermieter"],0],["Was hat sie bekommen?",["einen Laptop und ein Passwort", "ein Auto und einen Schlüssel", "ein Handy und eine Tasche"],0],["Warum hat sie in der alten Firma gekündigt?",["Sie hatte zu viel Stress.","Das Büro war zu klein.","Die Chefin war unfreundlich."],0]],r:["Wie findet sie die neue Stelle wahrscheinlich?",["gut, auch wenn es stressig ist", "schlecht, wegen des Teams", "langweilig, ohne Projekte"],0]},
{id:"a2-umzug",level:"A2",title:"Endlich eingezogen",en:"Moved in at last",s:[
["Letzte Woche war endlich unser Umzug.","Last week we finally moved.",["g-past","g-poss"]],
["Unsere neue Wohnung liegt im dritten Stockwerk.","Our new flat is on the third floor.",["g-adj","g-dat"]],
["Leider gibt es keinen Aufzug, nur eine enge Treppe.","Unfortunately there's no lift, only a narrow staircase.",["g-neg","g-adj"]],
["Zum Glück haben uns zwei Freunde geholfen, die Möbel zu tragen.","Luckily two friends helped us carry the furniture.",["g-perf","g-dat"]],
["Vorher hatten wir die Wohnung zwei Wochen lang renoviert.","Before that we had spent two weeks renovating the flat.",["g-past","g-perf"]],
["Das Wohnzimmer ist jetzt hell und freundlich.","The living room is now bright and welcoming.",["g-gender"]],
["Das Schlafzimmer ist klein, aber ruhig.","The bedroom is small but quiet.",["g-gender"]],
["Unsere Vermieterin wohnt im Erdgeschoss.","Our landlady lives on the ground floor.",["g-poss","g-dat"]],
["Sie hat uns den Keller und die Garage gezeigt.","She showed us the cellar and the garage.",["g-perf","g-dat","g-acc"]],
["Die Heizung funktioniert noch nicht richtig, deshalb ist es abends kalt.","The heating doesn't work properly yet, so it's cold in the evenings.",["g-neg","g-v2"]],
["Der Nachbar von nebenan hat uns Kuchen gebracht.","The neighbour from next door brought us cake.",["g-perf","g-dat"]],
["Jetzt müssen wir nur noch alles auspacken und die Bilder an die Wand hängen.","Now we just have to unpack everything and hang the pictures on the wall.",["g-modal","g-sep","g-prep2"]]],
q:[["In welchem Stockwerk liegt die Wohnung?",["im dritten","im ersten","im fünften"],0],["Wo wohnt die Vermieterin?",["im Erdgeschoss", "im Keller unten", "in der Wohnung nebenan"],0],["Was hat der Nachbar gebracht?",["Kuchen","Blumen","Wein"],0]],r:["Warum war es schwer, die Möbel nach oben zu bringen?",["Es gibt keinen Aufzug.","Die Möbel waren kaputt.","Die Freunde kamen zu spät."],0]},
{id:"a2-haushalt",level:"A2",title:"Wer macht was im Haushalt?",en:"Who does what at home?",s:[
["Ich wohne mit zwei Freunden in einer Wohnung im Zentrum.","I live with two friends in a flat in the centre.",["g-dat"]],
["Am Anfang haben wir oft über den Haushalt gestritten.","At first we often argued about the housework.",["g-perf","g-acc"]],
["Jan hat nie sein Geschirr gespült, und Mia hat nie aufgeräumt.","Jan never washed up his dishes, and Mia never tidied up.",["g-perf","g-neg"]],
["Ich habe mich jeden Tag darüber geärgert.","I got annoyed about it every day.",["g-perf"]],
["Deshalb haben wir einen Plan gemacht und die Arbeit geteilt.","So we made a plan and shared out the work.",["g-perf"]],
["Jetzt putzt jede Woche eine andere Person das Bad.","Now a different person cleans the bathroom each week.",["g-v2","g-acc"]],
["Wer die Küche macht, bringt auch den Müll in den Keller.","Whoever does the kitchen also takes the rubbish down to the cellar.",["g-sub","g-prep2"]],
["Die Wäsche wäscht jeder selbst.","Everyone does their own laundry.",["g-acc","g-conj"]],
["Seitdem ist die Wohnung meistens sauber.","Since then the flat has mostly been clean.",["g-v2"]],
["Nur der Kühlschrank ist manchmal leer, weil niemand einkaufen will.","Only the fridge is sometimes empty, because nobody wants to go shopping.",["g-sub","g-modal"]],
["Jan sagt, er ist nicht faul, er hat nur viel zu tun.","Jan says he isn't lazy, he just has a lot to do.",["g-neg"]],
["Aber wenn sein Zimmer schmutzig ist, lachen wir nur noch darüber.","But when his room is dirty, we just laugh about it now.",["g-sub","g-poss"]]],
q:[["Worüber haben sie am Anfang gestritten?",["über den Haushalt", "über die Miete", "über die Musik"],0],["Was haben sie dann gemacht?",["einen Plan","eine Party","einen Ausflug"],0],["Was ist manchmal leer?",["der Kühlschrank", "das Bad", "der Keller"],0]],r:["Warum streiten sie jetzt weniger?",["Jeder weiß, was er machen muss.", "Jan ist inzwischen ausgezogen.", "Sie haben jetzt eine Putzhilfe."],0]},
{id:"a2-rucksack",level:"A2",title:"Mit dem Rucksack durch Österreich",en:"Backpacking through Austria",s:[
["Im Sommer bin ich mit meinem Rucksack durch Österreich gereist.","In summer I travelled through Austria with my backpack.",["g-perf","g-dat"]],
["Vorher habe ich nur die erste Unterkunft gebucht, eine Jugendherberge in Wien.","Beforehand I only booked the first place to stay, a youth hostel in Vienna.",["g-perf"]],
["In der Hauptstadt habe ich einen Rundgang durch die Altstadt gemacht.","In the capital I took a walking tour of the old town.",["g-perf","g-acc"]],
["Mit dem Stadtplan habe ich alle Sehenswürdigkeiten gefunden.","With the city map I found all the sights.",["g-perf","g-plural"]],
["Danach bin ich mit dem Zug in die Berge gefahren.","Then I took the train to the mountains.",["g-perf","g-prep2"]],
["In Salzburg musste ich umsteigen, aber der Zug hatte Verspätung.","In Salzburg I had to change trains, but the train was late.",["g-past","g-modal"]],
["Ich habe auf den Fahrplan geschaut und einen anderen Zug genommen.","I looked at the timetable and took another train.",["g-perf"]],
["Die Landschaft war wunderschön: hohe Berge, grüne Wälder und klare Seen.","The landscape was beautiful: high mountains, green forests and clear lakes.",["g-past","g-adj","g-plural"]],
["Am Abend habe ich immer spontan ein Zimmer reserviert.","In the evening I always booked a room on the spot.",["g-perf"]],
["Busse und Züge sind dort gute Verkehrsmittel, auch für Touristen.","Buses and trains are good ways to get around there, even for tourists.",["g-plural"]],
["Ich habe viele andere Touristen aus der ganzen Welt kennengelernt.","I met lots of other tourists from all over the world.",["g-perf","g-sep"]],
["Nächstes Jahr möchte ich wieder so verreisen.","Next year I'd like to travel like this again.",["g-modal"]]],
q:[["Wo war die erste Unterkunft?",["in Wien","in Salzburg","in Graz"],0],["Was ist in Salzburg passiert?",["Der Zug hatte Verspätung.","Sie hat ihren Pass verloren.","Das Hotel war schon voll."],0],["Wen hat sie kennengelernt?",["viele Touristen","einen Bergführer","ihre Cousine"],0]],r:["Warum hat sie nur die erste Unterkunft gebucht?",["Sie wollte frei und spontan reisen.", "Alle anderen Hotels waren voll.", "Sie hatte nicht genug Geld dabei."],0]},
{id:"a2-camping",level:"A2",title:"Camping am See",en:"Camping by the lake",s:[
["Im August haben wir mit Freunden ein Wochenende am See verbracht.","In August we spent a weekend at the lake with friends.",["g-perf"]],
["Wir hatten keine Lust auf ein Hotel und wollten im Zelt schlafen.","We didn't feel like a hotel and wanted to sleep in a tent.",["g-past","g-modal","g-neg"]],
["Der Bus hatte eine Stunde Verspätung, weil es eine Baustelle gab.","The bus was an hour late because there were roadworks.",["g-past","g-sub"]],
["Der Campingplatz lag direkt neben einem kleinen Wald.","The campsite was right next to a small forest.",["g-past","g-dat","g-adj"]],
["Vom Strand aus konnte man eine kleine Insel sehen.","From the beach you could see a small island.",["g-past","g-modal"]],
["Wir sind geschwommen und haben in der Sonne gelegen.","We swam and lay in the sun.",["g-perf"]],
["Am Abend haben wir Würste gegrillt und Vögel beobachtet.","In the evening we grilled sausages and watched birds.",["g-perf","g-plural"]],
["Plötzlich wurde der Himmel dunkel, und dicke Wolken kamen.","Suddenly the sky went dark and thick clouds came.",["g-past","g-adj"]],
["In der Nacht gab es ein starkes Gewitter.","In the night there was a heavy thunderstorm.",["g-past","g-adj"]],
["Am Morgen war alles nass, auch unsere Rucksäcke.","In the morning everything was wet, even our backpacks.",["g-past","g-plural"]],
["Wir haben die Sachen in die Sonne gehängt, und bald war alles wieder trocken.","We hung our things in the sun, and soon everything was dry again.",["g-perf","g-past"]],
["Trotz des Wetters war es ein tolles Erlebnis in der Natur.","Despite the weather it was a great experience out in nature.",["g-past","g-adj"]]],
q:[["Wo haben sie geschlafen?",["im Zelt","im Hotel","in einer Jugendherberge"],0],["Warum hatte der Bus Verspätung?",["wegen einer Baustelle", "wegen des Gewitters", "wegen eines Unfalls"],0],["Was war am Morgen nass?",["alles, auch die Rucksäcke", "nur das Zelt und die Schuhe", "nur die Handtücher"],0]],r:["Waren sie am Ende zufrieden?",["Ja, trotz des Gewitters.","Nein, wegen des Wetters.","Nein, das Zelt war kaputt."],0]},
{id:"a2-april",level:"A2",title:"Vier Jahreszeiten an einem Tag",en:"Four seasons in one day",s:[
["Im April ist das Wetter in Deutschland oft verrückt.","In April the weather in Germany is often crazy.",["g-dat"]],
["Gestern Morgen war es neblig und kühl.","Yesterday morning it was foggy and cool.",["g-past"]],
["Ich habe meinen Mantel und eine Mütze angezogen.","I put on my coat and a hat.",["g-perf","g-sep","g-acc"]],
["Mittags war der Himmel blau, und es war fast warm.","At midday the sky was blue and it was almost warm.",["g-past"]],
["Am Nachmittag wurde es plötzlich bewölkt und windig.","In the afternoon it suddenly turned cloudy and windy.",["g-past"]],
["Dann hat es sogar ein bisschen geschneit!","Then it even snowed a little!",["g-perf"]],
["Ich hatte keinen Schirm dabei und bin ganz nass geworden.","I didn't have an umbrella with me and got completely wet.",["g-past","g-perf","g-neg"]],
["Meine Stiefel waren am Abend noch nicht trocken.","My boots still weren't dry in the evening.",["g-past","g-poss","g-plural"]],
["Im Radio haben sie gesagt, dass morgen ein Gewitter kommt.","On the radio they said a thunderstorm is coming tomorrow.",["g-perf","g-sub"]],
["Wahrscheinlich bleibe ich morgen einfach zu Hause.","I'll probably just stay at home tomorrow.",["g-v2"]],
["Meine Oma sagt immer: „April, April, der macht, was er will.“","My grandma always says: 'April, April, does whatever it likes.'",["g-poss"]],
["Ich glaube, sie hat recht.","I think she's right.",["g-v2"]]],
q:[["Wie war das Wetter am Morgen?",["neblig und kühl","sonnig und heiß","windig und nass"],0],["Was hatte die Person nicht dabei?",["einen Schirm","eine Mütze","einen Mantel"],0],["Was kommt morgen?",["ein Gewitter", "sehr viel Schnee", "die Sonne"],0]],r:["Was bedeutet der Satz der Oma?",["Das Wetter im April ändert sich oft.", "Im April regnet es fast jeden Tag.", "Im April ist es immer sehr kalt."],0]},
{id:"a2-wald",level:"A2",title:"Ein Tag im Wald",en:"A day in the forest",s:[
["Am Samstag sind wir mit der Klasse in den Wald gegangen.","On Saturday we went into the forest with our class.",["g-perf","g-prep2"]],
["Unsere Lehrerin wollte uns die Natur zeigen.","Our teacher wanted to show us nature.",["g-past","g-modal","g-dat"]],
["Es war sonnig, und nur ein paar kleine Wolken waren am Himmel.","It was sunny, and there were only a few small clouds in the sky.",["g-past","g-adj"]],
["Wir sind lange auf einem schmalen Weg gewandert.","We hiked for a long time along a narrow path.",["g-perf","g-adj","g-dat"]],
["Dann sind wir über eine alte Brücke an einen Fluss gekommen.","Then we crossed an old bridge and came to a river.",["g-perf","g-prep2","g-adj"]],
["Dort haben wir verschiedene Pflanzen gesucht und fotografiert.","There we looked for different plants and photographed them.",["g-perf","g-plural"]],
["Wir mussten leise sein, damit wir die Tiere nicht stören.","We had to be quiet so that we didn't disturb the animals.",["g-past","g-modal","g-sub"]],
["Wir haben viele Vögel gehört und sogar zwei Pferde auf einer Wiese gesehen.","We heard lots of birds and even saw two horses in a meadow.",["g-perf","g-plural"]],
["Leider lag auch Müll im Wald.","Unfortunately there was rubbish lying in the forest too.",["g-past"]],
["Wir haben ihn in Tüten gesammelt und mitgenommen.","We collected it in bags and took it with us.",["g-perf","g-sep"]],
["Am Ende war der Weg wieder sauber.","In the end the path was clean again.",["g-past"]],
["Die Ruhe im Wald hat allen gutgetan.","The peace of the forest did everyone good.",["g-perf","g-dat"]]],
q:[["Mit wem sind sie in den Wald gegangen?",["mit der Lehrerin", "mit den Eltern", "mit dem Förster"],0],["Was haben sie auf einer Wiese gesehen?",["zwei Pferde","zwei Hunde","zwei Katzen"],0],["Was haben sie mit dem Müll gemacht?",["Sie haben ihn mitgenommen.","Sie haben ihn liegen lassen.","Sie haben ihn fotografiert."],0]],r:["Was hat die Klasse an diesem Tag gelernt?",["Man muss die Natur sauber halten.", "Wandern ist sehr langweilig.", "Im Wald gibt es keine Tiere."],0]},
{id:"a2-festival",level:"A2",title:"Ein Wochenende voller Kultur",en:"A weekend full of culture",s:[
["In unserer Stadt findet jedes Jahr im Juni ein Kulturfestival statt.","Every June a culture festival takes place in our town.",["g-sep","g-dat"]],
["Ich habe das Programm auf einem Plakat am Rathaus gesehen.","I saw the programme on a poster at the town hall.",["g-perf","g-dat"]],
["Am Freitag bin ich mit meiner Schwester ins Museum gegangen.","On Friday I went to the museum with my sister.",["g-perf","g-prep2"]],
["Dort gab es eine Ausstellung über moderne Kunst.","There was an exhibition about modern art.",["g-past","g-adj"]],
["Der Eintritt war kostenlos, und die Bilder waren spannend.","Admission was free, and the pictures were exciting.",["g-past"]],
["Am Samstag haben wir ein Theaterstück im Park gesehen.","On Saturday we saw a play in the park.",["g-perf"]],
["Ehrlich gesagt war es ein bisschen langweilig.","To be honest, it was a bit boring.",["g-past"]],
["Am Sonntag war das Konzert, die größte Veranstaltung des Festivals.","On Sunday was the concert, the biggest event of the festival.",["g-past","g-adj"]],
["Eine bekannte Band aus Hamburg hat gespielt.","A well-known band from Hamburg played.",["g-perf"]],
["Der Sänger ist ein echter Star, und meine Schwester ist ein großer Fan.","The singer is a real star, and my sister is a big fan.",["g-adj","g-poss"]],
["Für Schüler und Studenten gab es eine Ermäßigung.","There was a discount for pupils and students.",["g-past","g-plural"]],
["Ich finde, Kultur macht im Sommer besonders viel Spaß.","I think culture is especially fun in summer.",["g-v2"]]],
q:[["Wo hat die Person das Programm gesehen?",["auf einem Plakat", "in der Zeitung", "im Fernsehen"],0],["Wie war das Theaterstück?",["ein bisschen langweilig", "wirklich sehr spannend", "leider viel zu laut"],0],["Wer ist ein großer Fan?",["die Schwester", "ihre Mutter", "der beste Freund"],0]],r:["Welcher Tag hat der Schwester wahrscheinlich am besten gefallen?",["der Sonntag","der Freitag","der Samstag"],0]},
{id:"a2-band",level:"A2",title:"Die Band im Keller",en:"The band in the cellar",s:[
["Mein Bruder Leon hat mit drei Freunden eine Band gegründet.","My brother Leon started a band with three friends.",["g-perf"]],
["Jeder spielt ein anderes Instrument: Gitarre, Bass, Schlagzeug und Klavier.","Each plays a different instrument: guitar, bass, drums and piano.",["g-adj"]],
["Leon singt, aber leider nicht immer richtig.","Leon sings, but unfortunately not always in tune.",["g-neg"]],
["Sie üben jeden Mittwoch im Keller von unserem Haus.","They practise every Wednesday in the cellar of our house.",["g-dat"]],
["Die Nachbarn finden das nicht so toll, weil es sehr laut ist.","The neighbours don't think that's so great, because it's very loud.",["g-sub","g-neg","g-plural"]],
["Einmal hat sich eine Nachbarin beschwert, weil die Musik sie gestört hat.","Once a neighbour complained because the music disturbed her.",["g-perf","g-sub"]],
["Seitdem spielen sie nur bis acht Uhr abends.","Since then they only play until eight in the evening.",["g-v2"]],
["Leons großer Traum ist ein Konzert vor vielen Fans.","Leon's big dream is a concert in front of lots of fans.",["g-adj","g-plural"]],
["Im Mai haben sie bei einem Wettbewerb für junge Bands mitgemacht.","In May they took part in a competition for young bands.",["g-perf","g-sep"]],
["Vorher waren alle sehr nervös, aber es war total aufregend.","Beforehand they were all very nervous, but it was really exciting.",["g-past"]],
["Sie haben nicht gewonnen, aber das Publikum war begeistert.","They didn't win, but the audience loved it.",["g-perf","g-neg"]],
["Jetzt träumt Leon davon, ein Star zu werden.","Now Leon dreams of becoming a star.",["g-v2"]]],
q:[["Wo übt die Band?",["im Keller","in der Schule","in einer Garage"],0],["Warum hat sich eine Nachbarin beschwert?",["Die Musik hat sie gestört.","Die Band hat ihr Auto blockiert.","Leon hat sie nicht gegrüßt."],0],["Was ist beim Wettbewerb passiert?",["Sie haben nicht gewonnen.","Sie haben den ersten Preis gewonnen.","Sie durften nicht mitmachen."],0]],r:["Warum spielen sie jetzt nur bis acht Uhr?",["Sie wollen die Nachbarn nicht stören.", "Leon muss früh ins Bett gehen.", "Der Keller ist abends geschlossen."],0]},
{id:"a2-kleid",level:"A2",title:"Ein Kleid für die Hochzeit",en:"A dress for the wedding",s:[
["Meine beste Freundin heiratet im Juli, und ich brauche ein neues Kleid.","My best friend is getting married in July, and I need a new dress.",["g-poss","g-adj"]],
["Am Samstag bin ich ins Einkaufszentrum gefahren.","On Saturday I went to the shopping centre.",["g-perf","g-prep2"]],
["Im ersten Geschäft war die Mode zu bunt für mich.","In the first shop the fashion was too colourful for me.",["g-past","g-adj"]],
["Im Kaufhaus habe ich dann ein blaues Kleid gefunden.","Then I found a blue dress in the department store.",["g-perf","g-adj"]],
["Ich habe es probiert, aber es war zu eng.","I tried it on, but it was too tight.",["g-perf","g-past"]],
["Die Verkäuferin hat mir eine andere Größe gebracht.","The shop assistant brought me a different size.",["g-perf","g-dat"]],
["Das Kleid hat perfekt gepasst und war sehr bequem.","The dress fitted perfectly and was very comfortable.",["g-perf","g-past"]],
["Leider war es nicht besonders preiswert.","Unfortunately it wasn't exactly cheap.",["g-past","g-neg"]],
["Aber die Qualität ist gut, und ich kann es oft tragen.","But the quality is good, and I can wear it often.",["g-modal"]],
["Dazu habe ich eine silberne Kette gekauft.","I bought a silver necklace to go with it.",["g-perf","g-adj"]],
["Ich habe zu viel Geld ausgegeben, meine Geldbörse ist fast leer.","I've spent too much money, my purse is almost empty.",["g-perf","g-sep","g-poss"]],
["Aber auf der Hochzeit möchte ich schön aussehen.","But I want to look nice at the wedding.",["g-modal","g-sep"]]],
q:[["Warum braucht sie ein Kleid?",["für eine Hochzeit", "für ein Konzert", "für die Arbeit"],0],["Was war das Problem mit dem ersten Kleid?",["Es war zu eng.","Es war zu teuer.","Es war zu bunt."],0],["Was hat sie noch gekauft?",["eine Kette","einen Rock","Schuhe"],0]],r:["Warum ist sie trotzdem zufrieden?",["Das Kleid ist schön und bequem.","Das Kleid war sehr billig.","Die Freundin hat alles bezahlt."],0]},
{id:"a2-oma",level:"A2",title:"Shopping mit Oma",en:"Shopping with Grandma",s:[
["Meine Oma ist Rentnerin und hat viel Zeit.","My grandma is retired and has lots of time.",["g-poss"]],
["Letzte Woche wollte sie mit mir einen neuen Mantel kaufen.","Last week she wanted to buy a new coat with me.",["g-past","g-modal","g-adj"]],
["Wir sind zusammen in ein großes Kaufhaus gegangen.","We went together to a big department store.",["g-perf","g-prep2","g-adj"]],
["Oma findet die moderne Mode oft komisch.","Grandma often finds modern fashion strange.",["g-adj"]],
["„Warum haben alle Jeans Löcher?“, hat sie gefragt.","'Why do all jeans have holes?' she asked.",["g-perf","g-plural"]],
["Sie hat viele Mäntel probiert, aber keiner hat gepasst.","She tried on lots of coats, but none of them fitted.",["g-perf","g-plural"]],
["Ein Mantel war zu kurz, ein anderer war hässlich.","One coat was too short, another was ugly.",["g-past"]],
["Am Ende hat sie einen warmen Mantel gefunden, der bequem und preiswert war.","In the end she found a warm coat that was comfortable and good value.",["g-perf","g-adj","g-sub"]],
["Für meinen Opa hat sie noch ein Hemd und einen Pullover gekauft.","She also bought a shirt and a jumper for my grandpa.",["g-perf","g-poss"]],
["Opa trägt zwar lieber seinen alten Anzug, aber Oma hat ihn nicht gefragt.","Grandpa would rather wear his old suit, but Grandma didn't ask him.",["g-adj","g-perf"]],
["Mir hat sie eine Mütze geschenkt, und ein bisschen Taschengeld gab es auch.","She gave me a hat, and there was a bit of pocket money too.",["g-perf","g-dat","g-past"]],
["Mit Oma einkaufen ist anstrengend, aber auch lustig.","Shopping with Grandma is tiring, but fun too.",["g-v2"]]],
q:[["Was wollte Oma kaufen?",["einen Mantel", "eine Jeans", "Stiefel"],0],["Was findet Oma komisch?",["die moderne Mode", "die Verkäuferin", "das Kaufhaus"],0],["Was hat die Person bekommen?",["eine Mütze und Taschengeld","einen Pullover und ein Hemd","einen Mantel und Stiefel"],0]],r:["Wird Opa das neue Hemd wahrscheinlich gern tragen?",["Vielleicht nicht, er mag seinen Anzug.", "Ja, er hat es selbst im Laden ausgesucht.", "Ja, er braucht dringend ein Hemd."],0]},
{id:"a2-rezept",level:"A2",title:"Omas Rezept",en:"Grandma's recipe",s:[
["Meine Großmutter kocht seit fünfzig Jahren dasselbe Gericht: Gulasch.","My grandmother has been cooking the same dish for fifty years: goulash.",["g-dat"]],
["Letzten Sonntag hat sie mir endlich ihr Rezept gezeigt.","Last Sunday she finally showed me her recipe.",["g-perf","g-dat","g-poss"]],
["Zuerst haben wir Zwiebeln und Rindfleisch mit einem scharfen Messer geschnitten.","First we cut onions and beef with a sharp knife.",["g-perf","g-adj","g-dat"]],
["Dann haben wir das Fleisch in einem großen Topf gebraten.","Then we fried the meat in a big pot.",["g-perf","g-adj"]],
["Oma gibt viel Paprika dazu, deshalb ist das Gericht ein bisschen scharf.","Grandma adds lots of paprika, so the dish is a bit spicy.",["g-v2"]],
["Danach muss alles zwei Stunden kochen.","After that everything has to cook for two hours.",["g-modal"]],
["„Das Geheimnis ist ein Löffel Zucker“, hat Oma leise gesagt.","'The secret is a spoonful of sugar,' Grandma said quietly.",["g-perf"]],
["Zum Mittagessen kam die ganze Familie.","The whole family came for lunch.",["g-past"]],
["Jeder hat einen großen Teller mit Kartoffeln bekommen.","Everyone got a big plate with potatoes.",["g-perf","g-adj"]],
["Mein Bruder hat sogar eine zweite Portion gegessen.","My brother even had a second helping.",["g-perf","g-adj"]],
["Ich habe das Rezept in mein Heft geschrieben.","I wrote the recipe down in my notebook.",["g-perf","g-prep2"]],
["Nächste Woche probiere ich es selbst, hoffentlich klappt es!","Next week I'll try it myself, hopefully it works!",["g-v2"]]],
q:[["Welches Gericht kocht Oma?",["Gulasch", "Pizza", "Suppe"],0],["Was ist das Geheimnis?",["ein Löffel Zucker", "ein Stück Butter", "ein Glas Wein"],0],["Wer hat eine zweite Portion gegessen?",["der Bruder", "die Oma", "der Vater"],0]],r:["Warum hat die Person das Rezept in ihr Heft geschrieben?",["Sie will es selbst kochen.","Sie muss es in der Schule zeigen.","Oma wollte das so."],0]},
{id:"a2-grillfest",level:"A2",title:"Das Grillfest",en:"The barbecue",s:[
["Zum Sommeranfang haben wir ein Fest im Garten gemacht.","To start the summer we had a party in the garden.",["g-perf"]],
["Wir haben alle Nachbarn eingeladen.","We invited all the neighbours.",["g-perf","g-sep","g-plural"]],
["Jeder sollte etwas mitbringen: einen Salat, Brot oder etwas Süßes.","Everyone was supposed to bring something: a salad, bread or something sweet.",["g-past","g-modal","g-sep"]],
["Mein Vater stand am Grill und hat Würste und Hamburger gegrillt.","My father stood at the grill and grilled sausages and burgers.",["g-past","g-perf","g-plural"]],
["Für die Gäste ohne Fleisch gab es Gemüse und Käse vom Grill.","For the guests who don't eat meat there were grilled vegetables and cheese.",["g-past","g-plural"]],
["Frau Schulz von nebenan hat einen großen Nudelsalat gemacht.","Mrs Schulz from next door made a big pasta salad.",["g-perf","g-adj"]],
["Zum Trinken gab es Saft, Mineralwasser und Bier.","To drink there was juice, mineral water and beer.",["g-past"]],
["Leider hatten wir nicht genug Teller und Gabeln.","Unfortunately we didn't have enough plates and forks.",["g-past","g-neg","g-plural"]],
["Die Kinder haben deshalb Papierteller aus dem Supermarkt geholt.","So the children fetched paper plates from the supermarket.",["g-perf","g-dat"]],
["Zum Nachtisch gab es eine Torte mit Schokolade.","For dessert there was a chocolate cake.",["g-past"]],
["Am Ende waren alle satt und zufrieden.","In the end everyone was full and happy.",["g-past"]],
["Die Feier hat bis Mitternacht gedauert.","The party went on until midnight.",["g-perf"]]],
q:[["Wen haben sie eingeladen?",["alle Nachbarn","nur die Familie","die Kollegen"],0],["Wer hat gegrillt?",["der Vater","Frau Schulz","die Kinder"],0],["Was hatten sie nicht genug?",["Teller und Gabeln", "Würste und Brot", "Saft und Wasser"],0]],r:["Warum gab es auch Gemüse vom Grill?",["Einige Gäste essen kein Fleisch.", "Die Würste waren schon alle weg.", "Der Vater mag kein Fleisch."],0]},
{id:"a2-passwort",level:"A2",title:"Das vergessene Passwort",en:"The forgotten password",s:[
["Gestern wollte ich am Laptop meine E-Mails lesen.","Yesterday I wanted to read my emails on the laptop.",["g-past","g-modal","g-poss"]],
["Aber ich hatte mein Passwort vergessen!","But I had forgotten my password!",["g-past","g-perf"]],
["Ich habe es dreimal falsch eingegeben, dann war das Konto gesperrt.","I typed it wrong three times, then the account was locked.",["g-perf","g-sep","g-past"]],
["Auf der Webseite gab es einen Link: „Passwort vergessen?“","On the website there was a link: 'Forgotten your password?'",["g-past"]],
["Ich habe darauf geklickt und eine Nachricht auf mein Handy bekommen.","I clicked on it and got a message on my phone.",["g-perf"]],
["Mit dem Code konnte ich ein neues Passwort machen.","With the code I could make a new password.",["g-past","g-modal"]],
["Mein Bruder sagt, ein sicheres Passwort muss lang sein.","My brother says a secure password has to be long.",["g-adj","g-modal"]],
["Außerdem soll man es oft ändern.","You should also change it often.",["g-modal"]],
["Danach wollte ich eine wichtige Datei herunterladen.","After that I wanted to download an important file.",["g-past","g-modal","g-adj"]],
["Leider war mein Tablet zu alt, und ich konnte sie nicht öffnen.","Unfortunately my tablet was too old and I couldn't open it.",["g-past","g-modal","g-neg"]],
["Ich habe die Datei am Laptop gespeichert, und dann hat es geklappt.","I saved the file on the laptop, and then it worked.",["g-perf"]],
["Jetzt schreibe ich alle Passwörter in ein Heft, aber mein Bruder findet das nicht sicher.","Now I write all my passwords in a notebook, but my brother doesn't think that's safe.",["g-neg","g-plural"]]],
q:[["Was hatte die Person vergessen?",["ihr Passwort","ihren Laptop","ihr Handy"],0],["Wie hat sie ein neues Passwort bekommen?",["mit einem Code","mit einem Brief","mit einem Anruf"],0],["Wo hat sie die Datei gespeichert?",["am Laptop","am Tablet","auf dem Handy"],0]],r:["Warum findet der Bruder das Heft nicht sicher?",["Andere können die Passwörter lesen.", "Das Heft ist für alles viel zu klein.", "Er mag keine Hefte."],0]},
{id:"a2-opa",level:"A2",title:"Opa lernt chatten",en:"Grandpa learns to chat online",s:[
["Mein Opa hat zum Geburtstag ein Tablet bekommen.","My grandpa got a tablet for his birthday.",["g-perf"]],
["Vorher hatte er nur ein altes Mobiltelefon ohne Kamera.","Before that he only had an old mobile phone without a camera.",["g-past","g-adj"]],
["Am Anfang hatte er Angst, etwas kaputt zu machen.","At first he was afraid of breaking something.",["g-past"]],
["Ich habe ihm gezeigt, wie man eine App herunterlädt.","I showed him how to download an app.",["g-perf","g-sub","g-dat"]],
["Jetzt chattet er jeden Tag mit seinen Enkeln.","Now he chats with his grandchildren every day.",["g-dat","g-plural"]],
["Er schickt uns Fotos von seinem Garten und von seinem Hund.","He sends us photos of his garden and his dog.",["g-dat","g-poss"]],
["Manchmal sind die Fotos komisch, weil sein Finger vor der Kamera ist.","Sometimes the photos look odd because his finger is in front of the camera.",["g-sub","g-dat"]],
["Seine Nachrichten schreibt er nur in Großbuchstaben.","He writes his messages only in capital letters.",["g-plural"]],
