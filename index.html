["Meine Schwester hat ihm erklärt, dass das wie Schreien aussieht.","My sister explained to him that it looks like shouting.",["g-perf","g-sub"]],
["Opa fand das sehr witzig und hat einen Witz zurückgeschickt.","Grandpa found that very funny and sent back a joke.",["g-past","g-perf","g-sep"]],
["Wir müssen noch ein bisschen üben, aber Opa ist jetzt online.","We still need to practise a bit, but Grandpa is online now.",["g-modal"]],
["Er sagt, das Gerät ist das beste Geschenk seit Jahren.","He says the device is the best present in years.",["g-adj"]]],
q:[["Was hat Opa bekommen?",["ein Tablet","ein Handy","eine Kamera"],0],["Mit wem chattet er jeden Tag?",["mit seinen Enkeln","mit seinen Nachbarn","mit seinem Arzt"],0],["Warum sind manche Fotos komisch?",["Sein Finger ist vor der Kamera.", "Sein Hund läuft immer weg.", "Es ist meistens zu dunkel."],0]],r:["Warum hatte Opa am Anfang Angst?",["Er kannte solche Geräte nicht.", "Das Tablet war sehr teuer.", "Er mag keine Fotos."],0]},
{id:"a2-streit",level:"A2",title:"Der erste Streit",en:"The first argument",s:[
["Lisa und Ben waren am Samstag um acht Uhr verabredet.","Lisa and Ben had arranged to meet at eight on Saturday.",["g-past"]],
["Lisa hat eine Stunde vor dem Kino gewartet, aber Ben ist nicht gekommen.","Lisa waited an hour outside the cinema, but Ben didn't come.",["g-perf","g-dat","g-neg"]],
["Sie hat den Film verpasst und war ziemlich sauer.","She missed the film and was pretty annoyed.",["g-perf","g-past"]],
["Ben hat gesagt, dass sein Bus kaputt war.","Ben said that his bus had broken down.",["g-perf","g-sub","g-past"]],
["Aber Lisa hatte keine Ahnung, ob das wahr war.","But Lisa had no idea whether that was true.",["g-past","g-sub","g-neg"]],
["Später hat sie gehört, dass Ben mit Freunden Fußball gespielt hat.","Later she heard that Ben had been playing football with friends.",["g-perf","g-sub"]],
["Lisa hat sich sehr geärgert und ein bisschen geweint.","Lisa got very upset and cried a little.",["g-perf"]],
["Am Telefon haben die beiden laut gestritten.","They argued loudly on the phone.",["g-perf","g-plural"]],
["„Ich mag keine Lügen“, hat Lisa gesagt.","'I don't like lies,' Lisa said.",["g-perf","g-neg","g-plural"]],
["Ben hat sich entschuldigt und versprochen, dass er nie wieder lügt.","Ben apologised and promised that he would never lie again.",["g-perf","g-sub"]],
["Ihre Mutter ist der Meinung, dass jeder eine zweite Chance verdient.","Her mother thinks everyone deserves a second chance.",["g-sub","g-poss"]],
["Lisas größter Wunsch ist jetzt nur: Ben soll pünktlich sein!","Lisa's biggest wish now is simply: Ben should be on time!",["g-adj","g-modal"]]],
q:[["Wo hat Lisa gewartet?",["vor dem Kino","vor dem Bahnhof","vor der Schule"],0],["Was hat Ben wirklich gemacht?",["Er hat Fußball gespielt.", "Er hat im Bus gesessen.", "Er war krank im Bett."],0],["Was hat Lisa am Telefon gesagt?",["Ich mag keine Lügen.","Ich mag keine Filme.","Ich mag keine Busse."],0]],r:["Warum war Lisa so traurig?",["Ben hat nicht die Wahrheit gesagt.", "Der Film war leider sehr schlecht.", "Sie hat ihr Handy verloren."],0]},
{id:"a2-verliebt",level:"A2",title:"Verliebt",en:"In love",s:[
["Tim hat sich im Deutschkurs in Sofia verliebt.","Tim has fallen in love with Sofia in his German class.",["g-perf","g-prep2"]],
["Sofia ist sehr sympathisch und hat immer gute Laune.","Sofia is very likeable and always in a good mood.",["g-adj"]],
["Tim träumt jede Nacht von ihr.","Tim dreams about her every night.",["g-dat"]],
["Aber er ist schüchtern und hat keine Ahnung, was er sagen soll.","But he's shy and has no idea what to say.",["g-neg","g-sub","g-modal"]],
["Sein Freund ist der Meinung, dass er sie einfach fragen muss.","His friend thinks he should just ask her.",["g-sub","g-modal"]],
["Nach dem Kurs hat Tim sie ganz nervös gefragt, ob sie Lust auf einen Kaffee hat.","After class Tim nervously asked her whether she'd like a coffee.",["g-perf","g-sub"]],
["Sofia hat gelacht und ja gesagt.","Sofia laughed and said yes.",["g-perf"]],
["Jetzt sind die beiden für Freitag verabredet.","Now the two of them have a date for Friday.",["g-plural"]],
["Tim möchte ihr eine Rose schenken, aber ist das nicht zu romantisch?","Tim would like to give her a rose, but isn't that too romantic?",["g-modal","g-dat","g-neg"]],
["Er hofft, dass sie zusammen viel Spaß haben.","He hopes they'll have lots of fun together.",["g-sub"]],
["Sein größter Wunsch ist eine echte Beziehung.","His biggest wish is a real relationship.",["g-adj","g-poss"]],
["Hoffentlich wird sein Traum wahr!","Hopefully his dream will come true!",["g-v2"]]],
q:[["Wo hat Tim Sofia kennengelernt?",["im Deutschkurs","im Fitnessstudio","im Zug"],0],["Was hat Tim sie gefragt?",["ob sie Lust auf Kaffee hat","ob sie ihm bei den Hausaufgaben hilft","ob sie mit ihm tanzen geht"],0],["Wann sind die beiden verabredet?",["am Freitag","am Montag","am Sonntag"],0]],r:["Warum hat Tim zuerst nichts gesagt?",["Er ist schüchtern.","Er mag Sofia nicht.","Er hat keine Zeit."],0]},
{id:"a2-arbeitsweg",level:"A2",title:"Mein Weg zur Arbeit",en:"My way to work",s:[
["Ich wohne am Stadtrand und arbeite im Zentrum.","I live on the edge of town and work in the centre.",["g-dat"]],
["Früher bin ich mit dem Wagen gefahren, weil ich gerade den Führerschein gemacht hatte.","I used to drive the car because I'd just got my driving licence.",["g-perf","g-sub","g-past"]],
["Aber im Zentrum war immer viel Verkehr.","But there was always lots of traffic in the centre.",["g-past"]],
["An jeder Ampel und jeder Kreuzung musste ich warten.","I had to wait at every traffic light and every junction.",["g-past","g-modal","g-dat"]],
["Und parken war am Rathaus fast unmöglich.","And parking near the town hall was almost impossible.",["g-past"]],
["Dann habe ich einen Motorroller gekauft.","Then I bought a scooter.",["g-perf","g-acc"]],
["Einmal hatte ich einen platten Reifen, direkt auf der Brücke.","Once I had a flat tyre, right on the bridge.",["g-past","g-adj"]],
["Ein anderes Mal hatte ich fast einen Unfall, weil ein Auto nicht gebremst hat.","Another time I almost had an accident because a car didn't brake.",["g-past","g-sub","g-perf"]],
["Der Verkehr war mir einfach zu gefährlich.","The traffic was simply too dangerous for me.",["g-past","g-dat"]],
["Heute fahre ich mit der Straßenbahn und muss nur einmal umsteigen.","Today I take the tram and only have to change once.",["g-modal","g-sep"]],
["Wegen der Baustelle an der Kirche gibt es manchmal Verspätung.","Because of the roadworks by the church there are sometimes delays.",["g-dat"]],
["Aber ich kann in der Bahn lesen, und das finde ich toll.","But I can read on the tram, and I think that's great.",["g-modal"]]],
q:[["Wo arbeitet die Person?",["im Zentrum","am Stadtrand","am Bahnhof"],0],["Was ist auf der Brücke passiert?",["Sie hatte einen platten Reifen.","Sie hatte einen schweren Unfall.","Sie hat ihren Schlüssel verloren."],0],["Wie fährt sie heute zur Arbeit?",["mit der Straßenbahn","mit dem Motorroller","mit dem Wagen"],0]],r:["Warum fährt sie nicht mehr mit dem Motorroller?",["Der Verkehr war zu gefährlich.", "Der Motorroller ist kaputt.", "Sie hat keinen Führerschein."],0]},
{id:"a2-fuehrerschein",level:"A2",title:"Der Führerschein",en:"The driving test",s:[
["Mit achtzehn wollte ich unbedingt den Führerschein machen.","At eighteen I really wanted to get my driving licence.",["g-past","g-modal"]],
["Dafür habe ich ein Jahr lang Geld gespart.","I saved money for a whole year for it.",["g-perf"]],
["Die Fahrstunden waren teurer, als ich gerechnet hatte.","The driving lessons were more expensive than I'd expected.",["g-past","g-sub","g-plural"]],
["In der ersten Stunde ist mir dreimal der Motor ausgegangen.","In the first lesson the engine stalled on me three times.",["g-perf","g-dat"]],
["Mein Fahrlehrer war aber sehr geduldig.","But my driving instructor was very patient.",["g-past","g-poss"]],
["Am schwierigsten war das Parken in einer engen Straße.","The hardest thing was parking in a narrow street.",["g-past","g-adj"]],
["Bei der Prüfung war ich so nervös, dass ich fast bei Rot über die Ampel gefahren bin.","In the test I was so nervous that I almost went through a red light.",["g-past","g-sub","g-perf"]],
["Der Prüfer hat nichts gesagt, und ich bin ganz vorsichtig weitergefahren.","The examiner said nothing, and I drove on very carefully.",["g-perf","g-sep"]],
["An der großen Kreuzung habe ich alles richtig gemacht.","At the big junction I did everything right.",["g-perf","g-dat"]],
["Am Ende hat der Prüfer gelächelt: „Bestanden!“","At the end the examiner smiled: 'Passed!'",["g-perf"]],
["Ich habe es geschafft, obwohl ich so nervös war.","I did it, even though I was so nervous.",["g-perf","g-sub","g-past"]],
["Jetzt leiht mir meine Mutter manchmal ihren Wagen.","Now my mother sometimes lends me her car.",["g-dat","g-poss"]]],
q:[["Wie lange hat sie Geld gespart?",["ein Jahr","einen Monat","zwei Jahre"],0],["Was war am schwierigsten?",["das Parken","die Autobahn","das Bremsen"],0],["Was ist bei der Prüfung fast passiert?",["Sie ist fast bei Rot gefahren.","Sie hatte fast einen Unfall.","Sie hat fast den Motor kaputt gemacht."],0]],r:["Warum hat der Prüfer am Ende gelächelt?",["Sie hat die Prüfung bestanden.", "Sie hat ihm einen Witz erzählt.", "Sie hat ihm Geld gegeben."],0]},
{id:"a2-zeugnis",level:"A2",title:"Das Zeugnis",en:"The school report",s:[
["Heute gab es in der Schule die Zeugnisse.","Today the school reports came out.",["g-past","g-plural"]],
["Mein Sohn Paul war vorher sehr nervös.","My son Paul was very nervous beforehand.",["g-past","g-poss"]],
["In Mathe hatte er im Winter eine schlechte Note.","In winter he had a bad mark in maths.",["g-past","g-adj"]],
["Seine Lehrerin ist streng, aber sie erklärt alles sehr gut.","His teacher is strict, but she explains everything very well.",["g-poss"]],
["Seitdem hat Paul jeden Tag mit seinem Heft am Küchentisch geübt.","Since then Paul has practised every day with his exercise book at the kitchen table.",["g-perf","g-dat"]],
["Er war wirklich fleißig und gar nicht faul.","He was really hard-working and not lazy at all.",["g-past","g-neg"]],
["In der schriftlichen Prüfung hat er eine Zwei bekommen.","In the written exam he got a two (a B).",["g-perf","g-adj"]],
["Sein Lieblingsfach ist aber Englisch.","His favourite subject is English, though.",["g-poss"]],
["Im Zeugnis steht, dass er gut im Team arbeitet.","The report says that he works well in a team.",["g-sub"]],
["Nächstes Jahr gibt es eine Klassenfahrt nach London.","Next year there's a school trip to London.",["g-v2"]],
["Paul möchte später das Abitur machen und an der Universität studieren.","Later Paul wants to do his Abitur and go to university.",["g-modal","g-dat"]],
["Heute Abend feiern wir sein gutes Zeugnis mit Pizza.","This evening we're celebrating his good report with pizza.",["g-adj","g-poss"]]],
q:[["In welchem Fach hatte Paul eine schlechte Note?",["in Mathe","in Englisch","in Sport"],0],["Was ist sein Lieblingsfach?",["Englisch", "Mathe", "Kunst"],0],["Wohin geht die Klassenfahrt?",["nach London","nach Paris","nach Berlin"],0]],r:["Warum hat Paul jetzt eine bessere Note?",["Er hat jeden Tag geübt.","Die Prüfung war sehr leicht.","Er hat eine neue Lehrerin."],0]},
{id:"a2-studium",level:"A2",title:"Studieren in Deutschland",en:"Studying in Germany",s:[
["Amira kommt aus Ägypten und studiert jetzt an der Universität in Leipzig.","Amira is from Egypt and now studies at the university in Leipzig.",["g-dat"]],
["Sie hat ein Stipendium bekommen, deshalb kann sie hier studieren.","She got a scholarship, so she can study here.",["g-perf","g-modal"]],
["Ihr Fach ist Biologie, und ihr Stundenplan ist sehr voll.","Her subject is biology, and her timetable is very full.",["g-poss"]],
["Am Anfang waren ihre Kenntnisse in Deutsch nicht so gut.","At first her German wasn't that good.",["g-past","g-neg","g-poss"]],
["In den Vorlesungen hat sie viele Notizen gemacht und zu Hause übersetzt.","In lectures she made lots of notes and translated them at home.",["g-perf","g-plural"]],
["Ein Wörterbuch hatte sie immer dabei.","She always had a dictionary with her.",["g-past"]],
["Manche Wörter konnte sie lesen, aber nicht aussprechen.","Some words she could read but not pronounce.",["g-past","g-modal","g-neg"]],
["Abends hat sie oft in der Bibliothek gelernt.","In the evenings she often studied in the library.",["g-perf","g-dat"]],
["Sie vergleicht gern ihre Heimat und Deutschland und sieht viele Unterschiede.","She likes to compare her home country with Germany, and she sees lots of differences.",["g-poss","g-plural"]],
["„Hier ist alles pünktlicher, aber das Essen ist bei uns besser“, sagt sie und lacht.","'Here everything is more punctual, but the food is better back home,' she says, laughing.",["g-adj"]],
["Nach einem Jahr hat sie ihre erste große Prüfung bestanden.","After a year she passed her first big exam.",["g-perf","g-adj"]],
["Sie sagt: „Es war schwierig, aber ich habe es geschafft.“","She says: 'It was hard, but I made it.'",["g-past","g-perf"]]],
q:[["Woher kommt Amira?",["aus Ägypten","aus Marokko","aus der Türkei"],0],["Was studiert sie?",["Biologie","Medizin","Englisch"],0],["Wo hat sie abends gelernt?",["in der Bibliothek", "in einem Café", "im Park"],0]],r:["Warum hatte sie immer ein Wörterbuch dabei?",["Ihr Deutsch war am Anfang nicht so gut.", "Sie wollte eine neue Sprache lernen.", "Die Universität wollte das so."],0]},
{id:"a2-besuch",level:"A2",title:"Besuch im Krankenhaus",en:"A visit to the hospital",s:[
["Mein Opa liegt seit einer Woche im Krankenhaus.","My grandpa has been in hospital for a week.",["g-dat"]],
["Er hatte starke Schmerzen im Rücken und im Magen.","He had bad pains in his back and his stomach.",["g-past","g-adj","g-dat"]],
["Gestern habe ich ihn besucht und ihm eine Rose mitgebracht.","Yesterday I visited him and brought him a rose.",["g-perf","g-dat","g-sep"]],
["Er war noch schwach, aber schon wach und gut gelaunt.","He was still weak, but already awake and in a good mood.",["g-past"]],
["Eine Krankenschwester hat gesagt, dass die Krankheit nicht gefährlich ist.","A nurse said that the illness isn't dangerous.",["g-perf","g-sub"]],
["Opa muss aber noch Tabletten nehmen und gut auf seinen Körper aufpassen.","But Grandpa still has to take tablets and look after his body carefully.",["g-modal","g-sep","g-plural"]],
["Im Zimmer neben ihm liegt ein Mann mit einer schweren Grippe, der die ganze Zeit hustet.","In the room next to him there's a man with bad flu who coughs all the time.",["g-sub","g-adj"]],
["Opa hat gesagt: „Schade, dass ich hier keinen Fernseher habe.“","Grandpa said: 'Shame I don't have a TV here.'",["g-perf","g-sub","g-neg"]],
["Deshalb habe ich ihm eine Zeitschrift und ein Rätsel gekauft.","So I bought him a magazine and a puzzle.",["g-perf","g-dat"]],
["Nächste Woche darf er hoffentlich nach Hause.","Hopefully he'll be allowed home next week.",["g-modal"]],
["Ich war ein bisschen traurig, als ich gegangen bin.","I was a little sad when I left.",["g-past","g-sub","g-perf"]]],
q:[["Wo ist der Opa?",["im Krankenhaus","in einem Hotel","bei seiner Tochter"],0],["Was hat die Person mitgebracht?",["eine Rose","einen Kuchen","ein Buch"],0],["Was hat die Krankenschwester gesagt?",["Die Krankheit ist nicht gefährlich.", "Opa darf schon heute nach Hause.", "Opa muss noch lange bleiben."],0]],r:["Warum hat die Person eine Zeitschrift gekauft?",["Opa langweilt sich ohne Fernseher.","Opa wollte die Nachrichten lesen.","Die Krankenschwester hat das gesagt."],0]},
{id:"a2-werkstatt",level:"A2",title:"Die Ausbildung in der Werkstatt",en:"Training at the garage",s:[
["Jonas macht eine Ausbildung als Mechaniker in einer Werkstatt.","Jonas is training as a mechanic at a garage.",["g-dat"]],
["Er ist Auszubildender im zweiten Jahr und lernt jeden Tag etwas Neues.","He's a second-year apprentice and learns something new every day.",["g-adj"]],
["Sein Arbeitstag beginnt schon um sieben Uhr.","His working day starts at seven o'clock.",["g-poss"]],
["Am meisten Spaß macht ihm die praktische Arbeit am Motor.","What he enjoys most is the hands-on work on the engine.",["g-dat","g-adj"]],
["Gestern kam eine Kundin, deren Auto nicht mehr gefahren ist.","Yesterday a customer came whose car had stopped working.",["g-past","g-sub","g-perf"]],
["Jonas hat den Fehler zusammen mit einer Kollegin gefunden.","Jonas found the fault together with a colleague.",["g-perf","g-dat"]],
["Die Kundin war sehr zufrieden und hat sich bedankt.","The customer was very happy and said thank you.",["g-past","g-perf"]],
["Manchmal ist die Arbeit stressig, besonders vor den Ferien.","Sometimes the work is stressful, especially before the holidays.",["g-dat","g-plural"]],
["Dann wollen alle Leute schnell ihr Auto reparieren lassen.","Then everyone wants their car repaired quickly.",["g-modal","g-plural"]],
["Sein Chef sagt, Jonas hat schon viel Erfahrung gesammelt.","His boss says Jonas has already gained a lot of experience.",["g-perf","g-poss"]],
["Nach der Ausbildung möchte Jonas als Angestellter in der Firma bleiben.","After his training Jonas would like to stay at the company as an employee.",["g-modal","g-dat"]]],
q:[["Was lernt Jonas?",["Mechaniker", "Koch", "Friseur"],0],["Wann beginnt sein Arbeitstag?",["um sieben Uhr", "um halb acht", "um neun Uhr"],0],["Wann ist die Arbeit besonders stressig?",["vor den Ferien", "am Wochenende", "im Winter"],0]],r:["Warum war die Kundin zufrieden?",["Ihr Auto fährt wieder.","Die Reparatur war kostenlos.","Jonas hat ihr ein Auto geliehen."],0]},
{id:"a2-wg",level:"A2",title:"Die neue WG",en:"The new flatshare",s:[
["Seit einem Monat wohne ich in einer WG mit zwei Studentinnen.","For a month I've been living in a flatshare with two students.",["g-dat"]],
["Die Wohnung liegt im Erdgeschoss, deshalb ist das Wohnzimmer etwas dunkel.","The flat is on the ground floor, so the living room is rather dark.",["g-dat","g-v2"]],
["Mein Schlafzimmer ist klein, aber das Fenster geht zum Garten.","My bedroom is small, but the window looks out onto the garden.",["g-poss"]],
["Am ersten Tag haben wir alle Zimmer zusammen geputzt.","On the first day we cleaned all the rooms together.",["g-perf","g-plural"]],
["Die Tür vom Bad war kaputt, und die Heizung war kalt.","The bathroom door was broken, and the heating was cold.",["g-past"]],
["Unsere Vermieterin hat beides schnell reparieren lassen.","Our landlady had both fixed quickly.",["g-perf","g-poss"]],
["In der Küche gibt es nur drei Stühle und zu wenig Geschirr.","In the kitchen there are only three chairs and not enough dishes.",["g-plural"]],
["Wir haben auf dem Flohmarkt Tassen und Teller gekauft.","We bought cups and plates at the flea market.",["g-perf","g-plural"]],
["Jede Woche macht eine andere Person den Haushalt.","Every week a different person does the housework.",["g-acc"]],
["Wer dran ist, muss auch die Handtücher waschen und Seife kaufen.","Whoever's turn it is also has to wash the towels and buy soap.",["g-sub","g-modal","g-plural"]],
["Bis jetzt klappt das sehr gut, und niemand ist sauer.","So far it's working very well, and nobody is annoyed.",["g-v2"]]],
q:[["Wo liegt die Wohnung?",["im Erdgeschoss","im dritten Stock","unter dem Dach"],0],["Was war am Anfang kaputt?",["die Tür vom Bad", "das Fenster", "der Herd"],0],["Wo haben sie Tassen und Teller gekauft?",["auf dem Flohmarkt", "in einem großen Kaufhaus", "im Internet"],0]],r:["Warum ist das Wohnzimmer dunkel?",["Die Wohnung liegt ganz unten.","Es gibt keine Lampe.","Die Fenster sind sehr schmutzig."],0]},
{id:"a2-kochkurs",level:"A2",title:"Der Kochkurs",en:"The cooking class",s:[
["Am Dienstag habe ich zum ersten Mal einen Kochkurs gemacht.","On Tuesday I took a cooking class for the first time.",["g-perf"]],
["Der Koch war ein netter Mann aus Italien.","The chef was a nice man from Italy.",["g-past","g-adj"]],
["Zuerst haben wir eine Suppe mit Bohnen und frischen Tomaten gekocht.","First we cooked a soup with beans and fresh tomatoes.",["g-perf","g-adj","g-plural"]],
["Dann haben wir Rindfleisch in einem großen Topf gebraten.","Then we fried beef in a big pot.",["g-perf","g-adj"]],
["Danach gab es Nudeln mit einer scharfen Soße.","After that there was pasta with a spicy sauce.",["g-past","g-adj","g-plural"]],
["Ich habe mich mit dem Messer in den Finger geschnitten, aber nicht schlimm.","I cut my finger with the knife, but not badly.",["g-perf","g-dat","g-neg"]],
["Zum Schluss haben wir eine Torte mit Schokolade und Zitrone gebacken.","Finally we baked a cake with chocolate and lemon.",["g-perf"]],
["Die Torte war süß und ein bisschen sauer, also perfekt.","The cake was sweet and a little sour, so perfect.",["g-past"]],
["Jeder hat eine kleine Portion probiert.","Everyone tried a small portion.",["g-perf","g-adj"]],
["Dazu gab es Mineralwasser oder eine Tasse Kaffee.","With it there was mineral water or a cup of coffee.",["g-past"]],
["Nächste Woche lernen wir, wie man Schweinefleisch richtig zubereitet.","Next week we're learning how to prepare pork properly.",["g-sub"]]],
q:[["Woher kommt der Koch?",["aus Italien","aus Spanien","aus Frankreich"],0],["Was ist beim Kochen passiert?",["Die Person hat sich geschnitten.", "Der Topf ist kaputt gegangen.", "Die Suppe war zu salzig."],0],["Wie hat die Torte geschmeckt?",["süß und ein bisschen sauer", "sehr scharf und ziemlich salzig", "zu trocken"],0]],r:["Wie hat der Person der Kurs wahrscheinlich gefallen?",["gut, sie kommt nächste Woche wieder", "schlecht, sie hat sich verletzt", "langweilig, sie kann schon kochen"],0]},
{id:"a2-flug",level:"A2",title:"Ein Flug mit Hindernissen",en:"A flight with obstacles",s:[
["Für die Ferien wollten wir auf eine Insel in Griechenland verreisen.","For the holidays we wanted to go to an island in Greece.",["g-past","g-modal"]],
["Ich habe die Koffer gepackt und alles gut eingepackt.","I packed the suitcases and wrapped everything carefully.",["g-perf","g-sep","g-plural"]],
["Am Flughafen haben wir gehört, dass unser Flug zwei Stunden später geht.","At the airport we heard that our flight was leaving two hours late.",["g-perf","g-sub"]],
["Wir haben gewartet, Kaffee getrunken und Postkarten geschrieben.","We waited, drank coffee and wrote postcards.",["g-perf","g-plural"]],
["Auf der Insel gab es keine Jugendherberge, nur kleine Hotels.","There was no youth hostel on the island, only small hotels.",["g-past","g-neg","g-plural"]],
["Unsere Unterkunft lag direkt am Meer.","Where we stayed was right by the sea.",["g-past","g-poss"]],
["Mit einem Schiff haben wir eine Tour zu einer anderen Insel gemacht.","We took a boat trip to another island.",["g-perf","g-adj"]],
["Die Landschaft war fantastisch: Berge, Strände und ein kleiner Fluss.","The landscape was fantastic: mountains, beaches and a little river.",["g-past","g-plural"]],
["Leider hatten wir keinen Stadtplan, deshalb haben wir uns einmal verlaufen.","Unfortunately we didn't have a map, so once we got lost.",["g-past","g-perf","g-neg"]],
["Busse fahren dort selten, und der Fahrplan ist nicht so genau.","Buses run rarely there, and the timetable isn't very reliable.",["g-plural","g-neg"]],
["Trotzdem möchten wir nächstes Jahr wieder dorthin fliegen.","Even so, we'd like to fly there again next year.",["g-modal"]]],
q:[["Wohin wollten sie verreisen?",["auf eine Insel", "in die Berge nach Österreich", "nach Berlin"],0],["Was haben sie am Flughafen gehört?",["Der Flug geht später.", "Der Flug fällt aus.", "Das Gepäck ist weg."],0],["Wo lag die Unterkunft?",["direkt am Meer","im Zentrum","neben dem Flughafen"],0]],r:["Warum haben sie sich einmal verlaufen?",["Sie hatten keinen Stadtplan.", "Der Bus ist nicht gekommen.", "Das Schiff war zu spät."],0]},
{id:"a2-ski",level:"A2",title:"Winterurlaub in den Bergen",en:"A winter holiday in the mountains",s:[
["Über Weihnachten waren wir zum Skifahren in den Bergen.","Over Christmas we went skiing in the mountains.",["g-past","g-dat","g-plural"]],
["In der ersten Nacht hat es stark geschneit.","On the first night it snowed heavily.",["g-perf"]],
["Am Morgen lag überall Schnee, und der Himmel war sonnig.","In the morning there was snow everywhere, and the sky was sunny.",["g-past"]],
["Ich habe dicke Stiefel, einen warmen Pullover und eine Mütze angezogen.","I put on thick boots, a warm jumper and a hat.",["g-perf","g-adj","g-sep"]],
["Meine Schwester ist sehr sportlich und fährt schon lange Ski.","My sister is very sporty and has been skiing for a long time.",["g-poss"]],
["Ich bin am ersten Tag oft gefallen, aber ich habe mich nicht verletzt.","I fell a lot on the first day, but I didn't hurt myself.",["g-perf","g-neg"]],
["Am dritten Tag war es neblig und windig, und wir sind im Hotel geblieben.","On the third day it was foggy and windy, and we stayed in the hotel.",["g-past","g-perf"]],
["Bei schlechtem Wetter ist Skifahren nämlich gefährlich.","In bad weather skiing is dangerous, you see.",["g-adj"]],
["Silvester haben wir mit anderen Gästen im Hotel gefeiert.","We celebrated New Year's Eve with other guests at the hotel.",["g-perf","g-dat"]],
["Um Mitternacht haben alle auf der Terrasse gestanden und gesungen.","At midnight everyone stood on the terrace and sang.",["g-perf"]],
["Es war kühl, aber sehr schön.","It was cold, but very beautiful.",["g-past"]]],
q:[["Wann waren sie in den Bergen?",["über Weihnachten", "in den Sommerferien", "zu Ostern"],0],["Wie war das Wetter am dritten Tag?",["neblig und windig","sonnig und warm","bewölkt und trocken"],0],["Wo haben sie Silvester gefeiert?",["im Hotel","in der Stadt","zu Hause"],0]],r:["Warum sind sie am dritten Tag im Hotel geblieben?",["Bei Nebel ist Skifahren gefährlich.", "Die Schwester war plötzlich krank.", "Das Hotel hatte ein großes Fest."],0]},
{id:"a2-museum",level:"A2",title:"Ein Abend im Museum",en:"An evening at the museum",s:[
["Einmal im Jahr ist das Kunstmuseum in unserer Stadt bis Mitternacht offen.","Once a year the art museum in our town stays open until midnight.",["g-dat"]],
["Der Eintritt ist an diesem Abend kostenlos, und das Programm ist sehr bunt.","Entry is free that evening, and the programme is very varied.",["g-dat"]],
["Dieses Jahr gab es eine Ausstellung über einen berühmten Künstler aus Berlin.","This year there was an exhibition about a famous artist from Berlin.",["g-past","g-adj"]],
["Er hat früher Poster für Konzerte gemalt und gezeichnet.","He used to paint and draw posters for concerts.",["g-perf","g-plural"]],
["Ich fand seine Bilder interessant, mein Freund fand sie langweilig.","I found his pictures interesting, my friend found them boring.",["g-past","g-poss"]],
["Im Keller des Museums haben Schauspieler ein kurzes Theaterstück gespielt.","In the museum's basement actors performed a short play.",["g-perf","g-adj"]],
["Es war ein spannender Krimi, und am Ende wusste niemand, wer der Täter war.","It was an exciting crime story, and at the end nobody knew who did it.",["g-past","g-sub"]],
["Danach haben Musiker im Garten gespielt.","Afterwards musicians played in the garden.",["g-perf","g-plural"]],
["So eine Veranstaltung ist gut für die Kultur in der Stadt, finde ich.","An event like that is good for culture in the town, I think.",["g-dat"]],
["Ich habe sogar ein Plakat von der Ausstellung gekauft.","I even bought a poster from the exhibition.",["g-perf"]],
["Es hängt jetzt in meinem Wohnzimmer.","It's hanging in my living room now.",["g-poss","g-dat"]]],
q:[["Wie lange ist das Museum an diesem Abend offen?",["bis Mitternacht", "bis acht Uhr", "bis zehn Uhr"],0],["Was hat der Künstler früher gemacht?",["Poster für Konzerte", "Kleider für Stars", "Bücher für Kinder"],0],["Wer hat im Keller gespielt?",["Schauspieler", "Musiker aus Berlin", "Kinder"],0]],r:["Wie hat dem Freund die Ausstellung gefallen?",["nicht so gut", "sehr gut", "fantastisch"],0]},
{id:"a2-klavier",level:"A2",title:"Klavierstunden",en:"Piano lessons",s:[
["Als Kind wollte ich unbedingt ein Instrument lernen.","As a child I really wanted to learn an instrument.",["g-past","g-modal","g-sub"]],
["Meine Eltern haben mir Klavierstunden geschenkt.","My parents gave me piano lessons as a present.",["g-perf","g-dat","g-plural"]],
["Meine Lehrerin war streng, aber sehr nett.","My teacher was strict, but very kind.",["g-past","g-poss"]],
["Ich musste jeden Tag mindestens eine halbe Stunde üben.","I had to practise for at least half an hour every day.",["g-past","g-modal"]],
["Das fand ich damals oft langweilig.","Back then I often found that boring.",["g-past"]],
["Mit zwölf habe ich an einem Wettbewerb für junge Musiker teilgenommen.","At twelve I took part in a competition for young musicians.",["g-perf","g-sep","g-dat"]],
["Vor dem Auftritt war ich so nervös, dass meine Hände kalt waren.","Before the performance I was so nervous that my hands were cold.",["g-past","g-sub"]],
["Am Ende habe ich den dritten Platz gewonnen.","In the end I won third place.",["g-perf","g-adj"]],
["Heute spiele ich nur noch zum Spaß, meistens am Wochenende.","Today I only play for fun, mostly at the weekend.",["g-v2"]],
["Manchmal singt meine Tochter dazu, und wir lachen viel.","Sometimes my daughter sings along, and we laugh a lot.",["g-poss"]],
["Sie sagt, sie will später Sängerin werden und im Radio singen.","She says she wants to become a singer and sing on the radio.",["g-modal"]]],
q:[["Was haben die Eltern geschenkt?",["Klavierstunden", "eine Gitarre", "ein Radio"],0],["Wie lange musste die Person jeden Tag üben?",["mindestens eine halbe Stunde", "mindestens zwei ganze Stunden", "zehn Minuten"],0],["Welchen Platz hat sie gewonnen?",["den dritten","den ersten","den zweiten"],0]],r:["Warum spielt die Person heute gern Klavier?",["Sie spielt nur noch zum Spaß.", "Sie muss jeden Tag üben.", "Sie will Preise gewinnen."],0]},
{id:"a2-flohmarkt",level:"A2",title:"Auf dem Flohmarkt",en:"At the flea market",s:[
["Jeden ersten Samstag im Monat gibt es bei uns einen Flohmarkt.","On the first Saturday of every month there's a flea market here.",["g-dat"]],
["Ich verkaufe dort alte Kleidung, die mir nicht mehr passt.","I sell old clothes there that don't fit me any more.",["g-sub","g-dat","g-neg"]],
["Diesmal hatte ich zwei Jeans, ein Hemd, eine Bluse und einen bunten Rock.","This time I had two pairs of jeans, a shirt, a blouse and a colourful skirt.",["g-past","g-adj"]],
["Eine Frau wollte den Rock für ihre Tochter, aber er war ihr zu teuer.","A woman wanted the skirt for her daughter, but it was too expensive for her.",["g-past","g-modal","g-dat"]],
["Wir haben ein bisschen über den Preis geredet, und am Ende waren wir einverstanden.","We talked a bit about the price, and in the end we agreed.",["g-perf","g-past"]],
["Ich selbst habe einen schönen Ring und eine Kette gekauft.","I bought a lovely ring and a necklace myself.",["g-perf","g-adj"]],
["Die Qualität war gut, obwohl sie sehr preiswert waren.","The quality was good, even though they were very cheap.",["g-past","g-sub"]],
["Mein Sohn hat sein Taschengeld für alte Comics ausgegeben.","My son spent his pocket money on old comics.",["g-perf","g-poss","g-sep"]],
["Er spart eigentlich für ein Fahrrad, aber Comics findet er wichtiger.","He's actually saving for a bike, but he thinks comics are more important.",["g-adj"]],
["Ein lila T-Shirt war so hässlich, dass es niemand wollte.","One purple T-shirt was so ugly that nobody wanted it.",["g-past","g-sub","g-modal"]],
["Am Abend war meine Geldbörse voller als am Morgen.","In the evening my purse was fuller than in the morning.",["g-past","g-poss","g-adj"]]],
q:[["Wann gibt es den Flohmarkt?",["jeden ersten Samstag im Monat", "jeden Sonntag im Sommer und Herbst", "einmal im Jahr"],0],["Was hat die Person selbst gekauft?",["einen Ring und eine Kette","einen Rock und eine Bluse","ein Fahrrad"],0],["Wofür hat der Sohn sein Taschengeld ausgegeben?",["für alte Comics","für ein Fahrrad","für ein T-Shirt"],0]],r:["Hat die Person auf dem Flohmarkt mehr verkauft als gekauft?",["Ja, sie hatte am Abend mehr Geld.", "Nein, sie hat nur gekauft.", "Nein, niemand hat etwas gekauft."],0]},
{id:"a2-online",level:"A2",title:"Mein Leben online",en:"My life online",s:[
["Meine Freundin Nina schreibt einen Blog über Reisen.","My friend Nina writes a blog about travelling.",["g-poss"]],
["Auf ihrer Homepage gibt es Fotos, Tipps und kurze Artikel.","On her homepage there are photos, tips and short articles.",["g-poss","g-plural"]],
["Ihre Fotos macht sie mit einer alten Kamera, nicht mit dem Mobiltelefon.","She takes her photos with an old camera, not with her mobile.",["g-adj","g-neg"]],
["Sie sagt, mit einem richtigen Fotoapparat fotografiert sie lieber.","She says she prefers taking pictures with a proper camera.",["g-adj"]],
["Letzte Woche hat eine Zeitschrift ein Interview mit ihr gemacht.","Last week a magazine did an interview with her.",["g-perf","g-dat"]],
["Den Link zum Artikel hat sie mir sofort geschickt.","She sent me the link to the article straight away.",["g-perf","g-dat"]],
["Ich lese sonst lieber E-Books, aber ihre Webseite finde ich toll.","I'd usually rather read e-books, but I think her website is great.",["g-poss","g-plural"]],
["Abends chatten wir oft, oder wir surfen zusammen im Internet.","In the evenings we often chat, or we surf the internet together.",["g-dat"]],
["Manchmal sehen wir auch eine Sendung online an.","Sometimes we watch a programme online too.",["g-sep"]],
["Nina speichert alle Dateien auf einem extra Gerät, damit nichts verloren geht.","Nina saves all her files on a separate device so that nothing gets lost.",["g-sub","g-plural"]],
["Sie sagt: „Ohne Internet wäre mein Leben langweilig.“","She says: 'Without the internet my life would be boring.'",["g-poss"]]],
q:[["Worüber schreibt Nina?",["über Reisen", "über Mode und Kosmetik", "über Essen"],0],["Womit macht sie ihre Fotos?",["mit einer alten Kamera", "mit ihrem neuen Mobiltelefon", "mit einem Tablet"],0],["Wer hat ein Interview mit ihr gemacht?",["eine Zeitschrift", "ein Radiosender", "eine Schule"],0]],r:["Warum speichert Nina ihre Dateien extra?",["Sie will nichts verlieren.","Ihr Laptop ist zu langsam.","Sie will sie verkaufen."],0]},
{id:"a2-familienfest",level:"A2",title:"Das große Familienfest",en:"The big family party",s:[
["Zum siebzigsten Geburtstag meiner Oma kam die ganze Familie.","The whole family came for my grandma's seventieth birthday.",["g-past","g-adj","g-poss"]],
["Meine Tante und mein Onkel sind extra aus der Schweiz gekommen.","My aunt and uncle came all the way from Switzerland.",["g-perf","g-poss"]],
["Ich habe meinen Cousin und meine Cousine seit Jahren nicht gesehen.","I hadn't seen my cousins for years.",["g-perf","g-poss","g-neg"]],
["Opa ist Rentner und hat für alle gekocht.","Grandpa is retired and cooked for everyone.",["g-perf"]],
["Meine Eltern sind seit zwei Jahren geschieden, aber beide waren da.","My parents have been divorced for two years, but both of them were there.",["g-dat","g-past","g-plural"]],
["Mama hat ihren neuen Ehepartner mitgebracht, und Papa war ganz freundlich.","Mum brought her new husband, and Dad was very friendly.",["g-perf","g-sep","g-poss"]],
["Nach dem Essen hat Oma alte Geschichten erzählt.","After the meal Grandma told old stories.",["g-perf","g-dat","g-plural"]],
["Sie hat sich an ihre Hochzeit erinnert, die damals sehr klein war.","She remembered her wedding, which was very small back then.",["g-perf","g-sub"]],
["Die Enkel haben für sie ein Lied gesungen.","The grandchildren sang a song for her.",["g-perf","g-plural"]],
["Meine kleine Enkelin, hat Oma gesagt, ist die beste Sängerin der Welt.","My little granddaughter, Grandma said, is the best singer in the world.",["g-perf","g-adj"]],
["Es war ein langer, schöner Tag für die ganze Familie.","It was a long, lovely day for the whole family.",["g-past","g-adj"]]],
q:[["Woher sind Tante und Onkel gekommen?",["aus der Schweiz", "aus Österreich", "aus dem Süden von Italien"],0],["Wer hat für alle gekocht?",["der Opa","die Mama","die Tante"],0],["Was hat Oma nach dem Essen gemacht?",["alte Geschichten erzählt", "ein Lied für alle gesungen", "Kuchen gebacken"],0]],r:["Wie war die Stimmung zwischen Mama und Papa?",["freundlich, trotz der Scheidung","sehr schlecht, sie haben gestritten","komisch, Papa ist früh gegangen"],0]},
{id:"a2-schule",level:"A2",title:"Ein Tag in der zehnten Klasse",en:"A day in year ten",s:[
["Meine Tochter Lara ist Schülerin in der zehnten Klasse.","My daughter Lara is a pupil in year ten.",["g-poss","g-dat"]],
["Ihr Stundenplan ist voll: Mathe, Biologie, Chemie, Physik, Englisch und Französisch.","Her timetable is packed: maths, biology, chemistry, physics, English and French.",["g-poss"]],
["Ihr Lieblingsfach ist Chemie, weil die Lehrerin die Tafel so schön bunt bemalt.","Her favourite subject is chemistry, because the teacher draws on the board so colourfully.",["g-sub","g-poss"]],
["Mathe findet sie schwierig, aber sie ist sehr fleißig.","She finds maths hard, but she works very hard.",["g-v2"]],
["Am Sonntag hat sie sich auf eine schriftliche Prüfung vorbereitet.","On Sunday she prepared for a written exam.",["g-perf","g-adj","g-sep"]],
["Sie hat Notizen gemacht und alles in ihrem Kalender eingetragen.","She made notes and entered everything in her calendar.",["g-perf","g-sep","g-poss"]],
["Mit einem Wörterbuch hat sie Französisch übersetzt.","She translated French with a dictionary.",["g-perf","g-dat"]],
["Am Abend war sie müde und hat gesagt: „Ich bin doch nicht dumm, aber das ist zu viel!“","In the evening she was tired and said: 'I'm not stupid, but this is too much!'",["g-past","g-perf","g-neg"]],
["Ich habe gesagt: „Du bist klug, du schaffst das.“","I said: 'You're clever, you'll manage.'",["g-perf"]],
["Die Note war am Ende eine Zwei.","In the end the mark was a two (a B).",["g-past"]],
["Nach dem Abitur möchte Lara vielleicht Chemie studieren.","After her Abitur Lara might like to study chemistry.",["g-modal","g-dat"]]],
q:[["In welcher Klasse ist Lara?",["in der zehnten","in der achten","in der zwölften"],0],["Welches Fach findet sie schwierig?",["Mathe","Chemie","Englisch"],0],["Welche Note hat sie bekommen?",["eine Zwei","eine Eins","eine Vier"],0]],r:["Warum war Lara am Sonntagabend müde?",["Sie hat viel für die Prüfung gelernt.", "Sie war den ganzen Tag beim Sport.", "Sie hat in der Nacht schlecht geschlafen."],0]},
{id:"a2-verein",level:"A2",title:"Im Sportverein",en:"At the sports club",s:[
["Mein Sohn spielt seit drei Jahren in einer Basketball-Mannschaft.","My son has been playing in a basketball team for three years.",["g-dat"]],
["Das Training ist zweimal pro Woche auf dem Sportplatz hinter der Schule.","Training is twice a week at the sports ground behind the school.",["g-dat"]],
["Der Trainer sagt, man muss fit sein und regelmäßig trainieren.","The coach says you have to be fit and train regularly.",["g-modal"]],
["Am Wochenende hat die Mannschaft an einem Turnier teilgenommen.","At the weekend the team took part in a tournament.",["g-perf","g-sep","g-dat"]],
["Im ersten Spiel haben sie leider verloren.","Unfortunately they lost the first game.",["g-perf","g-adj"]],
["Aber dann haben sie zweimal gewonnen und viele Punkte gemacht.","But then they won twice and scored lots of points.",["g-perf","g-plural"]],
["Ihr Ziel war der dritte Platz, und den haben sie erreicht.","Their goal was third place, and they achieved it.",["g-past","g-perf","g-poss"]],
["Meine Tochter spielt lieber Tennis oder Volleyball.","My daughter prefers to play tennis or volleyball.",["g-poss"]],
["Sie sagt, ein großer Ball ist ihr zu langweilig.","She says a big ball is too boring for her.",["g-dat","g-adj"]],
["Im Club gibt es nach dem Spiel immer etwas zu essen.","At the club there's always something to eat after the match.",["g-dat"]],
["Sport ist bei uns in der Familie sehr wichtig.","Sport is very important in our family.",["g-dat"]]],
q:[["Welchen Sport macht der Sohn?",["Basketball", "Fußball", "Tischtennis"],0],["Wo ist das Training?",["auf dem Sportplatz hinter der Schule", "in einer großen Halle im Zentrum", "im Park neben dem Fluss"],0],["Was war das Ziel der Mannschaft?",["der dritte Platz", "der erste Platz im Turnier", "nur Spaß"],0]],r:["War der Sohn mit dem Turnier zufrieden?",["Ja, sie haben ihr Ziel erreicht.","Nein, sie haben alle Spiele verloren.","Nein, er durfte nicht spielen."],0]},
{id:"a2-paket",level:"A2",title:"Das Paket kommt nicht",en:"The parcel isn't coming",s:[
["Ich habe online eine Kaffeemaschine bestellt.","I ordered a coffee machine online.",["g-perf"]],
["Die Firma hat mir bestätigt, dass sie das Paket am Dienstag liefert.","The company confirmed that they'd deliver the parcel on Tuesday.",["g-perf","g-sub","g-dat"]],
["Ich habe mir extra frei genommen und den ganzen Tag gewartet.","I took the day off specially and waited all day.",["g-perf","g-adj"]],
["Am Abend war kein Paket da, aber ein Zettel im Briefkasten.","In the evening there was no parcel, but a note in the letterbox.",["g-past","g-neg"]],
["Der Mann hatte geklingelt, als ich kurz im Keller war.","The man had rung the bell while I was in the cellar for a moment.",["g-past","g-perf","g-sub"]],
["Ich habe sofort beim Service angerufen und mich beschwert.","I called the customer service right away and complained.",["g-perf","g-sep"]],
["Die Frau am Telefon war sehr freundlich.","The woman on the phone was very friendly.",["g-past"]],
["Sie hat gesagt, dass ich einen neuen Termin vereinbaren kann.","She said I could arrange a new delivery date.",["g-perf","g-sub","g-modal"]],
["Wir haben den Termin auf Freitag verschoben.","We moved the date to Friday.",["g-perf"]],
["Am Freitag kam das Paket endlich, aber die Kaffeemaschine war kaputt.","On Friday the parcel finally came, but the coffee machine was broken.",["g-past"]],
["Jetzt muss ich wieder anrufen, so ein Ärger!","Now I have to call again, what a nuisance!",["g-modal","g-sep"]]],
q:[["Was hat die Person bestellt?",["eine Kaffeemaschine", "einen neuen Laptop", "einen Kühlschrank"],0],["Was war am Abend im Briefkasten?",["ein Zettel","das Paket","eine Rechnung"],0],["Auf welchen Tag haben sie den Termin verschoben?",["auf Freitag","auf Montag","auf Mittwoch"],0]],r:["Warum hat sie den Mann am Dienstag nicht gehört?",["Sie war kurz im Keller.","Sie hat geschlafen.","Sie war beim Einkaufen."],0]},
{id:"a2-babysitter",level:"A2",title:"Ein Tag als Babysitter",en:"A day as a babysitter",s:[
["Am Samstag war ich Babysitter für die Kinder meiner Nachbarin.","On Saturday I babysat my neighbour's children.",["g-past","g-poss","g-plural"]],
["Um acht Uhr musste ich sie wecken, weil wir in den Zoo wollten.","At eight I had to wake them because we wanted to go to the zoo.",["g-past","g-modal","g-sub"]],
["Mia, die Kleine, wollte zuerst die Pferde und die Schweine sehen.","Mia, the little one, wanted to see the horses and the pigs first.",["g-past","g-modal","g-plural"]],
["Ihr Bruder Max fand die Vögel und die Affen besser.","Her brother Max liked the birds and the monkeys better.",["g-past","g-plural"]],
["Mittags haben wir ein Eis gegessen, und Max hatte Schokolade im ganzen Gesicht.","At lunchtime we had ice cream, and Max had chocolate all over his face.",["g-perf","g-past"]],
["Am Nachmittag haben wir zu Hause gebastelt und gemalt.","In the afternoon we did crafts and painting at home.",["g-perf"]],
["Dann wollten die Kinder nur noch Süßigkeiten und Comics.","Then the children only wanted sweets and comics.",["g-past","g-modal","g-plural"]],
["Ich habe ihnen ein Rätsel und ein kleines Quiz gemacht.","I made them a puzzle and a little quiz.",["g-perf","g-dat","g-adj"]],
["Abends mussten sie sich die Zähne putzen und ins Bett gehen.","In the evening they had to brush their teeth and go to bed.",["g-past","g-modal","g-plural"]],
["Mia hat gesagt, dass ich der beste Babysitter der Welt bin.","Mia said that I'm the best babysitter in the world.",["g-perf","g-sub","g-adj"]],
["Ich war danach furchtbar müde, aber sehr glücklich.","Afterwards I was terribly tired, but very happy.",["g-past"]]],
q:[["Wohin sind sie am Morgen gegangen?",["in den Zoo","in den Zirkus","ins Kino"],0],["Was wollte Mia zuerst sehen?",["die Pferde und die Schweine", "die Vögel und die Affen", "die großen Löwen im Zoo"],0],["Was hatte Max im Gesicht?",["Schokolade", "rote Farbe", "Ketchup"],0]],r:["Wie war der Tag für den Babysitter?",["anstrengend, aber schön","langweilig und ruhig","schrecklich und stressig"],0]},
{id:"a2-woche",level:"A2",title:"Eine volle Woche",en:"A busy week",s:[
["Diese Woche ist mein Kalender ganz voll.","This week my calendar is completely full.",["g-poss"]],
["Am Montag nehme ich an einem Workshop über Online-Marketing teil.","On Monday I'm taking part in a workshop on online marketing.",["g-sep","g-dat"]],
["Am Dienstag muss ich mit meiner Chefin die Messe in Frankfurt planen.","On Tuesday I have to plan the trade fair in Frankfurt with my boss.",["g-modal","g-dat"]],
["Wir wollen dort ein neues Produkt zeigen und Kunden beraten.","We want to present a new product there and advise customers.",["g-modal","g-adj"]],
["Mittwochs gehe ich immer schwimmen, das ist mir wichtig.","On Wednesdays I always go swimming, that's important to me.",["g-dat"]],
["Am Donnerstag bin ich mit einer Freundin zum Essen verabredet.","On Thursday I'm meeting a friend for dinner.",["g-dat"]],
["Morgens arbeite ich, abends organisiere ich unseren Umzug.","In the mornings I work, in the evenings I organise our move.",["g-poss","g-v2"]],
["Ich muss täglich mindestens zehn E-Mails beantworten.","I have to answer at least ten emails every day.",["g-modal","g-plural"]],
["Vorgestern habe ich fast meinen Termin beim Zahnarzt vergessen.","The day before yesterday I almost forgot my dentist's appointment.",["g-perf","g-poss"]],
["Übermorgen fahre ich zur Messe, und am Wochenende ruhe ich mich wenigstens aus.","The day after tomorrow I'm going to the fair, and at least I'll rest at the weekend.",["g-sep","g-v2"]],
["Die Situation ist stressig, aber nächste Woche wird es besser.","Things are stressful, but next week it'll get better.",["g-adj"]]],
q:[["Was macht die Person am Montag?",["einen Workshop","einen Arzttermin","einen Umzug"],0],["Was macht sie mittwochs?",["Sie geht schwimmen.","Sie geht essen.","Sie fährt zur Messe."],0],["Was hat sie vorgestern fast vergessen?",["den Termin beim Zahnarzt", "die vielen E-Mails von der Chefin", "die Messe"],0]],r:["Warum freut sich die Person auf das Wochenende?",["Sie kann sich endlich ausruhen.", "Sie fährt mit Freunden in den Urlaub.", "Sie hat Geburtstag."],0]},
{id:"a2-weihnachten",level:"A2",title:"Weihnachten bei uns",en:"Christmas at our place",s:[
["Weihnachten ist bei uns das wichtigste Fest im Jahr.","Christmas is the most important celebration of the year for us.",["g-adj"]],
["Am vierundzwanzigsten Dezember kommt die ganze Familie zu Besuch.","On the twenty-fourth of December the whole family comes to visit.",["g-dat","g-adj"]],
["Mein Onkel und meine Tante bringen immer Süßigkeiten für die Kinder mit.","My uncle and aunt always bring sweets for the children.",["g-sep","g-poss","g-plural"]],
["Mein Cousin und meine Cousine sind schon erwachsen, aber sie kommen gern.","My cousins are grown up now, but they like coming.",["g-poss"]],
["Meine Eltern sind seit Jahren getrennt, deshalb feiern wir zweimal.","My parents have been separated for years, so we celebrate twice.",["g-dat","g-v2"]],
["Am Abend sind wir bei Mama, am nächsten Tag bei Papa.","In the evening we're at Mum's, the next day at Dad's.",["g-dat"]],
["Papa ist Rentner und hat viel Zeit zum Kochen.","Dad is retired and has lots of time to cook.",["g-v2"]],
["Er macht jedes Jahr ein typisches Gericht aus seiner Heimat.","Every year he makes a typical dish from his home country.",["g-adj","g-dat"]],
["Meine Mutter schenkt mir meistens Parfüm oder Kosmetik.","My mother usually gives me perfume or cosmetics.",["g-dat","g-poss"]],
["Dieses Jahr habe ich ihr eine Creme für die Hände geschenkt.","This year I gave her a hand cream.",["g-perf","g-dat"]],
["An Silvester und Neujahr bin ich dann zu Hause und ruhe mich aus.","At New Year I'm at home and have a rest.",["g-sep"]]],
q:[["Wer bringt Süßigkeiten mit?",["Onkel und Tante","Mama und Papa","die Großeltern"],0],["Warum feiern sie zweimal?",["Die Eltern sind getrennt.","Die Wohnung ist zu klein.","Die Familie ist sehr groß."],0],["Was hat die Person der Mutter geschenkt?",["eine Creme","ein Parfüm","ein Buch"],0]],r:["Was macht die Person wahrscheinlich gern an Neujahr?",["sich ausruhen","eine große Party","zur Arbeit gehen"],0]},
{id:"a2-baby",level:"A2",title:"Das Baby kommt",en:"The baby is coming",s:[
["Meine Schwester ist schwanger, das Baby kommt im März.","My sister is pregnant, the baby is due in March.",["g-poss","g-dat"]],
["Sie und ihr Ehepartner haben das allen beim Familienfest erzählt.","She and her husband told everyone at the family party.",["g-perf","g-dat","g-poss"]],
["Meine Oma hat vor Freude geweint.","My grandma cried with joy.",["g-perf","g-dat"]],
["Sie wird zum ersten Mal Uroma, das findet sie fantastisch.","She'll be a great-grandmother for the first time, and she thinks that's fantastic.",["g-adj"]],
["Jetzt bereiten alle alles vor: ein Zimmer, ein Bett und viele kleine Dinge.","Now everyone is getting everything ready: a room, a bed and lots of little things.",["g-sep","g-plural","g-adj"]],
["Mein Onkel baut ein Bett aus Holz.","My uncle is building a wooden bed.",["g-poss"]],
["Ich habe einige Kleider in Rosa und Blau gekauft.","I bought some baby clothes in pink and blue.",["g-perf","g-plural"]],
["Den Namen will meine Schwester noch niemandem sagen.","My sister doesn't want to tell anyone the name yet.",["g-modal","g-dat","g-neg"]],
["Ich rate jeden Tag, aber sie lacht nur.","I guess every day, but she just laughs.",["g-v2"]],
["Auf jeden Fall wird das Baby viel Liebe bekommen.","One thing's for sure: the baby will get lots of love.",["g-v2"]],
["Ich freue mich darauf, endlich Tante zu sein.","I'm looking forward to finally being an aunt.",["g-sub"]]],
q:[["Wann kommt das Baby?",["im März","im Mai","im Dezember"],0],["Was baut der Onkel?",["ein Bett aus Holz","einen Tisch","ein Haus für den Garten"],0],["Was will die Schwester noch nicht sagen?",["den Namen","das Datum","den Ort"],0]],r:["Wie fühlt sich die Person?",["Sie freut sich sehr.","Sie ist ein bisschen traurig.","Es ist ihr ziemlich egal."],0]},
{id:"a2-karneval",level:"A2",title:"Karneval in Köln",en:"Carnival in Cologne",s:[
["Im Februar ist in Köln Karneval, und die ganze Stadt feiert.","In February it's carnival in Cologne, and the whole city celebrates.",["g-dat"]],
["Für viele Kölner ist es fast wie ein Feiertag.","For many people in Cologne it's almost like a public holiday.",["g-plural"]],
["Ich war mit meinem Freund Tom dort, wir waren als Paar verkleidet.","I went with my boyfriend Tom, and we dressed up as a couple.",["g-past","g-dat"]],
["Er hatte eine blonde Perücke, und ich hatte eine rosa Brille.","He had a blond wig, and I had pink glasses.",["g-past","g-adj"]],
["Morgens waren die Straßen schon voll, und abends war überall Musik.","In the morning the streets were already full, and in the evening there was music everywhere.",["g-past","g-plural"]],
["Im Zug haben wir eine witzige Gruppe aus der Schweiz kennengelernt.","On the train we met a funny group from Switzerland.",["g-perf","g-adj","g-sep"]],
["Sie haben Witze erzählt, die niemand verstanden hat.","They told jokes that nobody understood.",["g-perf","g-sub","g-plural"]],
["Am Nachmittag haben wir den großen Umzug angesehen.","In the afternoon we watched the big parade.",["g-perf","g-sep","g-adj"]],
["Die Leute haben Süßigkeiten geworfen, und Kinder haben sie gesammelt.","People threw sweets, and children collected them.",["g-perf","g-plural"]],
["Leider hat Tom sein Handy verloren.","Unfortunately Tom lost his phone.",["g-perf","g-poss"]],
["Am nächsten Tag haben wir es bei den Fundsachen gefunden, so ein Glück!","The next day we found it at the lost property office, what luck!",["g-perf","g-dat","g-plural"]]],
q:[["Wann ist Karneval in Köln?",["im Februar","im Juni","im Oktober"],0],["Was hatte die Person auf?",["eine rosa Brille","eine blaue Mütze","einen großen Hut"],0],["Wo haben sie das Handy gefunden?",["bei den Fundsachen","im Zug","auf der Straße"],0]],r:["Warum haben die Leute die Witze nicht verstanden?",["Die Gruppe kam aus einem anderen Land.","Die Musik war zu leise.","Die Witze waren auf Englisch."],0]},
{id:"a2-strasse",level:"A2",title:"Berufe in unserer Straße",en:"Jobs on our street",s:[
["In unserer Straße arbeiten viele Leute mit ganz verschiedenen Berufen.","On our street lots of people work in very different jobs.",["g-dat","g-adj","g-plural"]],
["Der Bäcker an der Ecke steht schon um drei Uhr morgens auf.","The baker on the corner gets up at three in the morning.",["g-sep","g-dat"]],
["Daneben ist ein Friseur, der auch Kosmetik verkauft.","Next door there's a hairdresser who also sells cosmetics.",["g-sub"]],
["Gegenüber wohnt ein Polizist, der nachts oft unterwegs ist.","Opposite lives a police officer who's often out at night.",["g-sub"]],
["Frau Berg ist Krankenschwester, ihr Mann ist Krankenpfleger im selben Krankenhaus.","Mrs Berg is a nurse, and her husband is a nurse at the same hospital.",["g-poss","g-dat"]],
["Im Haus Nummer zehn wohnt ein Journalist, der für eine Zeitung schreibt.","At number ten lives a journalist who writes for a newspaper.",["g-sub","g-dat"]],
["Herr Kaya ist Handwerker und repariert alles, was kaputt ist.","Mr Kaya is a tradesman and repairs everything that's broken.",["g-sub"]],
["Sein Sohn ist Auszubildender bei einem Techniker.","His son is an apprentice with a technician.",["g-poss","g-dat"]],
["Meine Nachbarin ist Kauffrau und arbeitet als Angestellte in einer Bank.","My neighbour is a businesswoman and works as an employee at a bank.",["g-poss","g-dat"]],
["Und ich? Ich bin Autor und schreibe Krimis.","And me? I'm an author and I write crime novels.",["g-plural"]],
["Für meine Bücher sind meine Nachbarn sehr nützlich!","My neighbours are very useful for my books!",["g-poss","g-plural"]]],
q:[["Wann steht der Bäcker auf?",["um drei Uhr morgens","um sechs Uhr morgens","um zwölf Uhr nachts"],0],["Wer ist oft nachts unterwegs?",["der Polizist","der Journalist","der Handwerker"],0],["Was schreibt die Person?",["Krimis","Kinderbücher","Kochbücher"],0]],r:["Warum sind die Nachbarn für den Autor nützlich?",["Er nimmt Ideen von ihnen für seine Bücher.","Sie kaufen alle seine Bücher.","Sie helfen ihm beim Schreiben."],0]},
{id:"a2-journalistin",level:"A2",title:"Ein Interview für die Zeitung",en:"An interview for the newspaper",s:[
["Eine Journalistin hat mich angerufen, weil sie über unseren Verein berichten will.","A journalist called me because she wants to report on our club.",["g-perf","g-sub","g-modal"]],
["Wir haben einen Termin vereinbart, und sie ist am Mittwoch gekommen.","We arranged an appointment, and she came on Wednesday.",["g-perf"]],
["Im Interview hat sie viele Fragen gestellt und alles notiert.","In the interview she asked lots of questions and noted everything down.",["g-perf","g-plural"]],
["Ich sollte beschreiben, was der Verein macht und warum er wichtig ist.","I had to describe what the club does and why it's important.",["g-past","g-modal","g-sub"]],
["Meine Antworten musste ich gut begründen.","I had to give good reasons for my answers.",["g-past","g-modal","g-poss"]],
["Am Ende hat sie gesagt, dass sie mir noch Bescheid gibt.","At the end she said she'd let me know.",["g-perf","g-sub","g-dat"]],
["Eine Woche später kam der Artikel mit einem großen Titel.","A week later the article came out with a big headline.",["g-past","g-adj"]],
["Auf der ersten Seite war sogar ein Foto von uns.","There was even a photo of us on the front page.",["g-past","g-adj"]],
["Viele Leute haben danach Interesse an unserem Verein gezeigt.","Afterwards lots of people showed interest in our club.",["g-perf","g-dat"]],
["Einige wollen jetzt freiwillig bei uns mitmachen.","Some now want to volunteer with us.",["g-modal","g-sep"]],
["Das war für uns die beste Werbung, und sie war kostenlos.","That was the best advertising for us, and it was free.",["g-past","g-adj"]]],
q:[["Warum hat die Journalistin angerufen?",["Sie will über den Verein berichten.","Sie will dem Verein beitreten.","Sie sucht eine neue Wohnung."],0],["Wo war das Foto?",["auf der ersten Seite","auf der letzten Seite","im Internet"],0],["Was wollen einige Leute jetzt?",["freiwillig mitmachen","Geld bekommen","eine Zeitung gründen"],0]],r:["Warum war der Artikel gut für den Verein?",["Mehr Leute kennen ihn jetzt.","Der Verein hat Geld bekommen.","Die Journalistin ist jetzt Mitglied."],0]},
{id:"a2-besprechung",level:"A2",title:"Die Besprechung",en:"The meeting",s:[
["Am Montag hatten wir im Büro eine wichtige Besprechung.","On Monday we had an important meeting at the office.",["g-past","g-adj"]],
["Es ging um ein neues Produkt, das wir auf der Messe zeigen wollen.","It was about a new product that we want to show at the trade fair.",["g-past","g-sub","g-modal"]],
["Unsere Chefin hat gesagt, dass es dringend ist.","Our boss said that it's urgent.",["g-perf","g-sub","g-poss"]],
["Jeder sollte einen Vorschlag machen.","Everyone was supposed to make a suggestion.",["g-past","g-modal"]],
["Wir haben lange diskutiert, aber es gab viele verschiedene Meinungen.","We discussed it for a long time, but there were lots of different opinions.",["g-perf","g-past","g-plural"]],
["Ein Kollege wollte einen Kredit von der Bank, um mehr Werbung zu machen.","One colleague wanted a loan from the bank to do more advertising.",["g-past","g-modal","g-dat"]],
["Eine Kollegin fand das Gegenteil richtig: lieber sparen!","A colleague thought the opposite was right: better to save!",["g-past"]],
["Am Ende musste die Chefin die Besprechung beenden, weil sie einen anderen Termin hatte.","In the end the boss had to end the meeting because she had another appointment.",["g-past","g-modal","g-sub"]],
["Private Gespräche sind in diesen Besprechungen nicht erlaubt.","Private conversations aren't allowed in these meetings.",["g-adj","g-plural","g-neg"]],
["Trotzdem haben zwei Kollegen über ihr Wochenende geredet.","Still, two colleagues talked about their weekend.",["g-perf","g-poss"]],
["Nächste Woche reden wir weiter, hoffentlich mit einem Ergebnis.","Next week we'll carry on talking, hopefully with a result.",["g-v2"]]],
q:[["Worum ging es in der Besprechung?",["um ein neues Produkt","um einen neuen Chef","um eine Reise"],0],["Was wollte ein Kollege?",["einen Kredit von der Bank","mehr Urlaub","ein neues Büro"],0],["Warum hat die Chefin die Besprechung beendet?",["Sie hatte noch einen Termin.","Alle waren sehr müde.","Es gab ein Ergebnis."],0]],r:["Waren alle in der Besprechung einer Meinung?",["Nein, es gab verschiedene Meinungen.","Ja, alle wollten sparen.","Ja, alle wollten einen Kredit."],0]},
{id:"a2-pechtag",level:"A2",title:"Ein Tag voller Pech",en:"A day full of bad luck",s:[
["Heute Morgen hat mich niemand geweckt, weil mein Wecker kaputt war.","This morning nobody woke me up because my alarm clock was broken.",["g-perf","g-sub"]],
["Ich musste mich sehr beeilen und hatte keine Zeit für das Frühstück.","I had to hurry a lot and had no time for breakfast.",["g-modal","g-past"]],
["Meinen Schlüssel konnte ich nirgends finden.","I couldn't find my key anywhere.",["g-modal","g-poss"]],
["Zum Glück hatte meine Mitbewohnerin die Tür nicht abgeschlossen.","Luckily my flatmate hadn't locked the door.",["g-neg","g-past","g-poss"]],
["Draußen hat es stark geregnet, und mein Schirm war kaputt.","Outside it was raining hard, and my umbrella was broken.",["g-perf","g-poss"]],
["An der Kreuzung gab es einen schrecklichen Unfall.","There was a terrible accident at the crossroads.",["g-adj","g-dat"]],
["Zum Glück ist niemandem etwas passiert, aber der Verkehr stand eine Stunde lang still.","Luckily nobody was hurt, but the traffic didn't move for an hour.",["g-perf","g-dat"]],
["Im Büro hat mein Chef geschimpft, weil ich zu spät war.","At the office my boss told me off because I was late.",["g-perf","g-sub"]],
["„Es tut mir leid“, habe ich gesagt, „das passiert nicht wieder.“","'I'm sorry,' I said, 'it won't happen again.'",["g-dat","g-perf"]],
["Am Abend wollte jemand aus dem Büro mit mir ausgehen.","In the evening someone from the office wanted to go out with me.",["g-modal","g-sep","g-dat"]],
["Ich habe gelacht und gesagt: „Heute auf keinen Fall!“","I laughed and said: 'Not today, no way!'",["g-perf","g-neg"]],
["Ich wollte nur nach Hause, die Tür aufmachen und ins Bett gehen.","I just wanted to go home, open the door and go to bed.",["g-modal","g-sep"]],
["Schade, dass der Tag so furchtbar war, aber morgen wird es sicher besser.","Shame the day was so awful, but tomorrow will surely be better.",["g-sub","g-adj"]]],
q:[["Warum hat die Person verschlafen?",["Der Wecker war kaputt.","Sie war krank.","Der Chef hat angerufen."],0],["Was ist auf dem Weg passiert?",["Es gab einen Unfall.","Der Bus ist nicht gekommen.","Sie hat ihr Handy verloren."],0],["Wie hat der Chef reagiert?",["Er hat geschimpft.","Er hat gelacht.","Er hat nichts gesagt."],0]],r:["Warum möchte die Person am Abend nicht ausgehen?",["Sie ist nach dem schlechten Tag sehr müde.","Sie mag die Leute nicht.","Sie hat keinen Schlüssel."],0]},
{id:"a2-keller",level:"A2",title:"Der Keller",en:"Clearing out the cellar",s:[
["Am Samstag haben mein Bruder und ich endlich den Keller aufgeräumt.","On Saturday my brother and I finally tidied the cellar.",["g-perf","g-sep","g-poss"]],
["Dort unten war eine riesige Menge alter Dinge.","Down there was a huge pile of old things.",["g-past","g-adj","g-plural"]],
["Vorn an der Tür standen alte Ski und ein Zelt.","At the front by the door there were old skis and a tent.",["g-dat","g-plural"]],
["Drüben in der Ecke haben wir eine große Kiste gefunden.","Over in the corner we found a big box.",["g-perf","g-dat","g-adj"]],
["Wir haben sie aufgemacht: Drinnen waren Poster, Stifte und ein paar Blätter Papier.","We opened it: inside were posters, pens and a few sheets of paper.",["g-perf","g-sep","g-plural"]],
["Damit haben wir als Kinder oft gebastelt.","We often did crafts with them as kids.",["g-perf"]],
["Auch eine alte Schere lag dort, aber sie war kaputt.","An old pair of scissors was there too, but it was broken.",["g-past","g-adj"]],
["Die Handtücher waren schmutzig, also kamen sie gleich in die Wäsche.","The towels were dirty, so they went straight into the wash.",["g-plural","g-past","g-acc"]],
["Ein Stück Holz war hart wie Stein, aber das alte Kissen war ganz weich.","A piece of wood was as hard as stone, but the old cushion was really soft.",["g-adj"]],
["Den Rest haben wir in die Garage gebracht.","We took the rest to the garage.",["g-perf","g-acc"]],
["Jetzt müssen wir nur noch die Sachen für den Flohmarkt einpacken.","Now we just have to pack up the things for the flea market.",["g-modal","g-sep"]],
["Aber Mama hat schon wieder alles ausgepackt, weil sie nichts wegwerfen will.","But Mum has already unpacked everything again because she doesn't want to throw anything away.",["g-perf","g-sep","g-sub","g-modal"]]],
q:[["Was stand vorn an der Tür?",["Ski und ein Zelt","eine Kiste mit Postern","ein altes Fahrrad"],0],["Was haben sie in der Kiste gefunden?",["Poster und Stifte","alte Handtücher und ein Kissen","nur Holz"],0],["Wohin haben sie den Rest gebracht?",["in die Garage","in die Küche","zum Nachbarn"],0]],r:["Warum ist die Arbeit vielleicht noch nicht fertig?",["Mama hat alles wieder ausgepackt.","Der Bruder hatte keine Lust.","Die Garage ist zu klein."],0]},
{id:"a2-schloss",level:"A2",title:"Das alte Schloss",en:"The old castle",s:[
["Letzten Sommer waren wir mit der Familie in Österreich.","Last summer we were in Austria with the family.",["g-past","g-dat"]],
["In der Nähe von unserem Hotel gab es ein altes Schloss.","Near our hotel there was an old castle.",["g-dat","g-adj"]],
["Es liegt etwas außerhalb der Stadt auf einem Berg.","It's a little outside the town, on a mountain.",["g-dat"]],
["Ein reicher Mann hat es vor rund vierhundert Jahren gebaut.","A rich man built it around four hundred years ago.",["g-perf","g-adj","g-dat"]],
["Er ist dort auch gestorben, und manche Leute sagen, dass er immer noch im Schloss wohnt.","He also died there, and some people say he still lives in the castle.",["g-perf","g-sub"]],
["Wir haben eine Tour mit einer österreichischen Führerin gemacht.","We went on a tour with an Austrian guide.",["g-perf","g-dat","g-adj"]],
["Beim Rundgang haben wir viel über Kunst und berühmte Künstler gelernt.","On the walk round we learned a lot about art and famous artists.",["g-perf","g-adj","g-plural"]],
["Fotografieren war drinnen leider verboten.","Unfortunately, taking photos inside wasn't allowed.",["g-past"]],
["Dafür braucht man eine besondere Erlaubnis.","For that you need special permission.",["g-acc","g-adj"]],
["Mein Vater wollte trotzdem seinen Fotoapparat aus der Tasche holen.","My father still wanted to get his camera out of his bag.",["g-modal","g-poss","g-dat"]],
["Aber die Führerin hat sofort gesagt: „Das ist hier nicht erlaubt!“","But the guide said straight away: 'That isn't allowed here!'",["g-perf","g-neg"]],
["Unten im Keller haben wir noch einen tiefen, dunklen Brunnen gesehen.","Down in the cellar we also saw a deep, dark well.",["g-perf","g-adj","g-acc"]],
["Zum Schluss habe ich im Shop eine Postkarte für meine Oma gekauft.","At the end I bought a postcard for my grandma in the shop.",["g-perf","g-poss"]]],
q:[["Wo liegt das Schloss?",["auf einem Berg","im Stadtzentrum","neben dem Hotel am See"],0],["Wer hat das Schloss gebaut?",["ein reicher Mann","ein berühmter Künstler aus Wien","die Stadt"],0],["Was war drinnen verboten?",["Fotos machen","laut sprechen","Essen und Trinken mitbringen"],0]],r:["Warum hat die Führerin etwas zum Vater gesagt?",["Er wollte drinnen fotografieren.","Er hat zu laut gesprochen.","Er hatte kein Ticket."],0]},
{id:"a2-schweiz",level:"A2",title:"Mit dem Zug durch die Schweiz",en:"By train through Switzerland",s:[
["Im Februar war ich eine Woche mit dem Zug in der Schweiz unterwegs.","In February I spent a week travelling around Switzerland by train.",["g-past","g-dat"]],
["Ich fliege nicht gern, deshalb habe ich keinen Flug gebucht.","I don't like flying, so I didn't book a flight.",["g-neg","g-perf","g-v2"]],
["Für mich ist die Bahn das beste Verkehrsmittel.","For me the train is the best way to travel.",["g-adj","g-acc"]],
["Vor der Reise habe ich am Bahnhof Euro in Franken gewechselt.","Before the trip I changed euros into francs at the station.",["g-perf","g-dat"]],
["Mit meinem Studentenausweis habe ich eine Ermäßigung bekommen.","With my student card I got a discount.",["g-perf","g-dat","g-poss"]],
["Das Ticket hat nur dreißig Franken pro Tag gekostet.","The ticket only cost thirty francs a day.",["g-perf"]],
["Im Zug hat ein Schaffner die Fahrkarten kontrolliert.","On the train a conductor checked the tickets.",["g-perf","g-plural"]],
["Er hat meinen Ausweis ganz genau geprüft.","He checked my ID very carefully.",["g-perf","g-poss"]],
["In Bern, der Hauptstadt, war es kalt und bewölkt.","In Bern, the capital, it was cold and cloudy.",["g-past"]],
["In den Bergen lag überall Schnee.","There was snow everywhere in the mountains.",["g-dat","g-plural"]],
["Auf einem See bin ich mit einem Schiff gefahren und habe mit meinem Fotoapparat viele Bilder gemacht.","I took a boat out on a lake and took lots of pictures with my camera.",["g-perf","g-dat"]],
["Die schweizerische Schokolade ist wirklich so gut, wie alle sagen.","Swiss chocolate really is as good as everyone says.",["g-adj"]],
["Meinen Eltern habe ich eine Postkarte aus Bern geschrieben.","I wrote my parents a postcard from Bern.",["g-perf","g-dat","g-poss"]]],
q:[["Warum ist die Person nicht geflogen?",["Sie fliegt nicht gern.","Der Flug war zu teuer.","Es gab keinen Flughafen in der Nähe."],0],["Was hat der Schaffner gemacht?",["Fahrkarten kontrolliert","Kaffee und Kuchen verkauft","Koffer getragen"],0],["Wie war das Wetter in Bern?",["kalt und bewölkt","warm und sonnig","sehr windig, mit viel Regen"],0]],r:["Warum war die Reise wahrscheinlich nicht sehr teuer?",["Sie hat eine Ermäßigung bekommen.","Sie hat im Zelt geschlafen.","Ihre Eltern haben alles bezahlt."],0]},
{id:"a2-ring",level:"A2",title:"Der verlorene Ring",en:"The lost ring",s:[
["Am Samstag war ich mit meiner Freundin Lea im neuen Einkaufszentrum.","On Saturday I was at the new shopping centre with my friend Lea.",["g-dat","g-poss","g-adj"]],
["Im ersten Stockwerk gab es Kleidung mit Ermäßigung.","On the first floor there were clothes on discount.",["g-dat","g-adj"]],
["Lea hat eine lila Bluse und einen kurzen Rock gekauft.","Lea bought a purple blouse and a short skirt.",["g-perf","g-acc","g-adj"]],
["Ich habe zwei Paar Socken und eine Hose gekauft.","I bought two pairs of socks and some trousers.",["g-perf","g-acc"]],
["Danach waren wir noch in der Drogerie und haben Seife und eine Creme mitgenommen.","Then we went to the chemist's and picked up some soap and a cream.",["g-perf","g-sep","g-dat"]],
["Plötzlich hat Lea gemerkt, dass ihr Ring weg war.","Suddenly Lea noticed that her ring was gone.",["g-perf","g-sub","g-poss"]],
["Sie war sehr traurig, denn der Ring war ein Geschenk von ihrer Oma.","She was very sad, because the ring was a present from her grandma.",["g-past","g-dat","g-poss"]],
["Wir haben überall gesucht, aber wir konnten ihn nirgends finden.","We looked everywhere, but we couldn't find it anywhere.",["g-perf","g-modal"]],
["Eine Kundin hat uns gesagt, dass es im Erdgeschoss einen Service für Fundsachen gibt.","A customer told us there was a lost property service on the ground floor.",["g-perf","g-sub","g-dat"]],
["Dort hat ein freundlicher Mann gefragt: „Ist Ihr Ring rosa?“","There a friendly man asked: 'Is your ring pink?'",["g-perf","g-sie","g-poss"]],
["Ja! Jemand hatte ihn vor der Reinigung gefunden und abgegeben.","Yes! Someone had found it outside the dry cleaner's and handed it in.",["g-past","g-sep","g-dat"]],
["Lea war so froh, dass ihr die neue Bluse plötzlich ganz egal war.","Lea was so happy that she suddenly didn't care at all about the new blouse.",["g-sub","g-dat"]]],
q:[["Was hat Lea gekauft?",["einen Rock und eine Bluse","Socken","eine Hose und Schuhe aus Leder"],0],["Warum war Lea traurig?",["Ihr Ring war weg.","Die Bluse war zu teuer.","Ihre Freundin hatte keine Zeit."],0],["Wo war der Ring?",["beim Service für Fundsachen","in der Drogerie","in Leas Tasche"],0]],r:["Warum war der Ring für Lea so wichtig?",["Er war ein Geschenk von ihrer Oma.","Er war sehr teuer.","Sie hatte ihn gerade gekauft."],0]},
{id:"a2-cafeteria",level:"A2",title:"Mittagessen in der Cafeteria",en:"Lunch in the cafeteria",s:[
["In unserer Firma gibt es eine Cafeteria, wo ich jeden Tag mein Mittagessen hole.","There's a cafeteria at our company where I get my lunch every day.",["g-sub","g-poss"]],
["Der Koch kocht täglich zwei Gerichte: eins mit Fleisch und eins ohne.","The cook makes two dishes every day: one with meat and one without.",["g-plural","g-dat"]],
["Heute gab es Nudeln mit Rind oder eine Suppe mit Bohnen.","Today there was pasta with beef or a soup with beans.",["g-dat","g-plural"]],
["Schwein gibt es nur selten, weil viele Kollegen es nicht essen.","Pork is only rarely on the menu because many colleagues don't eat it.",["g-sub","g-neg"]],
["Sehr beliebt sind die Hamburger am Freitag.","The burgers on Friday are very popular.",["g-v2","g-plural"]],
["Mein Kollege Ali sagt aber, dass sie zu fett sind.","But my colleague Ali says they're too fatty.",["g-sub","g-poss"]],
["Er ist selbst sehr dünn und isst trotzdem jeden Tag zweimal Nachtisch.","He's very thin himself and still has dessert twice every day.",["g-v2"]],
["Zum Nachtisch gibt es meistens Eis oder eine Orange.","For dessert there's usually ice cream or an orange.",["g-dat"]],
["Letzte Woche gab es keine Löffel, nur Gabeln, also haben wir die Suppe einfach getrunken.","Last week there were no spoons, only forks, so we simply drank the soup.",["g-neg","g-plural","g-perf"]],
["Zu viel Zucker ist schädlich, sagt meine Ärztin.","Too much sugar is harmful, my doctor says.",["g-v2","g-poss"]],
["Aber ein gutes Mittagessen ist notwendig, sonst kann ich nachmittags nicht arbeiten.","But a good lunch is necessary, otherwise I can't work in the afternoon.",["g-adj","g-modal","g-neg"]],
["Typisch deutsch ist bei uns übrigens nur die Currywurst am Mittwoch.","By the way, the only typically German thing here is the currywurst on Wednesday.",["g-v2"]]],
q:[["Wie viele Gerichte gibt es jeden Tag?",["zwei, eins davon ohne Fleisch","drei","eins"],0],["Was denkt Ali über die Hamburger?",["Sie sind zu fett.","Sie sind lecker und billig.","Sie sind zu klein."],0],["Was gab es letzte Woche nicht?",["Löffel","Gabeln","Teller und Tassen"],0]],r:["Warum isst die Person mittags immer etwas?",["Ohne Essen kann sie nicht gut arbeiten.","Das Essen ist sehr billig.","Ihre Ärztin isst auch dort."],0]},
{id:"a2-pruefung",level:"A2",title:"Die Deutschprüfung",en:"The German exam",s:[
["Gestern hatte ich meine Deutschprüfung, das war ziemlich aufregend.","Yesterday I had my German exam, which was pretty nerve-racking.",["g-past","g-poss"]],
["Ich habe schon Englisch und Französisch gelernt, aber Deutsch finde ich am schwersten.","I've already learned English and French, but I find German the hardest.",["g-perf","g-adj"]],
["Wir saßen in einer langen Reihe, und jeder hatte nur einen Stift und ein Blatt Papier.","We sat in a long row, and everyone had just one pen and one sheet of paper.",["g-past","g-dat","g-adj"]],
["Die Prüferin hat langsam und sehr deutlich gesprochen.","The examiner spoke slowly and very clearly.",["g-perf"]],
["Erstens mussten wir einen Text lesen und die richtigen Antworten markieren.","First we had to read a text and mark the right answers.",["g-modal","g-past","g-adj"]],
["Zweitens sollten wir ein Bild beschreiben.","Second, we had to describe a picture.",["g-modal","g-past"]],
["Dann mussten wir aus drei Themen eins wählen und unsere Wahl begründen.","Then we had to choose one of three topics and give reasons for our choice.",["g-modal","g-poss"]],
["Bei einer Aufgabe sollten wir zu jedem Wort das Gegenteil nennen, zum Beispiel „groß“ und „klein“.","In one task we had to give the opposite of each word, for example 'big' and 'small'.",["g-modal","g-dat"]],
["Eine Übersetzung ins Englische gab es zum Glück nicht.","Luckily there was no translation into English.",["g-neg"]],
["Auf der letzten Seite stand: „Lesen Sie die E-Mail und finden Sie heraus, wann das Treffen ist.“","The last page said: 'Read the email and find out when the meeting is.'",["g-sie","g-sep","g-sub"]],
["Zuletzt kam die mündliche Prüfung zu zweit.","Last came the speaking test in pairs.",["g-past"]],
["Dort mussten wir über Zahlen und Preise sprechen.","There we had to talk about numbers and prices.",["g-modal","g-plural"]],
["Für jede Aufgabe gibt es Punkte, und ich hoffe, dass ich genug Punkte habe.","There are points for every task, and I hope I have enough points.",["g-plural","g-sub"]]],
q:[["Was hatte jeder in der Prüfung?",["einen Stift","ein Wörterbuch und ein Heft","sein Handy"],0],["Was musste man im zweiten Teil machen?",["ein Bild beschreiben","einen Brief schreiben","eine Übersetzung machen"],0],["Was gab es zum Glück nicht?",["eine Übersetzung","eine mündliche Prüfung","Aufgaben mit Punkten"],0]],r:["Wie fühlt sich die Person nach der Prüfung wahrscheinlich?",["Sie hofft, dass sie bestanden hat.","Sie weiß, dass alles falsch war.","Sie ist sehr wütend."],0]},
{id:"a2-quiz",level:"A2",title:"Das große Quiz",en:"The big quiz",s:[
["Am Freitag gab es in unserer Klasse ein großes Quiz.","On Friday there was a big quiz in our class.",["g-dat","g-adj"]],
["Wir haben zwei Mannschaften gebildet, und jede Mannschaft hat einen Namen gewählt.","We formed two teams, and each team chose a name.",["g-perf","g-plural"]],
["Die Fragen kamen aus allen Fächern: Mathe, Biologie, Chemie und Physik.","The questions came from all subjects: maths, biology, chemistry and physics.",["g-plural","g-dat"]],
["Bei Mathe mussten wir ganz schnell rechnen.","In maths we had to calculate really fast.",["g-modal","g-past"]],
["Bei Biologie ging es um Tiere und Pflanzen.","Biology was about animals and plants.",["g-plural","g-acc"]],
["Es gab auch Fragen zu aktuellen Themen aus der Zeitung.","There were also questions about current topics from the newspaper.",["g-adj","g-dat","g-plural"]],
["Mein Freund Jonas ist wirklich intelligent, er wusste fast alles.","My friend Jonas is really intelligent, he knew almost everything.",["g-poss","g-past"]],
["Bei einer Frage wusste ich die Antwort nicht und musste raten.","For one question I didn't know the answer and had to guess.",["g-neg","g-modal","g-past"]],
["Leider war meine Antwort falsch, und ich habe mich ein bisschen dumm gefühlt.","Sadly my answer was wrong, and I felt a bit stupid.",["g-perf","g-poss"]],
["„Das ist nicht blöd, die Frage war schwer“, hat Jonas gesagt.","'That's not stupid, the question was hard,' Jonas said.",["g-neg","g-perf"]],
["Am Ende hatten beide Mannschaften die gleiche Zahl an Punkten.","In the end both teams had the same number of points.",["g-adj","g-plural"]],
["Unsere Lehrerin hat gelacht: „Ihr seid alle sehr klug!“","Our teacher laughed: 'You're all very clever!'",["g-perf","g-poss"]],
["So ein Spiel macht Spaß, und jetzt haben viele mehr Interesse an Chemie und Physik.","A game like that is fun, and now lots of us are more interested in chemistry and physics.",["g-acc"]]],
q:[["Wer hat das Quiz gewonnen?",["Niemand, beide hatten gleich viele Punkte.","Jonas","die Lehrerin"],0],["Worum ging es bei Biologie?",["um Tiere und Pflanzen","um Zahlen","um aktuelle Themen aus der Zeitung"],0],["Was hat die Person gemacht, als sie die Antwort nicht wusste?",["Sie hat geraten.","Sie hat Jonas gefragt.","Sie hat im Handy nachgesehen."],0]],r:["Wie findet Jonas die falsche Antwort von seinem Freund?",["nicht schlimm","sehr dumm","lustig, weil sie so falsch war"],0]},
{id:"a2-wochenende",level:"A2",title:"Was unternehmen wir?",en:"What shall we do?",s:[
["Am Freitagabend fragt meine Frau: „Was wollen wir am Wochenende unternehmen?“","On Friday evening my wife asks: 'What shall we do at the weekend?'",["g-modal","g-poss"]],
["Ich sage: „Lass uns mal wieder ins Theater gehen.“","I say: 'Let's go to the theatre again some time.'",["g-acc"]],
["„Natürlich, gute Idee“, antwortet sie, „aber die Karten sind sehr teuer.“","'Of course, good idea,' she answers, 'but the tickets are very expensive.'",["g-adj","g-plural"]],
["Unsere Tochter möchte lieber in den Zirkus oder in den Zoo.","Our daughter would rather go to the circus or the zoo.",["g-modal","g-acc","g-poss"]],
["Unser Sohn interessiert sich nur für Pferde und will reiten.","Our son is only interested in horses and wants to go riding.",["g-modal","g-acc","g-poss"]],
["Jeder denkt anders, das ist bei uns immer so.","Everyone thinks differently, it's always like that with us.",["g-v2"]],
["Am Ende haben wir einen Plan: Am Samstag sind wir aktiv und machen einen langen Spaziergang am Fluss.","In the end we have a plan: on Saturday we'll be active and go for a long walk by the river.",["g-adj","g-dat","g-v2"]],
["Danach darf unser Sohn auf einem Bauernhof reiten.","Afterwards our son is allowed to ride on a farm.",["g-modal","g-dat","g-poss"]],
["Am Sonntag gehen wir mit den Kindern in den Zoo.","On Sunday we're going to the zoo with the kids.",["g-dat","g-acc"]],
