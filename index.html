["Am Abend gehen meine Frau und ich zu zweit aus.","In the evening my wife and I go out, just the two of us.",["g-sep","g-poss"]],
["Wenn wir zu müde sind, sehen wir uns zu Hause einen Krimi an.","If we're too tired, we'll watch a crime film at home.",["g-sub","g-sep"]],
["Oder es gibt eine gute Sendung im Fernsehen, das ist mir eigentlich egal.","Or there's a good programme on TV, I don't really mind.",["g-dat"]]],
q:[["Warum gehen sie nicht ins Theater?",["Die Karten sind zu teuer.","Das Theater ist geschlossen.","Die Kinder wollen nicht."],0],["Was möchte der Sohn machen?",["auf einem Pferd reiten","in den Zoo","fernsehen"],0],["Was machen alle am Sonntag?",["Sie gehen in den Zoo.","Sie machen einen langen Spaziergang.","Sie bleiben zu Hause."],0]],r:["Was ist für die Eltern am Abend wichtig?",["Zeit zu zweit","ein teures Restaurant","ein Film im Kino mit den Kindern"],0]},
{id:"a2-sprechstunde",level:"A2",title:"In der Sprechstunde",en:"At the doctor's",s:[
["Seit einer Woche fühle ich mich nicht gut, deshalb war ich heute in der Sprechstunde.","I haven't felt well for a week, so today I went to the doctor's surgery.",["g-dat","g-neg","g-v2"]],
["Mein Hals tut weh, und ich höre auf einem Ohr ziemlich schlecht.","My throat hurts, and I can't hear very well in one ear.",["g-poss","g-dat"]],
["Die Ärztin hat gesagt, dass ich stark erkältet bin.","The doctor said I've got a bad cold.",["g-perf","g-sub"]],
["Sie hat mir ein Mittel gegen die Schmerzen gegeben.","She gave me something for the pain.",["g-perf","g-dat","g-acc"]],
["Andere Tabletten sind nicht notwendig, ich soll nur viel Tee trinken und schlafen.","Other tablets aren't necessary, I just need to drink lots of tea and sleep.",["g-neg","g-modal","g-plural"]],
["Außerdem tut mir oft der Magen weh.","My stomach often hurts too.",["g-dat"]],
["Die Ärztin meint, das kommt vom Stress bei der Arbeit.","The doctor thinks it comes from stress at work.",["g-dat","g-v2"]],
["Zu viel Kaffee ist auch schädlich für den Magen.","Too much coffee is also bad for the stomach.",["g-acc"]],
["Ich soll weniger fett essen und mehr Sport machen, damit ich wieder fit bin.","I'm supposed to eat less fatty food and do more sport so that I'm fit again.",["g-modal","g-sub"]],
["Nächste Woche muss ich noch zum Zahnarzt, weil ein Zahn wehtut.","Next week I also have to go to the dentist because a tooth hurts.",["g-modal","g-sub","g-sep"]],
["Und meine Augen sind schwach geworden, ich brauche eine neue Brille.","And my eyes have got weaker, I need new glasses.",["g-perf","g-poss","g-adj"]],
["Zum Glück ist es keine schwere Krankheit, aber ich muss besser auf mich aufpassen.","Luckily it isn't a serious illness, but I need to take better care of myself.",["g-neg","g-modal","g-sep"]]],
q:[["Was hat die Ärztin gesagt?",["Die Person ist stark erkältet.","Es ist gefährlich.","Sie muss ins Krankenhaus."],0],["Woher kommen die Schmerzen im Magen?",["vom Stress","vom Tee","von den Tabletten der Ärztin"],0],["Warum braucht die Person eine neue Brille?",["Sie sieht schlecht.","Die alte Brille ist kaputt gegangen.","Sie hat sie verloren."],0]],r:["Was soll die Person in Zukunft weniger machen?",["Kaffee trinken","Tee trinken","schlafen und sich ausruhen"],0]},
{id:"a2-tennis",level:"A2",title:"Das große Spiel",en:"The big match",s:[
["Meine Tochter Mia spielt seit zwei Jahren Tennis in einem Club.","My daughter Mia has been playing tennis in a club for two years.",["g-dat","g-poss"]],
["Vorher hat sie Basketball und Volleyball gespielt, aber das hat ihr nicht so gefallen.","Before that she played basketball and volleyball, but she didn't like it much.",["g-perf","g-dat","g-neg"]],
["Sie trainiert dreimal pro Woche auf dem Sportplatz hinter der Schule.","She trains three times a week on the sports ground behind the school.",["g-dat"]],
["Das Training ist hart, aber sie ist sehr sportlich.","The training is hard, but she's very sporty.",["g-v2"]],
["Morgens geht sie außerdem noch joggen.","She also goes jogging in the mornings.",["g-v2"]],
["Ihr Ziel war, im Juni das große Spiel gegen einen anderen Club zu gewinnen.","Her goal was to win the big match against another club in June.",["g-poss","g-adj","g-acc"]],
["Am Anfang hat sie viele Punkte verloren.","At the start she lost a lot of points.",["g-perf","g-plural"]],
["Der Ball ist immer wieder ins Netz gegangen.","The ball kept going into the net.",["g-perf","g-acc"]],
["Ihr Trainer hat gerufen: „Geh nach vorn! Spiel aktiv!“","Her coach shouted: 'Go to the front! Play actively!'",["g-perf","g-poss"]],
["Danach hat sie ihr Spiel geändert und ist immer weiter vorwärts gegangen.","After that she changed her game and kept moving forward.",["g-perf","g-poss"]],
["Am Ende hat sie gewonnen und ihr Ziel erreicht.","In the end she won and reached her goal.",["g-perf","g-poss"]],
["Ich bin sicher, dass sie bald noch besser wird.","I'm sure she'll soon get even better.",["g-sub"]]],
q:[["Welchen Sport macht Mia jetzt?",["Tennis im Club","Basketball","Joggen"],0],["Wie war der Anfang des Spiels für Mia?",["Es ist schlecht gelaufen.","Sie hat schnell viele Punkte gemacht.","Der Trainer war nicht da."],0],["Was hat der Trainer gerufen?",["Sie soll aktiv spielen.","Sie soll aufhören.","Sie soll langsamer spielen und mehr trinken."],0]],r:["Warum hat Mia am Ende gewonnen?",["Sie hat ihr Spiel geändert.","Die andere Spielerin war krank.","Es hat geregnet."],0]},
{id:"a2-nachbarin",level:"A2",title:"Frau Huber",en:"Mrs Huber",s:[
["Unsere Nachbarin, Frau Huber, ist Rentnerin und lebt allein.","Our neighbour, Mrs Huber, is a pensioner and lives alone.",["g-poss"]],
["Ihr Mann ist vor fünf Jahren gestorben.","Her husband died five years ago.",["g-perf","g-dat","g-poss"]],
["Sie erinnert sich gern an ihn und erzählt oft von früher.","She likes remembering him and often talks about the old days.",["g-acc","g-dat"]],
["Die beiden haben sich in einem Chor in der Kirche verliebt.","The two of them fell in love in a church choir.",["g-perf","g-dat"]],
["Das finde ich sehr romantisch.","I find that very romantic.",["g-v2"]],
["Ihre Tochter ist geschieden und wohnt mit der Enkelin in Österreich.","Her daughter is divorced and lives with the granddaughter in Austria.",["g-poss","g-dat"]],
["Frau Huber hat aber jeden Tag Kontakt mit ihnen.","But Mrs Huber is in touch with them every day.",["g-dat"]],
["Ihre Enkelin hat ihr gezeigt, wie man ein E-Book liest.","Her granddaughter showed her how to read an e-book.",["g-perf","g-dat","g-sub"]],
["Jetzt schreibt Frau Huber sogar ein Blog über Pflanzen und ihren Garten.","Now Mrs Huber even writes a blog about plants and her garden.",["g-acc","g-plural","g-poss"]],
["Manchmal spielt sie abends Klavier, und wir hören es durch die Wand.","Sometimes she plays the piano in the evening, and we hear it through the wall.",["g-acc"]],
["An Ostern hat sie uns zu einer kleinen Feier eingeladen.","At Easter she invited us to a small party.",["g-perf","g-sep","g-dat"]],
["Wir haben uns stundenlang unterhalten und viel gelacht.","We chatted for hours and laughed a lot.",["g-perf"]],
["Zum Abschied hat sie gesagt: „Ich wünsche euch alles Gute!“","When we left she said: 'I wish you all the best!'",["g-perf","g-dat"]]],
q:[["Wo haben sich Frau Huber und ihr Mann verliebt?",["in der Kirche","im Garten","in Österreich bei der Tochter"],0],["Wo wohnt die Enkelin?",["in Österreich","bei Frau Huber","in einer anderen Wohnung im Haus"],0],["Was macht Frau Huber jetzt im Internet?",["ein Blog schreiben","Pflanzen und Blumen kaufen","Klavier lernen"],0]],r:["Wie ist Frau Huber wahrscheinlich?",["freundlich und aktiv","traurig und allein","sehr streng mit den Nachbarn"],0]},
{id:"a2-onkel",level:"A2",title:"Mein Onkel, der Kaufmann",en:"My uncle the businessman",s:[
["Mein Onkel ist Kaufmann und hat eine kleine Firma.","My uncle is a businessman and has a small company.",["g-poss","g-adj"]],
["Die Firma stellt Tische und Stühle aus Holz her.","The company makes wooden tables and chairs.",["g-sep","g-plural","g-dat"]],
["Als Junge hat er jeden Morgen Zeitungen ausgetragen, um Geld zu verdienen.","As a boy he delivered newspapers every morning to earn money.",["g-perf","g-sep","g-plural"]],
["Später hat er bei einem Mechaniker in einer Werkstatt gearbeitet.","Later he worked for a mechanic in a workshop.",["g-perf","g-dat"]],
["Mit dreißig hat er gekündigt und mit einem Kredit von der Bank seine eigene Firma gegründet.","At thirty he quit his job and started his own company with a loan from the bank.",["g-perf","g-dat","g-poss"]],
["Am Anfang hatte er viel Stress, und privat hatte er kaum Zeit.","At first he had a lot of stress and hardly any time for himself.",["g-past"]],
["Er hat die Möbel selbst mit einem kleinen Auto zu den Kunden geliefert.","He delivered the furniture to the customers himself in a small car.",["g-perf","g-dat","g-plural"]],
["Heute arbeiten zwölf Leute in seiner Werkstatt.","Today twelve people work in his workshop.",["g-dat","g-poss"]],
["Letzte Woche hat mein Cousin eine Bewerbung für eine Ausbildung bei ihm geschrieben.","Last week my cousin wrote an application for an apprenticeship with him.",["g-perf","g-dat","g-poss"]],
["Mein Onkel hat gelacht: „Du brauchst keine Bewerbung, aber du musst pünktlich sein!“","My uncle laughed: 'You don't need an application, but you do have to be on time!'",["g-perf","g-neg","g-modal"]],
["Ich finde, er zeigt, dass man mit harter Arbeit viel erreichen kann.","I think he shows that you can achieve a lot with hard work.",["g-sub","g-modal","g-adj"]]],
q:[["Was stellt die Firma her?",["Möbel aus Holz","Autos","Zeitungen"],0],["Wie hat der Onkel seine Firma bezahlt?",["mit einem Kredit","mit Geld von seinen Eltern","mit einem Preis aus dem Fernsehen"],0],["Wo hat der Onkel früher gearbeitet?",["in einer Werkstatt","in einer Bank","in einem großen Supermarkt"],0]],r:["Was erwartet der Onkel vom Cousin?",["Er soll pünktlich sein.","Er soll eine lange Bewerbung schreiben.","Er soll gute Noten haben."],0]},
{id:"a2-vollewoche",level:"A2",title:"Eine volle Woche",en:"A busy week",s:[
["Montags fange ich schon um sieben Uhr an zu arbeiten.","On Mondays I start work as early as seven.",["g-sep"]],
["Mein Mann bringt die Kinder zur Schule, und nachmittags kommt ein Babysitter.","My husband takes the kids to school, and in the afternoons a babysitter comes.",["g-poss","g-dat"]],
["Freitags arbeite ich von zu Hause, das ist sehr praktisch.","On Fridays I work from home, which is very practical.",["g-dat"]],
["Sonntags schlafen wir alle lange, niemand weckt uns.","On Sundays we all sleep late, nobody wakes us.",["g-acc"]],
["Diese Woche ist aber ganz anders als sonst.","But this week is completely different from usual.",["g-v2"]],
["Vorgestern war ich auf einem Workshop in Hamburg.","The day before yesterday I was at a workshop in Hamburg.",["g-past","g-dat"]],
["Übermorgen fährt mein Sohn mit seiner Klasse auf Klassenfahrt.","The day after tomorrow my son goes on a school trip with his class.",["g-poss","g-dat"]],
["Ich muss mich beeilen, denn ich habe seinen Koffer noch nicht gepackt.","I have to hurry because I haven't packed his suitcase yet.",["g-modal","g-perf","g-neg"]],
["Meinen Termin beim Friseur habe ich auf nächste Woche verschoben.","I've moved my hairdresser's appointment to next week.",["g-perf","g-poss","g-acc"]],
["Ich habe dort angerufen und Bescheid gesagt.","I phoned them and let them know.",["g-perf","g-sep"]],
["Zum Glück hilft mein Mann viel, ohne ihn schaffe ich das nicht.","Luckily my husband helps a lot; without him I couldn't manage.",["g-acc","g-neg"]],
["Am Wochenende bin ich dann wirklich müde, aber auch zufrieden.","By the weekend I'm really tired, but happy too.",["g-v2"]]],
q:[["Wann arbeitet die Person von zu Hause?",["jeden Freitag","am Montag","nie"],0],["Wohin fährt der Sohn übermorgen?",["auf Klassenfahrt","zum Workshop nach Hamburg","zum Friseur"],0],["Was hat die Person mit dem Termin beim Friseur gemacht?",["auf später verschoben","ganz vergessen und nicht angerufen","abgesagt"],0]],r:["Warum ist die Person am Wochenende müde?",["Die Woche war sehr voll.","Sie hat sonntags gearbeitet.","Die Kinder waren krank."],0]},
{id:"a2-kontrolle",level:"A2",title:"Die Kontrolle",en:"The ticket check",s:[
["Gestern bin ich mit der S-Bahn zur Arbeit gefahren, weil mein Motorroller kaputt war.","Yesterday I took the suburban train to work because my scooter was broken.",["g-perf","g-sub","g-poss"]],
["Kurz nach dem Bahnhof sind zwei Kontrolleure eingestiegen und haben die Fahrkarten kontrolliert.","Shortly after the station two inspectors got on and checked the tickets.",["g-perf","g-sep","g-plural"]],
["Ein junger Mann neben mir hatte keine Fahrkarte.","A young man next to me had no ticket.",["g-neg","g-dat","g-adj"]],
["Er hat gesagt, dass er seine Karte verloren hat, aber das war eine Lüge.","He said he'd lost his ticket, but that was a lie.",["g-perf","g-sub","g-poss"]],
["Die Kontrolleurin hat ihn genau angesehen und gesagt: „Sie lügen doch!“","The inspector looked at him closely and said: 'You're lying!'",["g-perf","g-sep","g-sie"]],
["An der nächsten Station haben zwei Polizisten gewartet.","At the next stop two police officers were waiting.",["g-perf","g-dat","g-plural"]],
["Ein Polizist hat seinen Ausweis geprüft.","A police officer checked his ID.",["g-perf","g-poss"]],
["Außerdem hatte er die ganze Zeit sehr laut Musik gehört, und das ist in der Bahn nicht erlaubt.","He'd also been playing loud music the whole time, and that isn't allowed on the train.",["g-past","g-neg","g-dat"]],
["Rauchen ist dort natürlich auch verboten.","Of course, smoking isn't allowed there either.",["g-v2"]],
["Am Bahnhof bin ich dann ausgestiegen und zu Fuß weitergegangen.","Then I got off at the station and walked the rest of the way.",["g-perf","g-sep"]],
["Vor dem Bahnhof darf man übrigens nur mit einer Erlaubnis parken.","By the way, you can only park in front of the station with a permit.",["g-modal","g-dat"]],
["Ich bin froh, dass ich immer ein Ticket kaufe.","I'm glad that I always buy a ticket.",["g-sub"]]],
q:[["Warum ist die Person mit der S-Bahn gefahren?",["Ihr Motorroller war kaputt.","Sie wollte Geld sparen.","Es hat stark geschneit und geregnet."],0],["Was hat der junge Mann gesagt?",["Er hat die Karte verloren.","Er hatte keine Zeit, eine Karte zu kaufen.","Er ist Polizist."],0],["Wer hat den Ausweis geprüft?",["ein Polizist","die Kontrolleurin","ein Mann aus dem Zug"],0]],r:["Warum hat die Kontrolleurin dem Mann nicht geglaubt?",["Sie hat gemerkt, dass er lügt.","Er war sehr freundlich.","Er hatte eine Fahrkarte."],0]},
{id:"a2-bauernhof",level:"A2",title:"Ein Brief vom Bauernhof",en:"A letter from the farm",s:[
["Liebe Oma, seit Neujahr bin ich in den Winterferien auf einem Bauernhof in der Nähe von Salzburg.","Dear Grandma, since New Year I've been on a farm near Salzburg for the winter holidays.",["g-dat"]],
["Die Familie hier ist österreichisch und sehr nett.","The family here is Austrian and very nice.",["g-v2"]],
["Außer mir sind noch zwei Kinder aus der Schweiz hier, Nora und ihr blonder Bruder Luca.","Apart from me there are two other kids from Switzerland here, Nora and her blond brother Luca.",["g-dat","g-adj","g-poss"]],
["Sie haben mir schweizerische Schokolade mitgebracht, die ist super!","They brought me Swiss chocolate, it's great!",["g-perf","g-sep","g-dat"]],
["Jeden Morgen dürfen wir reiten, und mein Pferd heißt Max.","Every morning we're allowed to go riding, and my horse is called Max.",["g-modal","g-poss"]],
["Gestern haben wir einen langen Spaziergang um einen tiefen See gemacht.","Yesterday we went for a long walk round a deep lake.",["g-perf","g-adj","g-acc"]],
["Der Wind war so kalt, dass mein Gesicht ganz rot war.","The wind was so cold that my face was bright red.",["g-sub","g-poss"]],
["Morgen ist hier ein Feiertag, und wir wollen etwas Schönes unternehmen.","Tomorrow is a public holiday here, and we want to do something nice.",["g-modal"]],
["Wahrscheinlich gehen wir in den Zirkus in der Stadt.","We'll probably go to the circus in town.",["g-acc","g-dat","g-v2"]],
["Im Februar gibt es hier auch Karneval, sagt die Bäuerin.","There's carnival here in February too, the farmer's wife says.",["g-v2"]],
["Mama hat gefragt, ob ich dich mal anrufen kann, aber hier gibt es kein Netz.","Mum asked if I could ring you some time, but there's no signal here.",["g-perf","g-sub","g-sep"]],
["Nach Hause will ich auf keinen Fall schon zurück!","I definitely don't want to go home yet!",["g-modal","g-neg"]],
["Am liebsten möchte ich bis Ostern bleiben. Viele Grüße, dein Leon","I'd love to stay until Easter. Love, Leon",["g-modal","g-poss"]]],
q:[["Wo ist Leon in den Ferien?",["auf einem Bauernhof","bei seiner Oma","in der Schweiz"],0],["Was haben die Kinder aus der Schweiz mitgebracht?",["Schokolade","ein Pferd","Bücher und Spiele für den Winter"],0],["Warum ruft Leon nicht an?",["Es gibt dort kein Netz.","Er hat kein Handy und keinen Computer dabei.","Seine Oma mag keine Anrufe."],0]],r:["Wie gefallen Leon die Ferien?",["sehr gut","nicht so gut","Er möchte lieber nach Hause."],0]},
{id:"a2-uebersetzerin",level:"A2",title:"Die Übersetzerin",en:"The translator",s:[
["Ich arbeite als Übersetzerin in einem kleinen Büro außerhalb von Berlin.","I work as a translator in a small office outside Berlin.",["g-dat","g-adj"]],
["Zurzeit mache ich eine Übersetzung aus dem Englischen für einen bekannten Autor.","At the moment I'm doing a translation from English for a well-known author.",["g-dat","g-acc"]],
["Sein Buch ist der dritte Teil einer Reihe, und die ersten zwei Bücher sind sehr beliebt.","His book is the third part of a series, and the first two books are very popular.",["g-poss","g-adj","g-plural"]],
["Morgens beantworte ich zuerst alle E-Mails.","In the mornings I answer all the emails first.",["g-v2","g-plural"]],
["Dann vergleiche ich meinen Text mit dem Original.","Then I compare my text with the original.",["g-poss","g-dat"]],
["Schwierige Wörter habe ich vorher markiert und in einem Heft notiert.","I've marked difficult words beforehand and noted them in a notebook.",["g-perf","g-adj"]],
["Der Autor möchte, dass alles einfach und deutlich klingt.","The author wants everything to sound simple and clear.",["g-modal","g-sub"]],
["Er hat mir zwei Wünsche genannt: erstens kurze Sätze, zweitens keine schweren Wörter.","He gave me two wishes: firstly short sentences, secondly no difficult words.",["g-perf","g-neg","g-plural"]],
["Zuletzt hat er mir einen neuen Vorschlag für den Titel geschickt.","Most recently he sent me a new suggestion for the title.",["g-perf","g-dat","g-acc"]],
["Zwischen dem englischen und dem deutschen Titel gibt es einen großen Unterschied.","There's a big difference between the English and the German title.",["g-dat","g-adj"]],
["Gestern habe ich ihn über meine Arbeit informiert.","Yesterday I updated him on my work.",["g-perf","g-poss"]],
["Heute hat der Verlag bestätigt, dass das Buch im Herbst in die Läden kommt.","Today the publisher confirmed that the book will be in the shops in autumn.",["g-perf","g-sub"]],
["Ein Journalist will schon jetzt darüber berichten, weil das Thema so aktuell ist.","A journalist already wants to report on it, because the topic is so current.",["g-modal","g-sub"]],
["Deshalb ist meine Arbeit jetzt besonders dringend.","That's why my work is especially urgent now.",["g-v2","g-poss"]]],
q:[["Was übersetzt die Frau gerade?",["ein Buch von einem bekannten Autor","einen Film","Briefe"],0],["Was wünscht sich der Autor?",["kurze Sätze","einen langen Titel","viele schwere Wörter aus der Zeitung"],0],["Wann kommt das Buch in die Läden?",["im Herbst","im Frühling","nächste Woche"],0]],r:["Warum muss die Übersetzerin jetzt schnell arbeiten?",["Das Buch kommt bald heraus.","Sie fährt nächste Woche in den Urlaub ans Meer.","Der Autor ist krank."],0]},
{id:"a2-markt",level:"A2",title:"Auf dem Wochenmarkt",en:"At the weekly market",s:[
["Jeden Samstag gehe ich auf den Wochenmarkt in unserem Viertel.","Every Saturday I go to the weekly market in our neighbourhood.",["g-acc","g-dat","g-poss"]],
["Der Markt ist von acht bis eins offen.","The market is open from eight till one.",["g-v2"]],
["Am Stand von Herrn Kaya kaufe ich immer Orangen.","At Mr Kaya's stall I always buy oranges.",["g-dat","g-plural","g-v2"]],
["Heute hat er gesagt: „Die Orangen sind heute besonders weich und süß.“","Today he said: 'The oranges are especially soft and sweet today.'",["g-perf","g-plural"]],
["Am nächsten Stand habe ich ein Stück Rind für eine Suppe gekauft.","At the next stall I bought a piece of beef for a soup.",["g-perf","g-dat"]],
["Der Verkäufer hat mir einen Tipp gegeben: „Schneiden Sie das Fleisch in dünne Stücke.“","The seller gave me a tip: 'Cut the meat into thin pieces.'",["g-perf","g-dat","g-sie","g-adj"]],
["Tomaten gab es in einer riesigen Menge, ein Kilo hat nur rund zwei Euro gekostet.","There was a huge amount of tomatoes, a kilo only cost about two euros.",["g-adj","g-perf"]],
["Ich hatte nur einen großen Schein, aber Herr Kaya konnte zum Glück wechseln.","I only had a large note, but luckily Mr Kaya could give me change.",["g-past","g-modal"]],
["Die Tomaten teile ich immer mit meiner Nachbarin, Frau Kowalski.","I always share the tomatoes with my neighbour, Mrs Kowalski.",["g-dat","g-poss","g-v2"]],
["Den Rest bringe ich ihr am Nachmittag vorbei.","I drop the rest off at her place in the afternoon.",["g-sep","g-dat","g-acc"]],
["Wenn ich klingle, ruft sie immer: „Herein, die Tür ist offen!“","When I ring the bell, she always calls: 'Come in, the door's open!'",["g-sub"]],
["Ihr Telefon ist ein alter Apparat mit Kabel, aber er funktioniert noch.","Her phone is an old device with a cable, but it still works.",["g-poss","g-adj"]],
["Sie freut sich über meinen Besuch, denn so ist sie wenigstens nicht allein.","She's happy when I visit, because at least then she isn't alone.",["g-acc","g-poss","g-neg"]],
["Dann trinken wir Kaffee, und ich erzähle, was auf dem Markt passiert ist.","Then we drink coffee, and I tell her what happened at the market.",["g-sub","g-perf"]]],
q:[["Was kauft die Person immer bei Herrn Kaya?",["immer Orangen","Fleisch","Brot"],0],["Welchen Tipp hat der Verkäufer gegeben?",["dünn schneiden","die Suppe sehr lange kochen lassen","Salz nehmen"],0],["Wem bringt die Person den Rest?",["ihrer Nachbarin","Herrn Kaya","ihrer Familie in einer anderen Stadt"],0]],r:["Warum freut sich die Nachbarin über den Besuch?",["Sie ist dann nicht allein.","Sie möchte Geld für die Tomaten bekommen.","Ihr Telefon ist kaputt."],0]},
{id:"a2-nachbar",level:"A2",title:"Der Nachbar von drüben",en:"The neighbour over the road",s:[
["Herr Brandt wohnt im Haus drüben und schimpft fast jeden Tag.","Mr Brandt lives in the house over the road and complains almost every day.",["g-dat"]],
["Montags schimpft er wegen der Mülltonnen, freitags wegen der Musik.","On Mondays he complains about the bins, on Fridays about the music.",["g-v2","g-plural"]],
["Diese Woche war es besonders schrecklich.","This week it was especially awful.",["g-past"]],
["Die Kinder haben im Hof Basketball gespielt, und der Ball ist gegen sein Fenster geflogen.","The kids were playing basketball in the yard, and the ball flew against his window.",["g-perf","g-poss","g-acc"]],
["Herr Brandt kam sofort heraus und hat laut gerufen: „Was ist das hier für ein Theater?“","Mr Brandt came straight out and shouted: 'What's all this fuss?'",["g-past","g-perf"]],
["„Es tut uns leid“, haben die Kinder gesagt.","'We're sorry,' the kids said.",["g-dat","g-perf"]],
["Am Abend hat mein Mann bei ihm geklingelt, und Herr Brandt hat „Herein!“ gerufen.","In the evening my husband rang his bell, and Mr Brandt called out: 'Come in!'",["g-perf","g-dat","g-poss"]],
["Die beiden haben lange über die Situation gesprochen.","The two of them talked about the situation for a long time.",["g-perf","g-acc"]],
["Dabei hat mein Mann gemerkt, dass Herr Brandt auf einem Ohr fast nichts hört.","My husband noticed that Mr Brandt can hardly hear anything in one ear.",["g-perf","g-sub","g-dat"]],
["Außer seiner Katze, die gerade schwanger ist, hat er kaum Kontakt zu anderen Menschen.","Apart from his cat, who is pregnant at the moment, he hardly has any contact with other people.",["g-dat","g-sub","g-poss"]],
["Früher war er Kaufmann und hat Spielzeug aus Holz hergestellt.","He used to be a businessman and made wooden toys.",["g-past","g-perf","g-sep"]],
["Er interessiert sich sehr für alte Schlösser und hat viele Bücher darüber.","He's very interested in old castles and has lots of books about them.",["g-acc","g-plural"]],
["Seitdem gehen die Kinder manchmal bei ihm vorbei und hören seine Geschichten.","Since then the kids sometimes drop by and listen to his stories.",["g-sep","g-dat","g-poss"]],
["Mit einer Sache hatte Herr Brandt aber recht: Ein Ball gehört nicht ins Fenster!","But Mr Brandt was right about one thing: a ball doesn't belong in a window!",["g-past","g-neg"]],
["Die Kinder finden ihn jetzt gar nicht mehr blöd.","The kids don't think he's stupid at all any more.",["g-neg","g-acc"]]],
q:[["Was ist diese Woche passiert?",["Ein Ball hat sein Fenster getroffen.","Die Kinder haben bis spät in der Nacht laute Musik gehört.","Seine Katze war weg."],0],["Was hat der Mann über Herrn Brandt erfahren?",["Er hört schlecht.","Er ist sehr reich.","Er hat viele Freunde im Haus."],0],["Was hat Herr Brandt früher gemacht?",["Spielzeug hergestellt","Häuser und Schlösser gebaut","Bücher geschrieben"],0]],r:["Wie ist die Situation jetzt?",["besser als vorher","noch schlimmer","genau wie früher"],0]},
{id:"a2-ferienjob",level:"A2",title:"Mein Ferienjob",en:"My holiday job",s:[
["In den Sommerferien habe ich jeden Morgen Zeitungen ausgetragen.","In the summer holidays I delivered newspapers every morning.",["g-perf","g-sep","g-plural"]],
["Nachmittags habe ich in einer Reinigung gearbeitet.","In the afternoons I worked at a dry cleaner's.",["g-perf","g-dat"]],
["Dort habe ich Hemden sortiert und mit einer Schere kleine Zettel abgeschnitten.","There I sorted shirts and cut off little labels with scissors.",["g-perf","g-sep","g-dat"]],
["Viele Hemden haben stark nach Parfüm gerochen.","Lots of the shirts smelled strongly of perfume.",["g-perf","g-dat"]],
["Meine Chefin war sehr intelligent und hat mir viel erklärt.","My boss was very intelligent and explained a lot to me.",["g-perf","g-dat","g-poss"]],
["Sie wusste zum Beispiel, welches Mittel man für welchen Fleck braucht.","For example, she knew which product you need for which stain.",["g-past","g-sub"]],
["Abends musste ich den Laden abschließen.","In the evenings I had to lock up the shop.",["g-modal","g-sep"]],
["Das Telefon war ein alter Apparat, und ich habe die Kunden oft schlecht verstanden.","The phone was an old device, and I often couldn't understand the customers well.",["g-past","g-perf","g-plural"]],
["Reich bin ich mit dem Job nicht geworden, aber ich habe genug für einen Motorroller gespart.","I didn't get rich from the job, but I saved enough for a scooter.",["g-perf","g-neg","g-acc"]],
["Den Rest hat mir mein Bruder geliehen.","My brother lent me the rest.",["g-perf","g-dat","g-poss"]],
["Mit dem Roller komme ich jetzt viel schneller vorwärts als mit dem Bus.","With the scooter I get around much faster now than by bus.",["g-dat","g-adj"]],
["Im Herbst beginne ich mein Studium, und ich habe sogar ein Stipendium bekommen.","In autumn I start university, and I've even got a scholarship.",["g-perf","g-poss"]],
["Die Erfahrung im Job war wirklich nützlich.","The experience at the job was really useful.",["g-past"]],
["Ich habe mich bei meiner Chefin bedankt und komme nächsten Sommer auf jeden Fall wieder.","I thanked my boss and I'll definitely be back next summer.",["g-perf","g-sep","g-dat"]]],
q:[["Was hat die Person morgens gemacht?",["Zeitungen ausgetragen","Hemden sortiert","geschlafen"],0],["Wofür hat die Person Geld gespart?",["für einen Motorroller","für das Studium","für eine Reise nach Spanien mit Freunden"],0],["Wer hat den Rest bezahlt?",["der Bruder","die Chefin","die Eltern"],0]],r:["Warum kommt die Person nächsten Sommer wieder?",["Sie hat dort viel gelernt.","Sie hat für den Sommer sonst keine anderen Pläne.","Sie wird dort reich."],0]},
{id:"a2-bibliothek",level:"A2",title:"Ein Fest für die Bibliothek",en:"A party for the library",s:[
["Unsere Bibliothek wird hundert Jahre alt, deshalb organisieren wir ein kleines Festival.","Our library is turning a hundred, so we're organising a small festival.",["g-poss","g-adj","g-v2"]],
["Es findet am ersten Samstag im Juli im Garten statt.","It takes place in the garden on the first Saturday in July.",["g-sep","g-dat"]],
["Wir planen das Fest schon seit drei Monaten.","We've been planning the party for three months already.",["g-dat","g-plural"]],
["Einige Leute aus der Nachbarschaft helfen freiwillig mit.","Some people from the neighbourhood are volunteering to help.",["g-sep","g-dat"]],
["Vorher mussten Handwerker den alten Saal renovieren.","Before that, tradespeople had to renovate the old hall.",["g-modal","g-past","g-adj"]],
["Ein Techniker hat uns bei der Musik und beim Licht beraten.","A technician advised us on the music and the lighting.",["g-perf","g-dat"]],
["Im Team haben wir lange diskutiert, wer singen soll.","As a team we discussed for a long time who should sing.",["g-perf","g-sub","g-modal"]],
["Am Ende haben wir einen Sänger und einen Schauspieler aus der Stadt eingeladen.","In the end we invited a singer and an actor from the town.",["g-perf","g-sep","g-acc"]],
["Für die Kinder gibt es einen Tisch, an dem sie zeichnen und malen können.","For the children there's a table where they can draw and paint.",["g-sub","g-modal","g-dat"]],
["Der Bäcker an der Ecke bringt Kuchen mit.","The baker on the corner is bringing cake.",["g-sep","g-dat"]],
["Die Gäste können sich auf Decken auf die Wiese setzen.","The guests can sit down on blankets on the grass.",["g-modal","g-acc","g-prep2"]],
["Mein Freund Tom ist Krankenpfleger und hilft, falls es jemandem nicht gut geht.","My friend Tom is a nurse and will help in case someone isn't feeling well.",["g-sub","g-dat","g-poss"]],
["Deutsch war in der Schule mein liebstes Fach, deshalb lese ich beim Fest eine kurze Geschichte vor.","German was my favourite subject at school, so I'm reading a short story aloud at the party.",["g-sep","g-poss","g-v2"]],
["Um zehn Uhr abends beenden wir das Fest mit einem Lied.","At ten in the evening we'll end the party with a song.",["g-dat","g-v2"]]],
q:[["Warum gibt es ein Fest?",["Die Bibliothek hat Geburtstag.","Es ist Sommer und alle haben frei und Ferien.","Ein Sänger kommt."],0],["Wer hilft freiwillig mit?",["Nachbarn","nur die Leute, die in der Bibliothek arbeiten","Schauspieler"],0],["Was können die Kinder machen?",["zeichnen und malen","singen","Kuchen backen und verkaufen"],0]],r:["Was macht die Person beim Fest?",["vorlesen","singen und tanzen","Kuchen backen"],0]},
{id:"a1-meinefamilie",level:"A1",title:"Meine Familie",en:"My family",s:[
["Ich heiße Paul und bin zwölf Jahre alt.","My name is Paul and I'm twelve years old.",["g-conj"]],
["Meine Eltern sind seit fünfzehn Jahren verheiratet.","My parents have been married for fifteen years.",["g-poss","g-dat"]],
["Ich habe zwei Geschwister: einen Bruder und eine Schwester.","I have two siblings: a brother and a sister.",["g-acc","g-plural"]],
["Mein Bruder ist noch ein Baby. Er ist im Mai geboren.","My brother is still a baby. He was born in May.",["g-poss","g-perf"]],
["Meine Schwester ist schon sechzehn.","My sister is already sixteen.",["g-poss"]],
["Mein Vater ist der Sohn von Opa Karl.","My father is Grandpa Karl's son.",["g-poss","g-dat"]],
["Meine Mutter ist die Tochter von Oma Erika.","My mother is Grandma Erika's daughter.",["g-poss","g-dat"]],
["Mein Großvater Karl lebt allein, denn seine Frau ist gestorben.","My grandfather Karl lives alone, because his wife has died.",["g-conj","g-perf","g-poss"]],
["Am Sonntag kommt die ganze Familie zu uns: Tanten, Onkel und andere Verwandte.","On Sunday the whole family comes to us: aunts, uncles and other relatives.",["g-dat","g-plural"]],
["Der Junge und das Mädchen von meiner Tante spielen mit Opa Karten.","My aunt's boy and girl play cards with Grandpa.",["g-gender","g-dat"]],
["Unsere Gruppe ist groß: Wir sind zwanzig Personen!","Our group is big: we're twenty people!",["g-poss"]],
["Das Alter ist bei uns kein Problem. Alle haben zusammen Spaß.","Age is no problem with us. Everyone has fun together.",["g-neg"]]],
q:[["Wie viele Geschwister hat Paul?",["zwei","drei","keine"],0],["Wer ist ein Baby?",["der Bruder","die Schwester","die Tante von Paul"],0],["Wann kommt die Familie?",["am Sonntag","jeden Tag","im Mai"],0]],r:["Warum lebt der Großvater allein?",["Seine Frau ist gestorben.","Er mag keine Menschen.","Seine Kinder wohnen in Amerika."],0]},
{id:"a1-amt",level:"A1",title:"Auf dem Amt",en:"At the registration office",s:[
["Sofia ist neu in Leipzig und muss sich anmelden.","Sofia is new in Leipzig and has to register.",["g-modal","g-sep"]],
["Ein Beamter gibt ihr ein Formular.","An official gives her a form.",["g-dat","g-acc"]],
["„Bitte füllen Sie den Bogen aus.“","'Please fill in the form.'",["g-sie","g-sep"]],
["Zuerst schreibt sie ihren Vornamen und ihren Familiennamen.","First she writes her first name and her surname.",["g-poss","g-acc"]],
["Dann den Geburtsort und das Geburtsjahr: Krakau, 1998.","Then her place and year of birth: Kraków, 1998.",[]],
["Familienstand: ledig. Sie ist nicht verheiratet.","Marital status: single. She isn't married.",["g-neg"]],
["Bei „männlich“ oder „weiblich“ kreuzt sie „weiblich“ an.","For 'male' or 'female' she ticks 'female'.",["g-sep"]],
["Sie hat nur einen Bleistift, aber der Beamte sagt: „Nehmen Sie bitte einen Kugelschreiber.“","She only has a pencil, but the official says: 'Please use a pen.'",["g-acc","g-sie"]],
["Einen Ausweis hat sie nicht, aber einen Pass. Er ist noch drei Jahre gültig.","She doesn't have an ID card, but she has a passport. It's valid for three more years.",["g-acc","g-neg"]],
["Zum Schluss braucht der Beamte ihre Unterschrift.","Finally the official needs her signature.",["g-poss"]],
["Sofia unterschreibt, und die Anmeldung ist fertig.","Sofia signs, and the registration is done.",["g-conj"]],
["Jetzt hat sie alle Papiere für ihre neue Wohnung.","Now she has all the papers for her new flat.",["g-poss","g-plural"]]],
q:[["Was muss Sofia ausfüllen?",["ein Formular","einen Brief","eine E-Mail an die Stadt"],0],["Was ist ihr Familienstand?",["ledig, nicht verheiratet","verheiratet","geschieden"],0],["Was zeigt Sofia?",["ihren Pass","ihren Führerschein","ihre Bankkarte"],0]],r:["Warum muss Sofia zum Amt?",["Sie wohnt neu in Leipzig.","Sie sucht eine Arbeit.","Sie hat ihren Pass verloren."],0]},
{id:"a1-heimat",level:"A1",title:"Neu in Deutschland",en:"New in Germany",s:[
["Amira kommt aus Ägypten und lebt seit drei Monaten in Deutschland.","Amira comes from Egypt and has lived in Germany for three months.",["g-dat"]],
["Am Anfang war alles fremd für sie.","At first everything was strange to her.",["g-past"]],
["Jetzt besucht sie einen Kurs für Deutsch.","Now she's taking a German course.",["g-acc"]],
["Der Kurs ist sehr international: Die Leute kommen aus zwölf Ländern.","The course is very international: the people come from twelve countries.",["g-plural","g-dat"]],
["Am ersten Tag stellen sich alle vor.","On the first day everyone introduces themselves.",["g-sep"]],
["Amira erzählt von ihrer Heimat und ihrer Familie.","Amira talks about her home country and her family.",["g-dat","g-poss"]],
["Ihr Partner ist Deutscher, er heißt Jan.","Her partner is German, his name is Jan.",["g-poss"]],
["Viele Ausländer im Kurs haben einen Partner aus Deutschland.","Lots of the foreigners in the course have a partner from Germany.",["g-plural","g-acc"]],
["Eine Frau aus Spanien ist schon eine gute Bekannte.","A woman from Spain is already a good acquaintance.",["g-adj"]],
["Sie lernen viele Menschen aus Europa und Asien kennen.","They get to know lots of people from Europe and Asia.",["g-sep","g-plural"]],
["Am Freitag gibt es ein kulturelles Fest mit ausländischem Essen.","On Friday there's a cultural party with food from abroad.",["g-adj","g-dat"]],
["Die europäische Küche kennt Amira schon, aber das Essen aus Vietnam ist neu für sie.","Amira already knows European food, but the food from Vietnam is new to her.",["g-adj","g-acc"]],
["Sie fühlt sich nicht mehr fremd.","She doesn't feel like a stranger any more.",["g-neg"]]],
q:[["Woher kommt Amira?",["aus Ägypten","aus Spanien","aus Vietnam"],0],["Was macht Amira jetzt?",["einen Kurs für Deutsch","ein Praktikum","eine Reise"],0],["Wer ist Jan?",["ihr Partner","ihr Lehrer","ein Kollege aus dem Kurs"],0]],r:["Wie geht es Amira jetzt?",["besser als am Anfang","schlechter als am Anfang","Sie möchte zurück in ihre Heimat."],0]},
{id:"a1-umzug",level:"A1",title:"Die neue Wohnung",en:"The new flat",s:[
["Ben zieht nächste Woche um.","Ben is moving house next week.",["g-sep"]],
["Er zieht aus seinem alten Apartment aus, denn es ist zu klein.","He's moving out of his old flat, because it's too small.",["g-sep","g-dat","g-conj"]],
["Die neue Wohnung hat drei Räume und einen Garten.","The new flat has three rooms and a garden.",["g-acc","g-plural"]],
["Ben mietet die Wohnung von Herrn Schulz.","Ben is renting the flat from Mr Schulz.",["g-dat"]],
["Herr Schulz ist der Vermieter. Er vermietet noch zwei andere Wohnungen.","Mr Schulz is the landlord. He rents out two other flats as well.",["g-plural"]],
["Die Miete ist nicht hoch: 650 Euro im Monat.","The rent isn't high: 650 euros a month.",["g-neg"]],
["Die Wohnung ist oben im Haus. Es gibt eine Treppe und einen Aufzug.","The flat is at the top of the building. There are stairs and a lift.",["g-acc"]],
["In der Küche stehen schon ein Herd und ein Kühlschrank.","There's already a cooker and a fridge in the kitchen.",["g-dat"]],
["Im Bad sind eine Dusche und eine Toilette.","In the bathroom there's a shower and a toilet.",["g-dat"]],
["Die Dusche ist kaputt, aber Herr Schulz repariert sie am Montag.","The shower is broken, but Mr Schulz is repairing it on Monday.",["g-acc"]],
["Die Reparatur kostet Ben nichts.","The repair doesn't cost Ben anything.",["g-neg"]],
["Ben hat nicht viele Möbel: ein Bett, einen Tisch und ein altes Sofa.","Ben doesn't have much furniture: a bed, a table and an old sofa.",["g-neg","g-acc","g-adj"]],
["Seine Freunde helfen ihm am Samstag.","His friends are helping him on Saturday.",["g-poss","g-dat"]]],
q:[["Warum zieht Ben aus?",["Das Apartment ist zu klein.","Die Miete ist zu hoch.","Er hat Streit mit dem Vermieter."],0],["Was ist kaputt?",["die Dusche","der Herd","der Aufzug im Haus"],0],["Wer hilft Ben?",["seine Freunde","Herr Schulz","niemand"],0]],r:["Was muss Ben vielleicht noch kaufen?",["Möbel","einen Kühlschrank","einen Herd"],0]},
{id:"a1-abend",level:"A1",title:"Ein ruhiger Abend",en:"A quiet evening",s:[
["Es ist ein normaler Abend für Lisa.","It's a normal evening for Lisa.",["g-adj"]],
["Es ist schon dunkel, also macht sie das Licht an.","It's already dark, so she turns on the light.",["g-sep"]],
["Die Lampe im Wohnzimmer ist sehr hell.","The lamp in the living room is very bright.",["g-dat"]],
["Dann stellt sie die Maschine für die Wäsche an.","Then she turns on the machine for the laundry.",["g-sep","g-acc"]],
["Lisa legt die Zeitung auf den Tisch und sieht fern.","Lisa puts the newspaper on the table and watches TV.",["g-sep","g-prep2","g-acc"]],
["Im Fernsehen gibt es gerade einen Film über Bilder und Maler.","There's a film about paintings and painters on TV right now.",["g-acc","g-plural"]],
["Der Film ist langweilig, also macht sie den Fernseher aus.","The film is boring, so she turns off the TV.",["g-sep","g-acc"]],
["Jetzt ist der Fernseher aus und das Radio an.","Now the TV is off and the radio is on.",[]],
["Sie hört eine alte CD, ganz leise.","She listens to an old CD, very quietly.",["g-acc","g-adj"]],
["Um zehn Uhr badet sie noch.","At ten o'clock she has a bath.",[]],
["Dann macht sie alle Lichter aus und geht ins Bett.","Then she turns off all the lights and goes to bed.",["g-sep","g-plural"]]],
q:[["Was macht Lisa zuerst?",["Sie macht das Licht an.","Sie hört Musik im Radio.","Sie liest die Zeitung im Bett."],0],["Warum macht sie den Fernseher aus?",["Der Film ist langweilig.","Er ist kaputt.","Sie möchte schlafen."],0],["Was hört Lisa?",["eine alte CD, ganz leise","Nachrichten","ein Gespräch"],0]],r:["Wie ist Lisas Abend?",["ruhig","laut und lustig","voll mit Arbeit"],0]},
{id:"a1-fruehstueck",level:"A1",title:"Frühstück am Sonntag",en:"Sunday breakfast",s:[
["Am Sonntag frühstücken wir immer lange.","On Sundays we always have a long breakfast.",[]],
["Mein Vater holt Brötchen in der Bäckerei.","My father gets rolls at the bakery.",["g-poss","g-dat","g-plural"]],
["Ich mache die Eier, für jeden ein Ei.","I make the eggs, one egg for everyone.",["g-plural"]],
["Auf dem Tisch stehen Butter, Käse und Schinken.","On the table there's butter, cheese and ham.",["g-dat"]],
["Meine Schwester hat großen Appetit und isst drei Brötchen.","My sister has a big appetite and eats three rolls.",["g-acc","g-adj"]],
["Ich habe Durst und trinke ein Glas Saft.","I'm thirsty and drink a glass of juice.",["g-acc"]],
["Eine Flasche Saft hat einen Liter.","A bottle of juice holds a litre.",["g-acc"]],
["Mama trinkt keinen Saft, ihr Getränk ist Kaffee.","Mum doesn't drink juice, her drink is coffee.",["g-neg","g-poss"]],
["Ohne Zucker ist der Kaffee sehr bitter.","Without sugar the coffee is very bitter.",["g-acc"]],
["Zum Schluss essen wir noch Obst: eine Birne und einen Apfel.","At the end we also eat some fruit: a pear and an apple.",["g-acc"]],
["Papa lacht: „Ich habe heute zweihundert Gramm Schinken gegessen!“","Dad laughs: 'I've eaten two hundred grams of ham today!'",["g-perf"]],
["Das Frühstück dauert zwei Stunden.","Breakfast takes two hours.",["g-plural"]]],
q:[["Wer holt die Brötchen?",["der Vater, in der Bäckerei","die Mutter","die Schwester"],0],["Was trinkt die Mutter?",["Kaffee","Saft","Tee mit Milch"],0],["Wie lange dauert das Frühstück?",["zwei Stunden","eine halbe Stunde","den ganzen Tag"],0]],r:["Warum trinkt die Person Saft?",["Sie hat Durst.","Sie mag keinen Kaffee mit Zucker.","Es gibt keine Milch."],0]},
{id:"a1-grillen",level:"A1",title:"Grillen im Garten",en:"A barbecue in the garden",s:[
["Heute grillen wir im Garten.","Today we're having a barbecue in the garden.",["g-dat"]],
["Wir haben eine Einladung an alle Nachbarn geschrieben.","We wrote an invitation to all the neighbours.",["g-perf","g-acc","g-plural"]],
["Am Morgen kaufen wir Lebensmittel im Supermarkt.","In the morning we buy food at the supermarket.",["g-dat"]],
["Es gibt Würstchen, Hähnchen und Fisch.","There are sausages, chicken and fish.",["g-plural"]],
["Für den Salat brauchen wir noch Öl.","We still need oil for the salad.",["g-acc"]],
["Um sechs Uhr macht Papa das Feuer an.","At six Dad lights the fire.",["g-sep","g-acc"]],
["Dann kommen die Gäste. „Herzlich willkommen!“, sagt Mama.","Then the guests arrive. 'Welcome!' says Mum.",["g-plural"]],
["Jeder Erwachsene bekommt ein Glas Wein, die Kinder trinken Saft.","Every adult gets a glass of wine, the children drink juice.",["g-acc","g-plural"]],
["Unser Nachbar Herr Kaya macht Pommes frites.","Our neighbour Mr Kaya makes chips.",["g-poss"]],
["Wir feiern bis elf Uhr.","We celebrate until eleven.",[]],
["Alle sagen: „Das ist besser als in einem Lokal!“","Everyone says: 'This is better than in a restaurant!'",["g-dat"]]],
q:[["Wo grillen sie?",["im Garten","im Park","in einem Lokal"],0],["Wer macht das Feuer an?",["Papa","Herr Kaya","Mama"],0],["Was trinken die Kinder?",["Saft","Wein","Wasser mit Zitrone"],0]],r:["Wie finden die Gäste das Fest?",["sehr gut","zu laut","ein bisschen langweilig"],0]},
{id:"a1-flughafen",level:"A1",title:"Am Flughafen",en:"At the airport",s:[
["Peter fliegt heute nach London.","Peter is flying to London today.",[]],
["Er ist schon um sechs Uhr am Flughafen.","He's at the airport by six.",["g-dat"]],
["Am Eingang ist ein Schild: „Abflug“ links, „Ankunft“ rechts.","At the entrance there's a sign: 'Departures' left, 'Arrivals' right.",["g-dat"]],
["In der Halle gibt er seinen Koffer ab.","In the hall he checks in his suitcase.",["g-sep","g-poss","g-dat"]],
["Er hat nur wenig Gepäck, denn er bleibt drei Tage.","He has only a little luggage, because he's staying three days.",["g-conj"]],
["An der Auskunft fragt er: „Wo ist mein Flugzeug?“","At the information desk he asks: 'Where is my plane?'",["g-dat","g-poss"]],
["Dann kommt eine Durchsage: „Achtung, bitte! Der Flug nach London fliegt eine Stunde später ab.“","Then there's an announcement: 'Attention, please! The flight to London leaves an hour later.'",["g-sep"]],
["Peter möchte rauchen, aber Rauchen ist hier verboten.","Peter would like to smoke, but smoking isn't allowed here.",["g-modal"]],
["Er trinkt einen Kaffee und wartet.","He drinks a coffee and waits.",["g-acc"]],
["Endlich hört er die Ansage für seinen Flug.","At last he hears the announcement for his flight.",["g-acc","g-poss"]],
["Er zeigt sein Ticket und steigt ein.","He shows his ticket and gets on.",["g-sep","g-poss"]],
["In London geht er schnell durch den Zoll und zum Ausgang.","In London he goes quickly through customs and to the exit.",["g-acc","g-dat"]]],
q:[["Wohin fliegt Peter?",["nach London","nach Berlin","nach Wien"],0],["Was sagt die Durchsage?",["Der Flug ist eine Stunde später.","Der Flug ist pünktlich.","Peter soll zur Auskunft kommen."],0],["Warum hat Peter wenig Gepäck?",["Er bleibt nur drei Tage.","Er hat keinen Koffer.","Das Ticket war billig."],0]],r:["Wie fühlt sich Peter wahrscheinlich beim Warten?",["ein bisschen müde","sehr wütend","total glücklich"],0]},
{id:"a1-norden",level:"A1",title:"Urlaub im Norden",en:"A holiday up north",s:[
["Familie Schulz reist gern.","The Schulz family likes travelling.",[]],
["Im letzten Sommer waren sie im Süden, in Italien.","Last summer they were in the south, in Italy.",["g-past","g-dat"]],
["Dieses Jahr fahren sie in den Norden, ans Meer.","This year they're going north, to the sea.",["g-acc"]],
["Im Reisebüro bekommen sie viele Tipps.","At the travel agency they get lots of tips.",["g-dat","g-plural"]],
["Sie fahren 600 Kilometer auf der Autobahn.","They drive 600 kilometres on the motorway.",["g-dat"]],
["Auf der Autobahn sind viele Lkw, das dauert lange.","There are lots of lorries on the motorway, it takes a long time.",["g-plural"]],
["Sie wohnen in einem kleinen Dorf.","They stay in a small village.",["g-dat","g-adj"]],
["Von ihrem Haus haben sie einen schönen Blick auf das Meer.","From their house they have a lovely view of the sea.",["g-acc","g-adj","g-poss"]],
["Am Dienstag besichtigen sie die Sehenswürdigkeiten von Hamburg.","On Tuesday they visit the sights of Hamburg.",["g-plural"]],
["Es gibt eine Führung mit einem Reiseführer.","There's a guided tour with a guide.",["g-dat"]],
["Im Osten von Hamburg ist ein schöner See.","In the east of Hamburg there's a lovely lake.",["g-dat"]],
["Nächstes Jahr möchte Papa ins Ausland fahren, in den Westen, nach Frankreich.","Next year Dad wants to go abroad, to the west, to France.",["g-modal","g-acc"]],
["Er findet: Jeder Ort hat etwas Schönes.","He thinks every place has something nice.",[]]],
q:[["Wohin fährt die Familie dieses Jahr?",["in den Norden","in den Süden","nach Italien"],0],["Wo wohnen sie?",["in einem Dorf","in einem großen Hotel in Hamburg","auf einem Schiff"],0],["Was machen sie am Dienstag?",["eine Führung","eine Reise in den Osten","Urlaub am See"],0]],r:["Warum dauert die Fahrt lange?",["Es sind viele Lkw auf der Autobahn.","Das Auto ist alt.","Sie machen viele Pausen."],0]},
{id:"a1-hotelmeer",level:"A1",title:"Ein Zimmer am Meer",en:"A room by the sea",s:[
["Herr und Frau Weber möchten am Meer übernachten.","Mr and Mrs Weber would like to stay overnight by the sea.",["g-modal","g-dat"]],
["Sie lesen einen Prospekt vom Hotel „Seeblick“.","They read a brochure from the hotel 'Seeblick'.",["g-acc","g-dat"]],
["Es gibt ein Angebot: zwanzig Prozent weniger im Oktober.","There's an offer: twenty percent off in October.",[]],
["Der Preis für ein Doppelzimmer ist sehr günstig.","The price of a double room is very good.",[]],
["Frau Weber ruft an der Rezeption an.","Mrs Weber phones the reception.",["g-sep","g-dat"]],
["„Haben Sie vom dritten bis zum siebten Oktober ein Zimmer frei?“","'Do you have a room free from the third to the seventh of October?'",["g-sie","g-dat"]],
["„Nur noch ein Einzelzimmer. Die Doppelzimmer sind alle besetzt.“","'Only a single room. The double rooms are all taken.'",["g-plural"]],
["„Und vom zehnten bis zum vierzehnten Oktober?“","'And from the tenth to the fourteenth of October?'",["g-dat"]],
["„Das Datum ist gut, dann haben wir ein Doppelzimmer mit Halbpension.“","'Those dates are fine, then we have a double room with half board.'",[]],
["Die Dame an der Rezeption empfiehlt auch eine Bootstour am Vormittag.","The lady at reception also recommends a boat trip in the morning.",["g-dat"]],
["Das Hotel bietet auch Fahrräder an.","The hotel offers bikes too.",["g-sep","g-plural"]],
["Herr Weber freut sich schon auf den Urlaub.","Mr Weber is already looking forward to the holiday.",["g-acc"]]],
q:[["Was gibt es im Oktober?",["ein Angebot","ein Fest im Hotel","eine Führung"],0],["Warum klappt der erste Termin nicht?",["Die Doppelzimmer sind besetzt.","Das Hotel ist zu teuer.","Herr Weber hat keine Zeit."],0],["Was empfiehlt die Dame?",["eine Bootstour","ein anderes Hotel","ein Restaurant im Dorf"],0]],r:["Wie findet Herr Weber den Plan?",["gut, er freut sich","zu teuer","langweilig"],0]},
{id:"a1-sbahn",level:"A1",title:"Schnell, schnell!",en:"Quick, quick!",s:[
["Nina hat es eilig, denn sie hat um neun Uhr einen Termin.","Nina is in a hurry, because she has an appointment at nine.",["g-conj","g-acc"]],
["Sie läuft zum Bahnsteig, aber die S-Bahn ist weg.","She runs to the platform, but the S-Bahn has gone.",["g-dat"]],
["Auf dem Plan steht: Die nächste Abfahrt ist um zwanzig vor neun.","The timetable says: the next departure is at twenty to nine.",["g-dat"]],
["Das dauert zu lange, dann bekommt sie ihren Anschluss nicht.","That takes too long, then she won't make her connection.",["g-poss","g-neg"]],
["Nina nimmt die Straßenbahn, aber die Bahn hat Verspätung.","Nina takes the tram, but the tram is late.",["g-acc"]],
["Sie wartet einen Moment, dann ruft sie ein Taxi.","She waits a moment, then she calls a taxi.",["g-acc"]],
["Der Fahrer fährt sehr schnell.","The driver drives very fast.",[]],
["„Keine Sekunde zu spät!“, sagt er um fünf vor neun.","'Not a second too late!' he says at five to nine.",["g-neg"]],
["Nina ist pünktlich und sehr froh.","Nina is on time and very happy.",[]],
["Das Taxi war teuer, aber heute ist das kein Problem.","The taxi was expensive, but today that's no problem.",["g-past","g-neg"]]],
q:[["Warum hat Nina es eilig?",["Sie hat einen Termin.","Sie muss zum Flughafen.","Sie hat Hunger."],0],["Was ist mit der S-Bahn?",["Sie ist schon weg, Nina ist zu spät.","Sie ist kaputt.","Sie kommt früh."],0],["Wie kommt Nina zum Termin?",["mit dem Taxi","mit der S-Bahn","zu Fuß"],0]],r:["Wie fühlt sich Nina am Ende?",["froh","traurig","sehr müde und wütend"],0]},
{id:"a1-bank",level:"A1",title:"Auf der Bank",en:"At the bank",s:[
["Max braucht Geld und geht zur Bank.","Max needs money and goes to the bank.",["g-acc","g-dat"]],
["Die Bank ist von neun bis sechzehn Uhr geöffnet.","The bank is open from nine to four.",[]],
["Es ist schon halb fünf, die Bank ist geschlossen.","It's already half past four, the bank is closed.",[]],
["Aber neben dem Eingang ist ein Automat.","But next to the entrance there's a cash machine.",["g-dat"]],
["Max holt fünfzig Euro von seinem Konto.","Max takes fifty euros from his account.",["g-dat","g-poss"]],
["Er muss auch die Miete überweisen, das macht er online.","He also has to transfer the rent, he does that online.",["g-modal","g-acc"]],
["Dann geht er zum Kiosk an der Ecke.","Then he goes to the kiosk on the corner.",["g-dat"]],
["Er kauft eine Zeitung und eine Flasche Wasser.","He buys a newspaper and a bottle of water.",["g-acc"]],
["Der Verkäufer fragt: „Möchten Sie auch Zigaretten?“","The seller asks: 'Would you like cigarettes too?'",["g-modal","g-sie","g-plural"]],
["„Nein danke, ich rauche nicht.“","'No thanks, I don't smoke.'",["g-neg"]],
["Das kostet drei Euro und fünfzig Cent.","That costs three euros fifty.",[]],
["Max steckt die Zeitung in seine Tasche.","Max puts the newspaper in his bag.",["g-acc","g-poss"]],
["In der Zeitung liest er eine Anzeige: Jemand verkauft ein Fahrrad.","In the newspaper he reads an ad: someone is selling a bike.",["g-acc"]],
["Max ist ein guter Kunde am Kiosk und kommt jeden Tag.","Max is a good customer at the kiosk and comes every day.",["g-adj"]]],
q:[["Warum kann Max nicht in die Bank?",["Sie ist geschlossen.","Er hat kein Konto.","Er hat keine Zeit."],0],["Was kauft Max am Kiosk?",["Zeitung und Wasser","Zigaretten und Kaffee","ein Fahrrad aus der Anzeige"],0],["Wie viel kostet das?",["3,50 Euro","5,30 Euro","50 Cent"],0]],r:["Was möchte Max vielleicht kaufen?",["ein Fahrrad","eine Wohnung","einen Automaten"],0]},
{id:"a1-jacke",level:"A1",title:"Eine neue Jacke",en:"A new jacket",s:[
["Leon braucht neue Kleidung für den Winter.","Leon needs new clothes for winter.",["g-acc","g-adj"]],
["Im Geschäft sucht er eine warme Jacke.","In the shop he looks for a warm jacket.",["g-dat","g-acc"]],
["Die Verkäuferin fragt: „Welche Größe haben Sie?“","The shop assistant asks: 'What size are you?'",["g-sie"]],
["„Größe M, bitte. Und welche Farben gibt es?“","'Size M, please. And what colours are there?'",["g-plural"]],
["„Weiß, grau und grün.“","'White, grey and green.'",[]],
["Leon probiert die grüne Jacke an.","Leon tries on the green jacket.",["g-sep","g-adj"]],
["Sie ist zu breit, er sieht darin komisch aus.","It's too wide, he looks funny in it.",["g-sep"]],
["Die graue Jacke gefällt ihm besser.","He likes the grey jacket better.",["g-dat","g-adj"]],
["„Das ist unsere beste Jacke“, sagt die Verkäuferin.","'That's our best jacket,' says the assistant.",["g-poss","g-adj"]],
["Sie ist nicht billig, aber Leon kriegt zehn Prozent weniger.","It isn't cheap, but Leon gets ten percent off.",["g-neg"]],
["Er kauft auch einen Schal, zwei Meter lang!","He also buys a scarf, two metres long!",["g-acc"]],
["„Auf Wiedersehen!“, sagt er und geht nach Hause.","'Goodbye!' he says and goes home.",[]],
["Seine Freundin sagt: „Du siehst wunderbar aus!“","His girlfriend says: 'You look wonderful!'",["g-sep","g-poss"]]],
q:[["Was sucht Leon?",["eine Jacke","eine Hose","Schuhe"],0],["Warum kauft er die grüne Jacke nicht?",["Sie ist zu breit.","Sie ist zu teuer.","Grün gefällt ihm nicht."],0],["Was kauft Leon noch?",["einen Schal","eine Mütze","Handschuhe"],0]],r:["Wie findet die Freundin die Jacke?",["sehr gut","zu grau","zu teuer für Leon"],0]},
{id:"a1-job",level:"A1",title:"Der erste Job",en:"The first job",s:[
["Tim ist Student und studiert Informatik.","Tim is a student and studies computer science.",[]],
["Sein Studium ist interessant, aber er braucht Geld.","His degree is interesting, but he needs money.",["g-poss"]],
["Er sucht einen Job für den Sommer.","He's looking for a job for the summer.",["g-acc"]],
["Im Internet findet er eine Stelle in einer Firma.","On the internet he finds a position in a company.",["g-dat","g-acc"]],
["Es ist ein Praktikum für drei Monate.","It's an internship for three months.",[]],
["Am ersten Tag zeigt ihm der Chef seinen Arbeitsplatz.","On the first day the boss shows him his workplace.",["g-dat","g-acc"]],
["Seine Kollegen sind nett, sie machen zusammen Pause.","His colleagues are nice, they take their break together.",["g-poss","g-plural"]],
["Tim verdient nicht viel, aber er lernt viel.","Tim doesn't earn much, but he learns a lot.",["g-neg"]],
["Sein Vater ist selbstständig, er hat einen eigenen Laden.","His father is self-employed, he has his own shop.",["g-poss","g-acc"]],
["Seine Mutter war früher arbeitslos, jetzt arbeitet sie als Lehrerin.","His mother used to be unemployed, now she works as a teacher.",["g-past"]],
["Sein Onkel ist Hausmann, und seine Oma war früher Hausfrau.","His uncle is a househusband, and his grandma used to be a housewife.",["g-poss","g-past"]],
["Welchen Beruf möchte Tim später haben? Das weiß er noch nicht.","What job does Tim want later? He doesn't know yet.",["g-modal","g-neg"]]],
q:[["Was macht Tim im Sommer?",["ein Praktikum","Urlaub","einen Kurs an der Uni"],0],["Wie sind die Kollegen?",["nett","laut","unfreundlich"],0],["Was ist der Vater von Tim?",["selbstständig","arbeitslos","Lehrer an einer Schule"],0]],r:["Warum sucht Tim einen Job?",["Er braucht Geld.","Er möchte nicht mehr studieren.","Sein Chef hat ihn gefragt."],0]},
{id:"a1-test",level:"A1",title:"Der Mathetest",en:"The maths test",s:[
["Jonas ist Schüler in der fünften Klasse.","Jonas is a pupil in Year 5.",["g-dat"]],
["Heute schreibt seine Klasse einen Test in Mathe.","Today his class is writing a maths test.",["g-poss","g-acc"]],
["Die Lehrerin gibt jedem Schüler ein Papier mit zehn Aufgaben.","The teacher gives every pupil a sheet with ten exercises.",["g-dat","g-plural"]],
["Der erste Teil ist leicht, der zweite Teil ist schwer.","The first part is easy, the second part is hard.",["g-adj"]],
["Bei Aufgabe sieben findet Jonas die Lösung nicht.","For exercise seven Jonas can't find the answer.",["g-neg","g-acc"]],
["Am nächsten Tag bekommt er das Ergebnis: drei Fehler.","The next day he gets the result: three mistakes.",["g-acc","g-plural"]],
["Die Lehrerin erklärt die Aufgabe noch einmal.","The teacher explains the exercise again.",["g-acc"]],
["Sie macht ein Beispiel an der Tafel.","She does an example on the board.",["g-dat"]],
["„Wir wiederholen das morgen, zum Beispiel mit einem Spiel.“","'We'll go over it again tomorrow, for example with a game.'",["g-dat"]],
["Die Hausaufgabe für Montag: fünf neue Aufgaben.","The homework for Monday: five new exercises.",["g-plural"]],
["Nach der Schule holt Jonas seine kleine Schwester vom Kindergarten ab.","After school Jonas picks up his little sister from kindergarten.",["g-sep","g-dat","g-poss"]],
["Die nächste Prüfung ist im Juli.","The next exam is in July.",["g-dat"]]],
q:[["In welchem Fach schreibt die Klasse einen Test?",["in Mathe","in Deutsch","in Englisch"],0],["Wie viele Fehler hat Jonas?",["drei","keine","zehn"],0],["Wen holt Jonas ab?",["seine Schwester","seinen Bruder","seine Mutter von der Arbeit"],0]],r:["Was macht die Lehrerin nach dem Test?",["Sie erklärt die Aufgabe noch einmal.","Sie schreibt einen neuen Test.","Sie gibt keine Hausaufgabe."],0]},
{id:"a1-brief",level:"A1",title:"Post für Oma",en:"Post for Grandma",s:[
["Oma Anna bekommt nicht gern E-Mails, sie mag Briefe.","Grandma Anna doesn't like getting emails, she likes letters.",["g-neg","g-plural"]],
["Lara schreibt ihr aus Spanien einen Brief.","Lara writes her a letter from Spain.",["g-dat","g-acc"]],
["Oben steht die Anrede: „Liebe Oma,“.","At the top is the greeting: 'Dear Grandma,'.",[]],
["Der Text ist kurz, nur zehn Sätze.","The text is short, only ten sentences.",["g-plural"]],
["Das Thema ist der Urlaub am Meer.","The topic is the holiday by the sea.",[]],
["Am Ende schreibt sie: „Viele Grüße, deine Lara“.","At the end she writes: 'Love, your Lara'.",["g-poss"]],
["Auf den Umschlag schreibt sie die Adresse von Oma mit Postleitzahl.","On the envelope she writes Grandma's address with the postcode.",["g-acc","g-dat"]],
["Links oben steht der Absender, in der Mitte der Empfänger.","The sender goes top left, the recipient in the middle.",["g-dat"]],
["Dann klebt sie eine Briefmarke auf den Brief.","Then she sticks a stamp on the letter.",["g-acc"]],
["Laras Vater schreibt lieber am Computer und druckt die Briefe.","Lara's father prefers to write on the computer and print the letters.",["g-plural"]],
["Aber sein Drucker ist alt, und das Fax funktioniert nicht mehr.","But his printer is old, and the fax doesn't work any more.",["g-poss","g-neg"]],
["Für Informationen klickt er im Internet einfach einen Link an.","For information he just clicks on a link on the internet.",["g-sep","g-acc"]]],
q:[["Was mag Oma Anna?",["Briefe","E-Mails","Anrufe"],0],["Worum geht es im Brief?",["um den Urlaub am Meer","um die Schule","um einen Geburtstag"],0],["Was funktioniert nicht mehr?",["das Fax","der Computer","Laras Handy"],0]],r:["Warum schreibt Lara einen Brief?",["Oma mag Briefe lieber als E-Mails.","Lara hat kein Internet.","Ein Brief ist billiger."],0]},
{id:"a1-telefon",level:"A1",title:"Ein wichtiger Anruf",en:"An important call",s:[
["Paul nimmt das Telefon und möchte mit der Firma Becker telefonieren.","Paul picks up the phone and wants to call the Becker company.",["g-modal","g-dat","g-acc"]],
["Er sucht die Vorwahl von Köln im Internet.","He looks up the area code for Cologne online.",["g-acc","g-dat"]],
["Das erste Mal ist die Nummer besetzt.","The first time the number is engaged.",[]],
["Dann hört er nur den Anrufbeantworter.","Then he only hears the answering machine.",["g-acc"]],
["Beim dritten Anruf spricht er mit einer Frau.","On the third call he speaks to a woman.",["g-dat"]],
["Sie spricht laut und klar.","She speaks loudly and clearly.",[]],
["„Entschuldigen Sie, wie ist Ihr Name?“","'Excuse me, what is your name?'",["g-sie","g-poss"]],
["„Paul Nowak. Ich buchstabiere ihn für Sie.“","'Paul Nowak. I'll spell it for you.'",["g-acc"]],
["Die Frau wiederholt jeden Buchstaben.","The woman repeats every letter.",["g-acc"]],
["Das Gespräch dauert zehn Minuten.","The conversation lasts ten minutes.",["g-plural"]],
["Am Ende sagt Paul: „Vielen Dank und auf Wiederhören!“","At the end Paul says: 'Thank you very much and goodbye!'",[]],
["Später erzählt er seiner Frau: „Ihre Aussage war klar: Ich habe die Stelle!“","Later he tells his wife: 'What she said was clear: I've got the job!'",["g-dat","g-poss"]]],
q:[["Was hört Paul beim zweiten Anruf?",["den Anrufbeantworter","eine Frau","Musik"],0],["Was macht Paul mit seinem Namen?",["Er buchstabiert ihn.","Er schreibt ihn auf.","Er sagt ihn nicht."],0],["Wie lange dauert das Gespräch?",["zehn Minuten","eine Stunde","zwei Minuten"],0]],r:["Wie fühlt sich Paul am Ende?",["sehr froh","traurig","ein bisschen wütend auf die Firma"],0]},
{id:"a1-bein",level:"A1",title:"Vorsicht!",en:"Careful!",s:[
["Lena möchte am Samstag Rad fahren.","Lena wants to go cycling on Saturday.",["g-modal"]],
["Im Park fährt sie sehr schnell. „Vorsicht!“, ruft ein Mann.","In the park she rides very fast. 'Careful!' a man shouts.",["g-dat"]],
["Zu spät: Sie fällt vom Fahrrad.","Too late: she falls off her bike.",["g-dat"]],
["Ein Mann bringt sie zum Doktor.","A man takes her to the doctor.",["g-acc","g-dat"]],
["Der Doktor sieht ihr in die Augen und in den Mund.","The doctor looks into her eyes and her mouth.",["g-dat","g-acc"]],
["„Haben Sie auch Schmerzen im Bauch?“ – „Nein, nur am Arm und am Bein.“","'Do you have pain in your stomach too?' – 'No, only in my arm and my leg.'",["g-sie","g-dat"]],
["Er wiegt sie auch. Ihr Gewicht ist normal.","He weighs her too. Her weight is normal.",["g-poss"]],
["„Das kann noch ein paar Tage weh tun“, sagt der Doktor.","'That may hurt for a few more days,' the doctor says.",["g-modal"]],
["„Aber Sie haben Glück: Es ist nichts kaputt.“","'But you're lucky: nothing is broken.'",["g-sie"]],
["Lena geht langsam allein nach Hause.","Lena walks home slowly on her own.",[]],
["Nächste Woche möchte sie wieder Rad fahren, aber langsamer.","Next week she wants to cycle again, but more slowly.",["g-modal"]]],
q:[["Was macht Lena am Samstag?",["Sie fährt Rad.","Sie geht schwimmen.","Sie arbeitet."],0],["Wo hat Lena Schmerzen?",["am Arm und am Bein","im Kopf","im Bauch und in den Augen"],0],["Was sagt der Doktor?",["Es ist nichts kaputt, aber es tut weh.","Sie muss ins Krankenhaus.","Sie darf nie Rad fahren."],0]],r:["Was macht Lena wahrscheinlich anders?",["Sie fährt langsamer.","Sie kauft ein neues Fahrrad.","Sie fährt nur noch Auto."],0]},
{id:"a1-ausflug",level:"A1",title:"Ein Ausflug im Frühling",en:"A spring outing",s:[
["In ihrer Freizeit macht Sara gern Sport.","In her free time Sara likes doing sport.",["g-poss","g-dat"]],
["Sie ist in einem Verein und geht oft wandern.","She's in a club and often goes hiking.",["g-dat"]],
["Im Frühling macht der Verein einen Ausflug in die Berge.","In spring the club goes on an outing to the mountains.",["g-acc","g-dat"]],
["Es ist sonnig, aber nur zwölf Grad.","It's sunny, but only twelve degrees.",[]],
["Oben ist viel Wind, und es ist kalt.","At the top it's very windy and cold.",[]],
["Überall sind Bäume und Blumen.","There are trees and flowers everywhere.",["g-plural"]],
["Mittags machen sie ein kleines Feuer und grillen.","At midday they make a small fire and have a barbecue.",["g-adj","g-acc"]],
["Am Abend ist Sara sehr müde.","In the evening Sara is very tired.",[]],
["Ihre Freundin fragt: „Kommst du mit in die Disco?“","Her friend asks: 'Are you coming to the disco?'",["g-sep","g-acc","g-poss"]],
["„Nein, der Eintritt ist teuer, und ich bin zu müde.“","'No, the entry is expensive, and I'm too tired.'",["g-neg"]],
["„Lieber gehen wir morgen ins Schwimmbad.“","'Let's go to the swimming pool tomorrow instead.'",["g-acc"]],
["Im Herbst möchte der Verein wieder wandern.","In autumn the club wants to go hiking again.",["g-modal","g-dat"]]],
q:[["Wohin macht der Verein einen Ausflug?",["in die Berge","ans Meer","in die Stadt"],0],["Wie ist das Wetter?",["sonnig, aber kalt","warm und windig","Es regnet den ganzen Tag."],0],["Warum geht Sara nicht in die Disco?",["Sie ist müde.","Sie hat kein Geld.","Sie mag keine Musik."],0]],r:["Was macht Sara morgen wahrscheinlich?",["Sie geht schwimmen.","Sie geht wandern.","Sie geht in die Disco."],0]},
{id:"a1-hochzeit",level:"A1",title:"Die Hochzeit",en:"The wedding",s:[
["Mein Bruder Jan heiratet im Juni.","My brother Jan is getting married in June.",[]],
["Seine Partnerin heißt Mia, sie kommt aus Wien.","His partner is called Mia, she comes from Vienna.",["g-poss"]],
["Wir haben eine schöne Einladung zur Hochzeit bekommen.","We got a lovely invitation to the wedding.",["g-perf","g-dat"]],
["Am Samstag sind alle Gäste in der Kirche.","On Saturday all the guests are in the church.",["g-dat","g-plural"]],
["Die Damen und Herren tragen schöne Kleidung.","The ladies and gentlemen wear lovely clothes.",["g-plural","g-adj"]],
["Nach der Hochzeit ist Mia Jans Ehefrau, und Jan ist Mias Ehemann.","After the wedding Mia is Jan's wife, and Jan is Mia's husband.",["g-dat"]],
["Alle gratulieren: „Herzlichen Glückwunsch!“","Everyone congratulates them: 'Congratulations!'",[]],
["Mein Onkel fragt: „Was für ein Auto ist das vor der Kirche?“","My uncle asks: 'What kind of car is that in front of the church?'",["g-dat"]],
["„Das Auto gehört Mias Vater“, sage ich.","'The car belongs to Mia's father,' I say.",["g-dat"]],
["Am Abend tanzen die Jugendlichen bis zwei Uhr.","In the evening the young people dance until two.",["g-plural"]],
["Mia sagt zu ihren Eltern: „Danke für euer Geschenk!“","Mia says to her parents: 'Thank you for your present!'",["g-dat","g-poss"]],
["Es war ein wunderbarer Tag.","It was a wonderful day.",["g-past","g-adj"]]],
q:[["Wann heiratet Jan?",["im Juni","im Mai","im Winter"],0],["Woher kommt Mia?",["aus Wien","aus Berlin","aus der Schweiz"],0],["Wem gehört das Auto?",["Mias Vater","Jan","dem Onkel"],0]],r:["Wie war die Hochzeit?",["schön","langweilig","zu kurz für die Gäste"],0]},
{id:"a1-quiz",level:"A1",title:"Ein Quiz im Radio",en:"A quiz on the radio",s:[
["Am Nachmittag hört Herr Weber ein Quiz im Radio.","In the afternoon Mr Weber listens to a quiz on the radio.",["g-acc","g-dat"]],
["Die erste Frage: „Wie viele Tage hat der Februar?“","The first question: 'How many days does February have?'",["g-plural"]],
["Herr Weber weiß es: achtundzwanzig, manchmal neunundzwanzig.","Mr Weber knows: twenty-eight, sometimes twenty-nine.",[]],
["Die zweite Frage: „Welcher Wochentag ist heute?“ Das ist leicht.","The second question: 'What day of the week is it today?' That's easy.",[]],
["Die dritte Frage ist schwer: „Wie viele Menschen leben in Köln?“","The third question is hard: 'How many people live in Cologne?'",["g-plural"]],
["Die Antwort: circa eine Million.","The answer: about a million.",[]],
["Die vierte Frage: „Was ist neunzig minus achtzig?“ – „Zehn!“","The fourth question: 'What's ninety minus eighty?' – 'Ten!'",[]],
["„Und tausend mal null?“ – „Null!“","'And a thousand times zero?' – 'Zero!'",[]],
["Die meiste Zeit weiß Herr Weber die Antwort.","Most of the time Mr Weber knows the answer.",[]],
["Seine beiden Kinder sind siebzehn und neunzehn Jahre alt.","His two children are seventeen and nineteen.",["g-poss","g-plural"]],
["Die Tochter ruft beim Radio an und beantwortet die letzte Frage: „Vierzehn!“","His daughter phones the radio and answers the last question: 'Fourteen!'",["g-sep"]],
["Die Familie gewinnt eine Reise im September!","The family wins a trip in September!",["g-acc"]]],
q:[["Wann hört Herr Weber das Quiz?",["am Nachmittag","am Morgen","in der Nacht"],0],["Was ist neunzig minus achtzig?",["zehn","zwanzig","achtzehn"],0],["Wer beantwortet die letzte Frage?",["die Tochter","Herr Weber","sein Sohn"],0]],r:["Was gewinnt die Familie?",["eine Reise","ein Radio","tausend Euro"],0]},
{id:"a1-museum",level:"A1",title:"Ein Tag im Museum",en:"A day at the museum",s:[
["Zurzeit arbeitet Frau Berger in einem Museum.","At the moment Mrs Berger works in a museum.",["g-dat"]],
["Sie kümmert sich um die Bilder und die Besucher.","She looks after the pictures and the visitors.",["g-acc","g-plural"]],
["Am Morgen macht sie zuerst alles in Ordnung.","In the morning she first puts everything in order.",[]],
["Sie stellt die Stühle in die Mitte und legt Prospekte daneben.","She puts the chairs in the middle and lays brochures next to them.",["g-acc","g-plural"]],
["Dann drückt sie auf einen Knopf, und die Tür geht automatisch auf.","Then she presses a button, and the door opens automatically.",["g-sep","g-acc"]],
["Das Museum erlaubt keine Fotos, und die Besucher dürfen keine Handys benutzen.","The museum doesn't allow photos, and visitors may not use mobile phones.",["g-modal","g-neg","g-plural"]],
["Ein bekannter Maler zeigt hier seine Bilder.","A well-known painter is showing his pictures here.",["g-adj","g-poss"]],
["Ein Mann fragt: „Was bedeutet dieses Bild?“","A man asks: 'What does this picture mean?'",[]],
["Frau Berger hält die Tür für eine alte Dame auf.","Mrs Berger holds the door open for an old lady.",["g-sep","g-acc"]],
["Plötzlich kommt die Polizei: Ein Auto steht falsch an der Ecke.","Suddenly the police arrive: a car is parked wrongly on the corner.",["g-dat"]],
["Danach geht der Tag ganz normal weiter.","After that the day carries on quite normally.",["g-sep"]],
["Die letzte Führung endet um fünf Uhr.","The last tour ends at five.",["g-adj"]],
["Um sechs Uhr hört die Arbeit auf.","At six the work stops.",["g-sep"]]],
q:[["Wo arbeitet Frau Berger?",["in einem Museum","in einer Bank","bei der Polizei"],0],["Was dürfen die Besucher nicht?",["Handys benutzen","Fragen stellen","Prospekte nehmen"],0],["Warum kommt die Polizei?",["Ein Auto steht falsch.","Ein Bild ist weg.","Ein Mann ist krank."],0]],r:["Wie ist der Tag für Frau Berger?",["ganz normal","sehr gefährlich","langweilig, ohne Besucher"],0]},
{id:"a1-grosseltern",level:"A1",title:"Bei Oma und Opa",en:"At Grandma and Grandpa's",s:[
["In den Ferien fahre ich zu meinen Großeltern.","In the holidays I go to my grandparents'.",["g-dat","g-poss"]],
["Sie wohnen in einem kleinen Dorf im Süden.","They live in a small village in the south.",["g-dat","g-adj"]],
["Meine Großmutter ist achtzig, mein Opa ist schon neunzig.","My grandmother is eighty, my grandpa is already ninety.",["g-poss"]],
["Beide arbeiten noch jeden Tag im Garten.","Both still work in the garden every day.",["g-dat"]],
["Im Garten steht ein hoher Baum mit Äpfeln.","In the garden there's a tall tree with apples.",["g-dat","g-adj","g-plural"]],
["Die Küche riecht immer nach Kuchen.","The kitchen always smells of cake.",["g-dat"]],
["Am Abend erzählt Opa von früher.","In the evening Grandpa tells stories about the old days.",["g-dat"]],
["Er ist hier geboren, das Dorf ist seine Heimat.","He was born here, the village is his home.",["g-perf","g-poss"]],
["Als Junge hatte er einen Hund, Bello.","As a boy he had a dog, Bello.",["g-past","g-acc"]],
["Bello ist schon lange tot, aber Opa hat noch ein Foto von ihm.","Bello has been dead a long time, but Grandpa still has a photo of him.",["g-dat"]],
["Oma sagt: „Wir haben Glück, wir sind gesund und haben euch.“","Grandma says: 'We're lucky, we're healthy and we have you.'",["g-acc"]]],
q:[["Wo wohnen die Großeltern?",["in einem Dorf","in einer großen Stadt","am Meer im Norden"],0],["Wie alt ist Opa?",["neunzig","achtzig","siebzig"],0],["Was hatte Opa als Junge?",["einen Hund","ein Pferd","eine Katze"],0]],r:["Wie finden die Großeltern ihr Leben?",["gut, sie haben Glück","langweilig","traurig"],0]}
];
